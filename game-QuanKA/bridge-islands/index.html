<!--
  Bridge Islands — QuanKA
  Hashi / Hashiwokakero. Join the islands with bridges: the number on an island
  is exactly how many bridges must touch it, bridges run only horizontally or
  vertically, never cross, and at most two link the same pair.

  WHY THE WIN CHECK NEEDS *TWO* TESTS (this is the trap of the genre):
  Energy Loops could decide a level with one BFS, because its pieces were cut
  from a spanning forest and "every cell lit" forced every stub to be matched.
  Hashi has no such property — a board can satisfy EVERY number and still fall
  into two separate groups (four islands numbered 1,1,1,1 in a row: pair up the
  outer two and the inner two, every number is happy, the board is in halves).
  So a win requires BOTH: (1) every island's degree equals its number, AND
  (2) one BFS from any island reaches all of them. The bot harness has a test
  aimed squarely at this.

  LEVELS ARE SOLVABLE BY DEDUCTION, PROVABLY:
  A level is built by laying down a legal SOLVED board first — each new island
  attaches to the existing component, and every span is checked before it is
  drawn — so connectivity and non-crossing hold by construction. The numbers are
  read off the degrees, and the puzzle is then handed to a solver that only ever
  makes FORCED moves (saturation, the per-neighbour floor, no-isolation). If that
  solver finishes, two things follow at once: the level needs no guessing, and
  its solution is unique — every bridge it placed was the only option, so a
  second solution cannot exist.

  The winning seed for each of the 60 levels was found offline and baked into
  SEED_OFF, so entering a level runs the generator exactly ONCE instead of
  searching (level 60 needed 46 tries — a visible hitch on a weak phone). Those
  offsets were also chosen to make `par` climb monotonically 5 -> 29; left to
  itself the generator made level 37 easier than level 31.

  Style: flat dark sea chart — solid fills, 0 gradients, 0 blur, no filter or
  backdrop-filter anywhere. Nothing here runs a requestAnimationFrame loop.

  Tuân thủ .claude/game-common.md (bridge, level, statusBarHeight, i18n),
  popup-common.md (game theo level => KHÔNG tự vẽ popup kết quả, showModal:true),
  zip-common.md (single-file index.html).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bridge Islands</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet" />
<style>
/* ── Reset + mobile tap fixes (game-common §UI) ───────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

:root {
  --ui-font: 'Google Sans Flex', system-ui, sans-serif;
  /* Flat sea-chart palette — every value is a solid colour. */
  --bg:        #0C1826;
  --panel:     #142334;
  --line:      #203349;
  --isle:      #23384F;   /* island body */
  --edge:      #3D5B7D;   /* a bridge outside the main group */
  --on:        #4FD8E3;   /* the group everything must join */
  --ok:        #4FE3A1;   /* island count satisfied */
  --over:      #FF5A4E;   /* island count exceeded */
  --text:      #E8EEF7;
  --text-soft: rgba(232,238,247,.52);
  --gold:      #FFC24D;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--ui-font);
  font-weight: 700;
  color: var(--text);
  background-color: var(--bg);
  /* Chart grid — painted once by the compositor, never redrawn. */
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 34px 34px, 34px 34px;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

/* ── Header — same FORM and same metrics as the other QuanKA games ─ */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  margin: 0 auto;
  width: 100%;
  max-width: 520px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: calc(max(var(--sbh, 0px), env(safe-area-inset-top, 0px)) + 8px)
           max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  pointer-events: none;
}
#topbar .btn3d, .hud-scores { pointer-events: auto; }

#hud-bar { display: flex; align-items: center; gap: 8px; }

/* Pill metrics come from index(exampleforheader).html — the file the mentor
   pointed at when the first Energy Loops header read ~20% too small. */
.hud-scores { flex: 1; min-width: 0; display: flex; gap: 8px; }
.hud-pill {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 8px 9px 4px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  -webkit-user-select: none; user-select: none;
}
.pill-text { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 1 0 auto; }
.pill-ico { flex: 0 0 auto; width: clamp(16px, 4.8vw, 21px); height: clamp(16px, 4.8vw, 21px); display: block; }
.hud-pill .label {
  font-size: clamp(10px, 3.2vw, 13px);
  font-weight: 800;
  letter-spacing: 1.4px;
  color: var(--text-soft);
  line-height: 1.05;
  white-space: nowrap;
}
.hud-pill .value {
  font-size: clamp(16px, 5vw, 24px);
  line-height: 1.1;
  color: var(--text);
  white-space: nowrap;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
#hud-best { color: var(--gold); }

/* Sub-row: LEVEL n | moves-left bar | moves left */
#hud-sub { display: flex; align-items: center; gap: 9px; padding: 0 2px; }
.sub-level {
  flex: 0 0 auto;
  font-size: 12px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-soft);
  white-space: nowrap;
}
.sub-level #hud-level { color: var(--text); font-weight: 900; }

#moves-bar-bg {
  flex: 1; min-width: 0; height: 12px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
}
#moves-bar-fill {
  height: 100%; width: 100%;
  background: var(--on);
  /* scaleX, NOT width — width relayouts and repaints the bar on every tap;
     transform stays on the compositor (fruit-connect's timer-bar lesson). */
  transform-origin: left center;
  transform: scaleX(1);
  will-change: transform;
  transition: transform .2s linear, background .3s;
}
#moves-bar-fill.warn { background: var(--gold); }
@keyframes movesDanger { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
#moves-bar-fill.danger { background: var(--over); animation: movesDanger .6s steps(2,end) infinite; }

#hud-left {
  flex: 0 0 auto; min-width: 30px; text-align: right;
  font-size: 15px; font-weight: 900; color: var(--text);
  font-variant-numeric: tabular-nums;
}
#hud-left.danger { color: var(--over); }

/* ── btn3d (game-common §1.4 / §1.6), flat skin ───────────────── */
.btn3d {
  --radius: 10px;
  --surface-color: var(--panel);
  --surface-text: var(--text);
  --surface-height: 42px;
  --surface-width: auto;
  --surface-padding-x: 16px;
  --surface-font-size: 16px;
  position: relative;
  display: inline-block;
  padding: 0; border: 0;
  background: transparent;
  cursor: pointer;
  font: inherit; color: inherit;
  -webkit-user-select: none; user-select: none;
}
.btn3d-shadow { display: none; }
.btn3d-surface {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--surface-height);
  width: var(--surface-width);
  padding: 0 var(--surface-padding-x);
  border-radius: var(--radius);
  background: var(--surface-color);
  border: 2px solid var(--line);
  color: var(--surface-text);
  font-family: var(--ui-font);
  font-size: var(--surface-font-size);
  font-weight: 800;
  letter-spacing: .6px;
  transition: transform .08s ease-out;
}
.btn3d:active .btn3d-surface { transform: scale(.93); }
.btn3d.btn-icon { --surface-height: 50px; --surface-width: 50px; --surface-padding-x: 0; --radius: 14px; }
.back-ico  { width: 52%; height: 52%; fill: currentColor; display: block; }
.snd-ico   { width: 58%; height: 58%; display: block; }
.snd-slash { display: none; }
#sound-btn.muted .snd-waves { display: none; }
#sound-btn.muted .snd-slash { display: block; }
#sound-btn.muted .snd-ico   { color: var(--text-soft); }

/* ── App / board ──────────────────────────────────────────────── */
#app {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#board {
  display: block;
  overflow: visible;
  transition: transform .3s ease-out;
}
#board.solved { transform: scale(1.03); }

/* ── The board itself.
      One <svg>; every island and every candidate bridge slot is created once at
      level load and then only ever has CLASSES swapped. A tap never creates or
      destroys a node, so it can never force a layout. ───────────── */
/* Bridges: a slot owns 4 lines — a dashed hint, the single, and the two halves
   of a double — and the group's class decides which of them is visible. */
.br line { stroke-linecap: round; }
.b-ghost  { stroke: var(--on); stroke-width: 5; stroke-dasharray: 9 11; opacity: .5; display: none; }
.b-one, .b-two-a, .b-two-b { stroke: var(--edge); stroke-width: 8; display: none; transition: stroke .2s linear; }
.br.n1 .b-one   { display: block; }
.br.n2 .b-two-a { display: block; }
.br.n2 .b-two-b { display: block; }
.br.ghost .b-ghost { display: block; }
.br.lit .b-one, .br.lit .b-two-a, .br.lit .b-two-b { stroke: var(--on); }

/* Islands */
.is-bg {
  fill: var(--isle);
  stroke: var(--edge);
  stroke-width: 5;
  transition: stroke .2s linear, fill .2s linear;
}
.is-n {
  fill: var(--text);
  font-family: var(--ui-font);
  font-weight: 900;
  font-size: 46px;
  text-anchor: middle;
  dominant-baseline: central;
  transition: fill .2s linear;
}
/* Islands report their COUNT; bridges report the GROUP. The first pass lit the
   island outline cyan for "joined to the main group" and stroked it green for
   "number satisfied" — two nearly identical colours on the same pixels, so a
   half-finished island was indistinguishable from a finished one. Splitting the
   two signals across different elements removes the clash entirely, and it is
   the more honest mapping: connectivity is a property of the bridges. */
.is.done .is-bg { fill: #17323C; stroke: var(--ok); }
.is.done .is-n  { fill: var(--ok); }
.is.over .is-bg { fill: #3A1E20; stroke: var(--over); }
.is.over .is-n  { fill: var(--over); }
/* Selected island: a ring that sits outside the body. */
.is-ring {
  fill: none;
  stroke: var(--gold);
  stroke-width: 4;
  stroke-dasharray: 7 9;
  opacity: 0;
  transition: opacity .15s linear;
}
.is.sel .is-ring { opacity: 1; }
@keyframes islePulse { 0%,100% { opacity: 1; } 50% { opacity: .34; } }
.is.hint .is-bg { animation: islePulse 1s ease-in-out infinite; }

.hit { fill: transparent; cursor: pointer; }

/* ── Coach mark: a hand that taps, plus the ripple it leaves ───────
      This is the tutorial. Captions are 2-5 words because the motion does the
      teaching. `left/top` are set once per step, never per frame; only
      transform/opacity animate, so both stay on the compositor. */
#coach {
  position: fixed;
  left: 0; top: 0;
  width: 0; height: 0;
  z-index: 7;
  pointer-events: none;   /* the board must stay tappable underneath */
  opacity: 1;
  transition: opacity .2s linear;
}
#coach.hidden { opacity: 0; visibility: hidden; }
/* `visibility: hidden` does NOT stop a CSS animation — it keeps ticking and
   costing compositor work for the rest of the session. Kill it outright. */
#coach.hidden #coach-hand, #coach.hidden #coach-ring { animation: none; }
#coach-ring {
  position: absolute;
  left: calc(var(--cz, 30px) * -1); top: calc(var(--cz, 30px) * -1);
  width: calc(var(--cz, 30px) * 2); height: calc(var(--cz, 30px) * 2);
  border-radius: 50%;
  /* White, not the theme cyan: the ripple has to stay visible on top of a green
     satisfied island, a cyan bridge, a gold selection ring and a red over-filled
     island alike, and cyan was the one colour that blended into two of them. */
  border: 3px solid #fff;
  animation: coachRipple 1.6s ease-out infinite;
}
/* Same pointing-hand asset as runic-blaze's tutorial, so the gesture reads the
   same across QuanKA games. The outer div carries the static anchor offset that
   puts the fingertip on the target; the inner img carries the press bob — a CSS
   animation cannot be combined with a separate static transform on one element. */
#coach-hand-anchor {
  position: absolute;
  left: 0; top: 0;
  width: calc(var(--cz, 30px) * 3.6);
  transform: translate(-20%, -7%);
}
#coach.ring-only #coach-hand-anchor { display: none; }
#coach-hand {
  display: block;
  width: 100%; height: auto;
  animation: coachBob 1.6s ease-in-out infinite;
}
@keyframes coachBob {
  0%, 100% { transform: translateY(0); }
  38%      { transform: translateY(calc(var(--cz, 30px) * -0.12)); }
  55%      { transform: translateY(calc(var(--cz, 30px) * 0.22)); }
  72%      { transform: translateY(0); }
}
/* Never fully invisible: the ring sits dim as a target marker for the first
   half, then flashes and expands on the press. A ripple that vanishes for part
   of the cycle leaves the coach mark looking like a stray dot in between. */
@keyframes coachRipple {
  0%, 50%  { transform: scale(.62); opacity: .32; }
  60%      { transform: scale(.70); opacity: .95; }
  100%     { transform: scale(1.25); opacity: 0; }
}

/* ── Tutorial banner ──────────────────────────────────────────── */
#tut {
  position: fixed;
  left: 0; right: 0;
  bottom: max(14px, env(safe-area-inset-bottom));
  margin: 0 auto;
  width: min(92%, 460px);
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  opacity: 1;
  transition: opacity .25s linear;
}
#tut.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
#tut-text { flex: 1; font-size: 14px; font-weight: 700; line-height: 1.35; color: var(--text); }
#tut-skip { --surface-height: 30px; --surface-font-size: 12px; --surface-padding-x: 12px; flex: 0 0 auto; }

/* ── Level-complete flourish — the star rating ONLY: no title, no scrim, no
      buttons. The app owns the win popup (popup-common §1) and this must not
      look like a second one; stars are the one thing the app cannot know. ── */
#done {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  pointer-events: none;
  opacity: 1;
  transform: scale(1);
  transition: opacity .25s linear, transform .25s ease-out;
}
#done.hidden { opacity: 0; transform: scale(.86); visibility: hidden; }
#done svg { width: clamp(44px, 14vw, 62px); height: clamp(44px, 14vw, 62px); display: block; }
.star-p { fill: #26334A; stroke: var(--bg); stroke-width: 1.4; }
.star-p.won { fill: var(--gold); }
</style>
</head>
<body>

<div id="topbar">
  <div id="hud-bar">
    <div class="btn3d btn-icon" id="back-btn" role="button" aria-label="Back" tabindex="0">
      <span class="btn3d-shadow"></span>
      <span class="btn3d-surface">
        <svg class="back-ico" viewBox="0 0 447.243 447.243" aria-hidden="true">
          <path fill="currentColor" d="M420.361 192.229a31.967 31.967 0 0 0-5.535-.41H99.305l6.88-3.2a63.998 63.998 0 0 0 18.08-12.8l88.48-88.48c11.653-11.124 13.611-29.019 4.64-42.4-10.441-14.259-30.464-17.355-44.724-6.914a32.018 32.018 0 0 0-3.276 2.754l-160 160c-12.504 12.49-12.515 32.751-.025 45.255l.025.025 160 160c12.514 12.479 32.775 12.451 45.255-.063a32.084 32.084 0 0 0 2.745-3.137c8.971-13.381 7.013-31.276-4.64-42.4l-88.32-88.64a64.002 64.002 0 0 0-16-11.68l-9.6-4.32h314.24c16.347.607 30.689-10.812 33.76-26.88 2.829-17.445-9.019-33.88-26.464-36.71z"/>
        </svg>
      </span>
    </div>

    <div class="hud-scores">
      <div class="hud-pill">
        <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14 L18.3 21 L12 17.3 L5.7 21 L7.3 14 L2 9.3 L9.1 8.6 Z"
                fill="#ffce4d" stroke="#e39a12" stroke-width="1" stroke-linejoin="round"/>
        </svg>
        <div class="pill-text">
          <div class="label" id="lbl-score">SCORE</div>
          <div class="value" id="hud-score">0</div>
        </div>
      </div>
      <div class="hud-pill">
        <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 18 L4.2 8 L9 12.5 L12 5.5 L15 12.5 L19.8 8 L21 18 Z" fill="#ffce4d" stroke="#c8820a" stroke-width="1.2" stroke-linejoin="round"/>
          <rect x="3.4" y="16.6" width="17.2" height="3" rx="1.2" fill="#f0a800"/>
          <circle cx="4.2" cy="8" r="1.5" fill="#fff3c4"/>
          <circle cx="12" cy="5.5" r="1.6" fill="#fff3c4"/>
          <circle cx="19.8" cy="8" r="1.5" fill="#fff3c4"/>
        </svg>
        <div class="pill-text">
          <div class="label" id="lbl-best">BEST</div>
          <div class="value" id="hud-best">0</div>
        </div>
      </div>
    </div>

    <div class="btn3d btn-icon" id="sound-btn" role="button" aria-label="Sound" tabindex="0">
      <span class="btn3d-shadow"></span>
      <span class="btn3d-surface">
        <svg class="snd-ico" viewBox="0 0 100 100" aria-hidden="true">
          <path fill="currentColor" d="M14 38 v24 h16 l21 18 V20 L30 38 Z"/>
          <path class="snd-waves" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" d="M62 36 q9 14 0 28 M73 27 q15 23 0 46"/>
          <path class="snd-slash" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" d="M63 35 L86 65 M86 35 L63 65"/>
        </svg>
      </span>
    </div>
  </div>

  <div id="hud-sub">
    <span class="sub-level"><span id="lbl-level">LEVEL</span> <span id="hud-level">1</span></span>
    <div id="moves-bar-bg"><div id="moves-bar-fill"></div></div>
    <span id="hud-left">0</span>
  </div>
</div>

<div id="app">
  <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Board"></svg>
</div>

<!-- Coach mark. Sits above the board but never intercepts a tap
     (pointer-events:none), so the player can act at any time. -->

let LANG = DEFAULT_LANG;
/** key -> current language, then `en`, then the key itself. */
function t(key) {
  return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
}
function getLanguage() {
  const fromWin = typeof window.language === 'string' ? window.language : null;
  const fromUrl = new URLSearchParams(window.location.search).get('language');
  const raw = fromWin != null ? fromWin : fromUrl;
  return SUPPORTED_LANGS.indexOf(raw) !== -1 ? raw : DEFAULT_LANG;
}
function applyUiFont(lang) {
  if (!LATIN_LANGS.has(lang)) {
    document.documentElement.style.setProperty('--ui-font', 'system-ui, sans-serif');
  }
}

/* ================================================================
 * §1. Native bridge (game-common §1) — game WITH levels
 * ============================================================= */
const TOTAL_LEVELS = 60;
let currentLevelIdx = 0;

function post(msg) {
  try {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    } else {
      console.log('[bridge-islands → native]', msg);
      devSimulateNative(msg);
    }
  } catch (e) { /* ignore */ }
}
function sendMessage(type, opts) {
  opts = opts || {};
  post({
    type: type,
    level: currentLevelIdx + 1,
    result: opts.result != null ? opts.result : null,
    data: opts.data != null ? opts.data : null,
    showModal: opts.showModal === true,
  });
}
/** Dev-only: a plain browser has no app popup, so fake the button the app
 *  would show. Never runs inside the real WebView. */
let devAuto = true;
function devSimulateNative(msg) {
  if (!devAuto) return;
  if (msg.type !== 'game_result' || msg.showModal !== true) return;
  setTimeout(function () {
    if (msg.result === 'win' && typeof window.onNextLevel === 'function') window.onNextLevel();
    else if (typeof window.onRetryLevel === 'function') window.onRetryLevel();
  }, 1400);
}
function saveData(payload) {
  const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
  sendMessage('save_data', { data: data });
}

const LS_KEY = 'bridge_islands_v1';
function saveLocal(payload) {
  try {
    const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
    localStorage.setItem(LS_KEY, data);
  } catch (e) { /* private mode / quota */ }
}
function readLocal() { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
/** `?reset=1` wipes the saved snapshot before boot reads it, so a fresh install
 *  can be replayed without clearing browser storage by hand. Never sent by
 *  native. `?tutorial=1` replays the tutorial only — a convention the mentors
 *  check for (Feedback sheet r18) even though it is not in game-common. */
function maybeResetLocal() {
  if (new URLSearchParams(window.location.search).get('reset') === '1') {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }
}
function forcedTutorial() {
  return new URLSearchParams(window.location.search).get('tutorial') === '1';
}

function getStatusBarHeight() {
  const params = new URLSearchParams(window.location.search);

}

/* ================================================================
 * §2. Run state + persistence
 * ============================================================= */
let stars = new Array(TOTAL_LEVELS).fill(0);   // 0..3 per level
let muted = false;
let tutorialSeen = false;
let score = 0;
let best = 0;
let progressIdx = 0;

function snapshot() {

}

/* `localStorage.setItem` is synchronous disk I/O; doing it on every tap puts

const SNAP_MS = 500;

  if (snapTimer) return;
  snapTimer = setTimeout(function () { snapTimer = 0; saveLocal(snapshot()); }, SNAP_MS);
}

  saveLocal(snapshot());

/* ================================================================
 * §3. Level generation + the deduction solver
 * ============================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t2 = Math.imul(a ^ (a >>> 15), 1 | a);
    t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2;
    return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296;
  };
}
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // N E S W

/** Cells strictly between two aligned cells. */
function between(r1, c1, r2, c2) {
  const out = [];
  if (r1 === r2) {
    const a = Math.min(c1, c2), b = Math.max(c1, c2);
    for (let c = a + 1; c < b; c++) out.push([r1, c]);
  } else {
    const a = Math.min(r1, r2), b = Math.max(r1, r2);
    for (let r = a + 1; r < b; r++) out.push([r, c1]);
  }
  return out;
}

/** Lay down a legal SOLVED board. Every island attaches to what is already
 *  there, and every span is checked before being drawn, so the result is
 *  connected and crossing-free by construction. */
function buildSolved(W, H, targetIslands, rng) {
  const cellOf = new Int32Array(W * H).fill(-1);
  const blocked = new Uint8Array(W * H);
  const isl = [], deg = [];
  const edges = new Map();
  const idx = (r, c) => r * W + c;
  const inGrid = (r, c) => r >= 0 && r < H && c >= 0 && c < W;

  /** Islands may not sit orthogonally next to each other: every bridge needs at
   *  least one empty cell to be drawn in. */
  function adjacentToIsland(r, c) {
    for (let d = 0; d < 4; d++) {
      const rr = r + DIRS[d][0], cc = c + DIRS[d][1];
      if (inGrid(rr, cc) && cellOf[idx(rr, cc)] >= 0) return true;
    }
    return false;
  }
  function freeCell(r, c) {
    return inGrid(r, c) && cellOf[idx(r, c)] === -1 && !blocked[idx(r, c)];
  }
  /** Parallel overlap is impossible (an island would have to sit on a blocked
   *  cell), so this one check also covers perpendicular crossings. */
  function spanFree(r1, c1, r2, c2) {
    const cells = between(r1, c1, r2, c2);
    if (!cells.length) return false;
    for (const cell of cells) if (!freeCell(cell[0], cell[1])) return false;
    return true;
  }
  function markSpan(r1, c1, r2, c2) {
    const cells = between(r1, c1, r2, c2);
    for (const cell of cells) blocked[idx(cell[0], cell[1])] = 1;
  }
  const key = (i, j) => (i < j ? i + ',' + j : j + ',' + i);

  isl.push({ r: Math.floor(rng() * H), c: Math.floor(rng() * W) });
  deg.push(0);
  cellOf[idx(isl[0].r, isl[0].c)] = 0;

  const MAX_TRIES = targetIslands * 260;
  let tries = 0;
  while (isl.length < targetIslands && tries++ < MAX_TRIES) {
    const a = Math.floor(rng() * isl.length);
    if (deg[a] >= 8) continue;
    const d = Math.floor(rng() * 4);
    const dist = 2 + Math.floor(rng() * 3);
    const nr = isl[a].r + DIRS[d][0] * dist;
    const nc = isl[a].c + DIRS[d][1] * dist;
    if (!freeCell(nr, nc) || adjacentToIsland(nr, nc)) continue;
    if (!spanFree(isl[a].r, isl[a].c, nr, nc)) continue;
    const k = (rng() < 0.34 && deg[a] <= 6) ? 2 : 1;
    if (deg[a] + k > 8) continue;
    const b = isl.length;
    isl.push({ r: nr, c: nc }); deg.push(0);
    cellOf[idx(nr, nc)] = b;
    edges.set(key(a, b), k);
    deg[a] += k; deg[b] += k;
    markSpan(isl[a].r, isl[a].c, nr, nc);
  }
  return { W: W, H: H, isl: isl, deg: deg, edges: edges, cellOf: cellOf, blocked: blocked };
}

/** Nearest island in each direction with an island-free span. Static: depends
 *  only on island placement, never on which bridges are currently drawn. */
function computeNeighbors(bd) {
  const W = bd.W, H = bd.H, isl = bd.isl, cellOf = bd.cellOf;
  const idx = (r, c) => r * W + c;
  const nbrs = isl.map(function () { return []; });
  for (let i = 0; i < isl.length; i++) {
    for (let d = 0; d < 4; d++) {
      let r = isl[i].r + DIRS[d][0], c = isl[i].c + DIRS[d][1], steps = 0;
      while (r >= 0 && r < H && c >= 0 && c < W) {
        const j = cellOf[idx(r, c)];
        if (j >= 0) { if (steps >= 1) nbrs[i].push(j); break; }
        r += DIRS[d][0]; c += DIRS[d][1]; steps++;
      }
    }
  }
  return nbrs;
}

/** Extra bridges between existing islands -> cycles, so the board is not a bare
 *  tree and there is more to deduce. */
function addCycles(bd, rng, want) {
  const W = bd.W, isl = bd.isl, deg = bd.deg, edges = bd.edges;
  const idx = (r, c) => r * W + c;
  const nbrs = computeNeighbors(bd);
  const key = (i, j) => (i < j ? i + ',' + j : j + ',' + i);
  const cand = [];
  for (let i = 0; i < isl.length; i++) {
    for (const j of nbrs[i]) {
      if (j <= i || edges.has(key(i, j))) continue;
      cand.push([i, j]);
    }
  }
  for (let i = cand.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = cand[i]; cand[i] = cand[j]; cand[j] = tmp;
  }
  let added = 0;
  for (const pair of cand) {
    if (added >= want) break;
    const i = pair[0], j = pair[1];
    if (deg[i] >= 8 || deg[j] >= 8) continue;
    const cells = between(isl[i].r, isl[i].c, isl[j].r, isl[j].c);
    let ok = cells.length > 0;
    for (const cell of cells) {
      if (bd.cellOf[idx(cell[0], cell[1])] >= 0 || bd.blocked[idx(cell[0], cell[1])]) { ok = false; break; }
    }
    if (!ok) continue;
    const k = (rng() < 0.3 && deg[i] <= 6 && deg[j] <= 6) ? 2 : 1;
    if (deg[i] + k > 8 || deg[j] + k > 8) continue;
    edges.set(key(i, j), k);
    deg[i] += k; deg[j] += k;
    for (const cell of cells) bd.blocked[idx(cell[0], cell[1])] = 1;
    added++;
  }
  return added;
}

/** Which candidate bridge slots would physically cross each other. */
function computeCrossing(isl, pairs) {
  const cellKey = (r, c) => r * 1000 + c;
  const sets = pairs.map(function (p) {
    const s = new Set();
    const cells = between(isl[p[0]].r, isl[p[0]].c, isl[p[1]].r, isl[p[1]].c);
    for (const cell of cells) s.add(cellKey(cell[0], cell[1]));
    return s;
  });
  const cross = pairs.map(function () { return []; });
  for (let p = 0; p < pairs.length; p++) {
    const hp = isl[pairs[p][0]].r === isl[pairs[p][1]].r;
    for (let q = p + 1; q < pairs.length; q++) {
      const hq = isl[pairs[q][0]].r === isl[pairs[q][1]].r;
      if (hp === hq) continue;                     // parallel: cannot cross
      let hit = false;
      for (const k of sets[q]) if (sets[p].has(k)) { hit = true; break; }
      if (hit) { cross[p].push(q); cross[q].push(p); }
    }
  }
  return cross;
}

/** All candidate bridge slots + their crossing table. */
function buildPairs(bd) {
  const nbrs = computeNeighbors(bd);
  const pairs = [], seen = new Set();
  for (let i = 0; i < bd.isl.length; i++) {
    for (const j of nbrs[i]) {
      const k = i < j ? i + ',' + j : j + ',' + i;
      if (seen.has(k)) continue;
      seen.add(k);
      pairs.push(i < j ? [i, j] : [j, i]);
    }
  }
  return { nbrs: nbrs, pairs: pairs, crossing: computeCrossing(bd.isl, pairs) };
}

/** Pure constraint propagation — it NEVER guesses. Finishing therefore proves
 *  both that the level needs no guessing and that its solution is unique:
 *  every bridge it placed was the only legal option at that moment. */
function solve(numbers, pairs, crossing) {
  const P = pairs.length;
  const lo = new Uint8Array(P), hi = new Uint8Array(P).fill(2);
  const inc = numbers.map(function () { return []; });
  for (let p = 0; p < P; p++) {
    inc[pairs[p][0]].push(p);
    inc[pairs[p][1]].push(p);
  }
  function need(i) { let s = 0; for (const p of inc[i]) s += lo[p]; return numbers[i] - s; }
  function capacity(i) { let s = 0; for (const p of inc[i]) s += hi[p] - lo[p]; return s; }
  function findFn(extraP) {
    const par = numbers.map(function (_, i) { return i; });
    const find = function (x) { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    for (let p = 0; p < P; p++) {
      if (lo[p] > 0 || p === extraP) {
        const a = find(pairs[p][0]), b = find(pairs[p][1]);
        if (a !== b) par[a] = b;
      }
    }
    return find;
  }

  let changed = true, guard = 0;
  while (changed && guard++ < 4000) {
    changed = false;

    /* a drawn bridge kills every bridge it would cross */
    for (let p = 0; p < P; p++) {
      if (lo[p] > 0) {
        for (const q of crossing[p]) {
          if (hi[q] > 0) {
            if (lo[q] > 0) return null;
            hi[q] = 0; changed = true;
          }
        }
      }
    }
    /* per-island counting: saturation, plus the floor forced onto a neighbour */
    for (let i = 0; i < numbers.length; i++) {
      const r = need(i), C = capacity(i);
      if (r < 0 || r > C) return null;
      for (const p of inc[i]) {
        const cap = hi[p] - lo[p];
        if (cap === 0) continue;
        const must = r - (C - cap);
        if (must > 0) { lo[p] += must; changed = true; }
        if (hi[p] - lo[p] > r) { hi[p] = lo[p] + r; changed = true; }
      }
    }
    /* never close off a saturated group that is not the whole board */
    for (let p = 0; p < P; p++) {
      if (hi[p] <= lo[p]) continue;
      const a = pairs[p][0], b = pairs[p][1];
      if (need(a) !== 1 || need(b) !== 1) continue;
      const find = findFn(p);
      const root = find(a);
      let size = 0, saturated = true;
      for (let i = 0; i < numbers.length; i++) {
        if (find(i) !== root) continue;
        size++;
        if (need(i) - ((i === a || i === b) ? 1 : 0) !== 0) { saturated = false; break; }
      }
      if (saturated && size < numbers.length) { hi[p] = lo[p]; changed = true; }
    }
  }
  for (let p = 0; p < P; p++) if (lo[p] !== hi[p]) return null;
  for (let i = 0; i < numbers.length; i++) if (need(i) !== 0) return null;
  return lo;
}

function levelConfig(lv) {                       // lv is 1-indexed
  if (lv <= 3)  return { W: 5, H: 5,  n: 5,  cyc: 1 };
  if (lv <= 8)  return { W: 5, H: 6,  n: 6,  cyc: 2 };
  if (lv <= 14) return { W: 6, H: 6,  n: 8,  cyc: 2 };
  if (lv <= 22) return { W: 6, H: 7,  n: 10, cyc: 3 };
  if (lv <= 30) return { W: 6, H: 8,  n: 12, cyc: 3 };
  if (lv <= 38) return { W: 7, H: 8,  n: 14, cyc: 4 };
  if (lv <= 45) return { W: 7, H: 9,  n: 16, cyc: 4 };
  if (lv <= 52) return { W: 7, H: 10, n: 19, cyc: 5 };
  return              { W: 7, H: 10, n: 22, cyc: 6 };
}

/* Seed offset per level, found offline (see the header comment). Each one is
   verified to succeed on the FIRST attempt, and to give the par printed in the
   README, so entering a level costs one generate call and no search. */
const SEED_OFF = [2,1,3,1,1,0,3,12,93,7,23,16,5,7,20,55,54,18,15,4,7,64,5,19,11,6,2,2,16,0,94,42,15,2,41,4,6,12,15,51,22,11,8,51,82,47,76,133,21,19,41,57,56,230,28,42,121,35,16,45];

/** One attempt at a level from a specific seed. */
function tryLevel(W, H, targetIslands, cycles, seed) {
  const rng = mulberry32(seed);
  const bd = buildSolved(W, H, targetIslands, rng);
  if (bd.isl.length < targetIslands) return null;
  addCycles(bd, rng, cycles);
  const numbers = bd.deg.slice();
  for (const n of numbers) if (n < 1 || n > 8) return null;
  const built = buildPairs(bd);
  const sol = solve(numbers, built.pairs, built.crossing);
  if (!sol) return null;
  for (let p = 0; p < built.pairs.length; p++) {
    const k = built.pairs[p][0] + ',' + built.pairs[p][1];
    if (sol[p] !== (bd.edges.get(k) || 0)) return null;
  }
  return {
    w: W, h: H, isl: bd.isl, numbers: numbers,
    pairs: built.pairs, crossing: built.crossing, sol: Array.from(sol),
  };
}

/** Deterministic per level: the baked offset first, then a search as a safety
 *  net so a future tweak to the generator can never leave a level unplayable. */
function genLevel(idx) {
  const lv = idx + 1;
  const cfg = levelConfig(lv);
  const baseSeed = lv * 100003;
  const baked = SEED_OFF[idx];
  if (baked >= 0) {
    const L = tryLevel(cfg.W, cfg.H, cfg.n, cfg.cyc, baseSeed + baked);
    if (L) return L;
  }
  for (let a = 0; a < 20000; a++) {
    const L = tryLevel(cfg.W, cfg.H, cfg.n, cfg.cyc, baseSeed + a);
    if (L) return L;
  }
  return null;
}

/** par = total bridges in the solution = sum of the numbers / 2. */
function parOf(numbers) {
  let s = 0;
  for (const n of numbers) s += n;
  return s / 2;
}
/** A wrong bridge costs THREE moves to undo (1 -> 2 -> 0), where a wrong tile
 *  in Energy Loops usually cost one. Hence the roomier multipliers. */
function movesLimitFor(par, levelNum) {
  let k;
  if (levelNum <= 9)       k = 3.4;
  else if (levelNum <= 20) k = 2.8;
  else if (levelNum <= 35) k = 2.5;
  else if (levelNum <= 50) k = 2.3;
  else                     k = 2.2;
  return Math.max(par + 4, Math.ceil(par * k));
}
function levelScoreFor(levelNum, movesLeft) { return 50 * levelNum + 25 * movesLeft; }
function starsFor(moves, par) {
  if (moves <= par) return 3;
  if (moves <= Math.ceil(par * 1.4)) return 2;
  return 1;
}

/* ================================================================
 * §4. Render

const SVGNS = 'http://www.w3.org/2000/svg';

const R_ISLE = 37;                // island radius

const elTopbar = document.getElementById('topbar');
const elLevel  = document.getElementById('hud-level');

const elCoach  = document.getElementById('coach');
const elTutText = document.getElementById('tut-text');
const elDone   = document.getElementById('done');

let B = null;            // live board
let islGroups = null;    // <g class="is"> per island
let brGroups = null;     // <g class="br"> per pair
let lockInput = false;
let runOver = false;
let levelEpoch = 0;
let sel = -1;            // selected island, -1 = none

const cx = (c) => c * CELL + CELL / 2;
const cy = (r) => r * CELL + CELL / 2;

function mk(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/** Build every node the level will ever need, once. Taps only swap classes. */
function buildBoard() {
  elBoard.textContent = '';
  elBoard.setAttribute('viewBox', '0 0 ' + (B.w * CELL) + ' ' + (B.h * CELL));

  const gBr = mk('g', {}), gIs = mk('g', {}), gHit = mk('g', {});
  brGroups = [];
  for (let p = 0; p < B.pairs.length; p++) {
    const a = B.isl[B.pairs[p][0]], b = B.isl[B.pairs[p][1]];
    const x1 = cx(a.c), y1 = cy(a.r), x2 = cx(b.c), y2 = cy(b.r);
    const horiz = a.r === b.r;
    const ox = horiz ? 0 : OFF2, oy = horiz ? OFF2 : 0;
    const g = mk('g', { class: 'br n0' });
    g.appendChild(mk('line', { class: 'b-ghost', x1: x1, y1: y1, x2: x2, y2: y2 }));
    g.appendChild(mk('line', { class: 'b-one',   x1: x1, y1: y1, x2: x2, y2: y2 }));
    g.appendChild(mk('line', { class: 'b-two-a', x1: x1 - ox, y1: y1 - oy, x2: x2 - ox, y2: y2 - oy }));
    g.appendChild(mk('line', { class: 'b-two-b', x1: x1 + ox, y1: y1 + oy, x2: x2 + ox, y2: y2 + oy }));
    gBr.appendChild(g);
    brGroups.push(g);
  }

  islGroups = [];
  for (let i = 0; i < B.isl.length; i++) {
    const x = cx(B.isl[i].c), y = cy(B.isl[i].r);
    const g = mk('g', { class: 'is' });
    g.appendChild(mk('circle', { class: 'is-ring', cx: x, cy: y, r: R_ISLE + 9 }));
    g.appendChild(mk('circle', { class: 'is-bg',   cx: x, cy: y, r: R_ISLE }));
    const tx = mk('text', { class: 'is-n', x: x, y: y });
    tx.textContent = String(B.numbers[i]);
    g.appendChild(tx);
    gIs.appendChild(g);
    islGroups.push(g);

    const hit = mk('circle', { class: 'hit', cx: x, cy: y, r: R_ISLE + 13 });
    hit.setAttribute('data-i', String(i));
    gHit.appendChild(hit);
  }

  elBoard.appendChild(gBr);
  elBoard.appendChild(gIs);
  elBoard.appendChild(gHit);   // taps land on top of everything
}

/** Degree of each island from the bridges currently drawn. */
function degrees() {
  const deg = new Array(B.isl.length).fill(0);
  for (let p = 0; p < B.pairs.length; p++) {
    const k = B.counts[p];
    if (!k) continue;
    deg[B.pairs[p][0]] += k;
    deg[B.pairs[p][1]] += k;
  }
  return deg;
}
/** Islands reachable from `root` over the bridges currently drawn. */
function componentOf(root) {
  const seen = new Uint8Array(B.isl.length);
  const adj = B.adj;
  const stack = [root];
  seen[root] = 1;
  let n = 1;
  while (stack.length) {
    const i = stack.pop();
    for (const e of adj[i]) {
      if (!B.counts[e.p] || seen[e.o]) continue;
      seen[e.o] = 1; n++; stack.push(e.o);
    }
  }
  return { seen: seen, n: n };
}
/** The biggest group on the board — the one the player is growing. Using a
 *  fixed root instead would leave the highlight dark while the player builds a
 *  perfectly good group somewhere else. */
function largestComponent() {
  const done = new Uint8Array(B.isl.length);
  let bestSeen = null, bestN = -1;
  for (let i = 0; i < B.isl.length; i++) {
    if (done[i]) continue;
    const comp = componentOf(i);
    for (let j = 0; j < comp.seen.length; j++) if (comp.seen[j]) done[j] = 1;
    if (comp.n > bestN) { bestN = comp.n; bestSeen = comp.seen; }
  }
  return { seen: bestSeen, n: bestN };
}

/** Can this slot take another bridge right now? A slot blocked by a bridge it
 *  would cross is not offered at all. */
function slotBlocked(p) {
  for (const q of B.crossing[p]) if (B.counts[q] > 0) return true;
  return false;
}

function renderState() {
  const deg = degrees();
  const comp = largestComponent();

  for (let i = 0; i < islGroups.length; i++) {
    const g = islGroups[i];
    g.classList.toggle('done', deg[i] === B.numbers[i]);
    g.classList.toggle('over', deg[i] > B.numbers[i]);
    g.classList.toggle('lit', comp.seen[i] === 1 && comp.n > 1);
    g.classList.toggle('sel', i === sel);
  }
  for (let p = 0; p < brGroups.length; p++) {
    const g = brGroups[p];
    const k = B.counts[p];
    g.classList.toggle('n0', k === 0);
    g.classList.toggle('n1', k === 1);
    g.classList.toggle('n2', k === 2);
    g.classList.toggle('lit', k > 0 && comp.seen[B.pairs[p][0]] === 1);
    /* dashed hint on every slot the selected island can still use */
    const isCand = sel >= 0 && (B.pairs[p][0] === sel || B.pairs[p][1] === sel) &&
                   (k > 0 || !slotBlocked(p));
    g.classList.toggle('ghost', isCand && k === 0);
  }
}

function updateHud() {
  elLevel.textContent = String(currentLevelIdx + 1);
  elScore.textContent = String(score);
}
function updateBestHud() { elBest.textContent = String(best); }
function updateMovesHud() {
  const left = Math.max(0, B.movesLimit - B.moves);
  elLeft.textContent = String(left);
  const frac = B.movesLimit ? left / B.movesLimit : 0;
  elBarFill.style.transform = 'scaleX(' + frac.toFixed(4) + ')';
  const warn = frac <= 1 / 3 && frac > 1 / 6;
  const danger = frac <= 1 / 6;
  elBarFill.classList.toggle('warn', warn);
  elBarFill.classList.toggle('danger', danger);
  elLeft.classList.toggle('danger', danger);
}

let topbarH = 0;
/** The status-bar gap is pure CSS — `calc(max(--sbh, env(safe-area-inset-top)))`
 *  in #topbar — so the OS value still wins when native reports 0 on a notched
 *  phone (game-common §2). JS only feeds --sbh and reads the height. */
function measureTopbar() {
  document.documentElement.style.setProperty('--sbh', getStatusBarHeight() + 'px');
  topbarH = elTopbar.offsetHeight;
}
function layout() {
  if (!B) return;
  const availW = Math.min(window.innerWidth, 520) - 24;
  const availH = window.innerHeight - topbarH - 30;
  const cell = Math.max(30, Math.floor(Math.min(availW / B.w, availH / B.h)));
  elBoard.setAttribute('width', String(cell * B.w));
  elBoard.setAttribute('height', String(cell * B.h));
  document.getElementById('app').style.paddingTop = topbarH + 'px';
}
window.addEventListener('resize', function () {
  measureTopbar();
  layout();
  /* The coach mark is positioned in viewport pixels, so it has to follow the
     board when the board moves (rotation, keyboard, split-screen). */
  if (coachIsle >= 0) coachAt(coachIsle, elCoach.classList.contains('ring-only'));
});

/* ================================================================
 * §5. Input — tap an island, then tap a partner
 * ============================================================= */
elBoard.addEventListener('pointerdown', function (e) {
  const el = e.target;
  if (!el || !el.getAttribute) return;
  const raw = el.getAttribute('data-i');
  if (raw == null) return;
  e.preventDefault();
  tapIsland(Number(raw));
});

/** The slot joining i and j, or -1. */
function slotBetween(i, j) {
  for (const e of B.adj[i]) if (e.o === j) return e.p;
  return -1;
}

function tapIsland(i) {
  if (lockInput || !B) return;
  ensureAudio();

  if (sel === -1 || sel === i) {
    sel = (sel === i) ? -1 : i;
    sfxClick(true);
    renderState();
    /* Selecting is a real step of the lesson, and it changes nothing on the
       board — so the tutorial has to hear about it here, not only where a
       bridge appears. Without this the first tap looked like a dead tap. */
    if (tutStep >= 0) tutOnSelect();
    return;
  }
  const p = slotBetween(sel, i);
  if (p < 0) {                       // not reachable from the selection
    sel = i;
    sfxClick(true);
    renderState();
    if (tutStep >= 0) tutOnSelect();
    return;
  }
  const k = B.counts[p];
  if (k === 0 && slotBlocked(p)) {   // would cross a bridge already drawn
    sfxClick(true);
    return;
  }
  /* 0 -> 1 -> 2 -> 0. Clearing a double is ONE move, not two. */
  B.counts[p] = (k + 1) % 3;
  /* Drop the selection afterwards. Keeping it would save a tap when building a
     double, but then every following tap on a NEIGHBOUR of the still-selected
     island draws a bridge instead of selecting it — the player reaches for the
     next island and silently spends a move. Move cost is identical either way
     (a move counts a board change, not a tap), so the safe reading wins. */
  sel = -1;
  B.moves++;
  updateMovesHud();
  sfxConnect(B.counts[p]);
  renderState();
  persistLocalOnly();
  if (tutStep >= 0) { tutLastSlot = p; tutOnConnect(); }

  if (isSolved()) levelSolved();
  else if (B.moves >= B.movesLimit) levelLost();
}

/** BOTH tests. Satisfying every number is NOT enough — see the file header. */
function isSolved() {
  const deg = degrees();
  for (let i = 0; i < B.numbers.length; i++) if (deg[i] !== B.numbers[i]) return false;
  return componentOf(0).n === B.isl.length;
}

/* ================================================================
 * §6. Game flow
 * ============================================================= */
function newRun() {
  score = 0;
  runOver = false;
  updateBestHud();
  loadLevel(0);
}

function loadLevel(idx) {
  levelEpoch++;
  currentLevelIdx = Math.max(0, Math.min(idx, TOTAL_LEVELS - 1));
  const L = genLevel(currentLevelIdx);
  if (!L) return;

  B = L;
  B.counts = new Array(B.pairs.length).fill(0);
  B.moves = 0;
  B.solved = false;
  B.par = parOf(B.numbers);
  B.movesLimit = movesLimitFor(B.par, currentLevelIdx + 1);
  /* adjacency, so a tap never re-scans the pair list */
  B.adj = B.isl.map(function () { return []; });
  for (let p = 0; p < B.pairs.length; p++) {
    B.adj[B.pairs[p][0]].push({ p: p, o: B.pairs[p][1] });
    B.adj[B.pairs[p][1]].push({ p: p, o: B.pairs[p][0] });
  }

  sel = -1;
  lockInput = false;
  runOver = false;
  elBoard.classList.remove('solved');
  elDone.classList.add('hidden');

  buildBoard();
  layout();
  renderState();
  updateHud();
  updateMovesHud();

  if (currentLevelIdx > progressIdx) progressIdx = currentLevelIdx;
  maybeStartTutorial();
  persist();
}

/** Replay a half-played board saved in localStorage. */
function restoreBridges(str, moves) {
  if (typeof str !== 'string' || str.length !== B.pairs.length) return;
  /* A snapshot taken on the move that spent the last turn would restore into a
     board that is already dead — drop it and start the level fresh. */
  if (!(moves >= 0 && moves < B.movesLimit)) return;
  for (let p = 0; p < str.length; p++) {
    const k = str.charCodeAt(p) - 48;
    if (k >= 0 && k <= 2) B.counts[p] = k;
  }
  B.moves = moves;
  renderState();
  updateMovesHud();
  if (isSolved()) levelSolved();
}

function levelSolved() {
  if (B.solved) return;
  B.solved = true;
  lockInput = true;
  sel = -1;
  renderState();
  elBoard.classList.add('solved');

  const left = Math.max(0, B.movesLimit - B.moves);
  score += levelScoreFor(currentLevelIdx + 1, left);
  const s = starsFor(B.moves, B.par);
  if (s > stars[currentLevelIdx]) stars[currentLevelIdx] = s;
  if (score > best) best = score;

  updateHud();
  updateBestHud();
  showDone(s);
  sfxWin();
  if (currentLevelIdx + 1 > progressIdx) progressIdx = currentLevelIdx + 1;
  persist();

  /* The flourish plays first; the app's popup comes after (popup-common §1). */
  const ep = levelEpoch;
  setTimeout(function () {
    if (ep !== levelEpoch) return;
    if (currentLevelIdx >= TOTAL_LEVELS - 1) {
      sendMessage('victory', { showModal: true });
    } else {
      sendMessage('game_result', { result: 'win', showModal: true });
      /* a break every 5 levels (game-common §1.7) */
      if ((currentLevelIdx + 1) % 5 === 0) sendMessage('ads');
    }
  }, 1100);
}

/** Out of moves ends the whole RUN, exactly like animal-connect: the app shows
 *  its lose popup, and Retry restarts from level 1 with the score cleared. */
function levelLost() {
  if (runOver) return;
  runOver = true;
  lockInput = true;
  sel = -1;
  renderState();
  if (score > best) best = score;
  updateBestHud();
  persist();
  sfxLose();
  const ep = levelEpoch;
  setTimeout(function () {
    if (ep !== levelEpoch) return;
    sendMessage('game_result', { result: 'lose', showModal: true });
  }, 700);
}

function showDone(s) {
  elDone.textContent = '';
  for (let i = 0; i < 3; i++) {
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    const path = mk('path', {
      class: 'star-p' + (i < s ? ' won' : ''),
      d: 'M12 2 L14.9 8.6 L22 9.3 L16.7 14 L18.3 21 L12 17.3 L5.7 21 L7.3 14 L2 9.3 L9.1 8.6 Z',
    });
    svg.appendChild(path);
    elDone.appendChild(svg);
  }
  elDone.classList.remove('hidden');
}

/* ── Native callbacks (game-common §1.3) ─────────────────────── */
window.onAppPause = function () {
  persist();
  try { if (ac && ac.suspend) ac.suspend(); } catch (e) {}
};
/* The WebView can be backgrounded without native calling onAppPause, so make
   the queued snapshot durable on the platform's own teardown signals too. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') flushLocal();
});
window.addEventListener('pagehide', flushLocal);

window.onNextLevel = function () {
  if (currentLevelIdx < TOTAL_LEVELS - 1) loadLevel(currentLevelIdx + 1);
  else loadLevel(currentLevelIdx);
};
window.onRetryLevel = function () {
  if (runOver) newRun();
  else loadLevel(currentLevelIdx);
};

/* ── HUD buttons ─────────────────────────────────────────────── */
document.getElementById('back-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  persist();
  sendMessage('quit');
});
/* No Restart button by design (mentor, 2026-08-06): with a moves budget the
   fail state IS the reset, and the app's lose popup owns Retry. */
document.getElementById('sound-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  this.classList.toggle('muted', muted);
  if (!muted) { ensureAudio(); sfxClick(false); }
  persist();
});

/* ================================================================
 * §7. Tutorial — 3 steps, never blocks a tap (fruit-drop lesson)
 * ============================================================= */
let tutStep = -1;
let tutTimer = 0;
let tutOffered = false;

/** Runs on the FIRST level of the session, not specifically level 1 — the app
 *  can drop a brand-new player straight onto level 7 via `currentLevel`, and
 *  they would otherwise never be told what a tap does. */
function maybeStartTutorial() {
  if ((tutorialSeen && !forcedTutorial()) || tutOffered) { hideTutorial(); return; }
  tutOffered = true;
  tutLastSlot = -1;      // never carry a slot index across boards
  tutStep = 0;
  showTutStep();
}

let coachIsle = -1;
/** Park the coach mark over an island. `left/top` only — the bob and the ripple
 *  are CSS animations on transform/opacity, so this never runs per frame. */
function coachAt(i, ringOnly) {
  if (!islGroups || !islGroups[i]) return;
  const r = islGroups[i].getBoundingClientRect();
  coachIsle = i;
  elCoach.style.setProperty('--cz', Math.max(17, Math.min(32, r.width * 0.42)) + 'px');
  elCoach.style.left = (r.left + r.width / 2) + 'px';
  elCoach.style.top = (r.top + r.height / 2) + 'px';
  elCoach.classList.toggle('ring-only', ringOnly === true);
  elCoach.classList.remove('hidden');
}
function hideCoach() { coachIsle = -1; elCoach.classList.add('hidden'); }

/* Four steps, each one action with a result the player can see the instant they
   do it: pick an island -> pick its partner -> a bridge exists and that island's
   number is now met -> here is the goal. Nothing is ever blocked; if the player
   taps somewhere else, the coach re-aims at whatever they actually selected, so
   the lesson stays true instead of pointing at a stale island. */
const TUT_KEYS = ['tutTap1', 'tutTap2', 'tutRule', 'tutGoal'];
let tutLastSlot = -1;

/** A neighbour worth joining `i` to: prefer a bridge the solution really wants,
 *  so following the coach is a correct move and not a wasted one. */
function tutPartnerFor(i) {
  if (i < 0 || !B.adj[i]) return -1;
  for (const e of B.adj[i]) {
    if (B.sol[e.p] > B.counts[e.p] && !(B.counts[e.p] === 0 && slotBlocked(e.p))) return e.o;
  }
  for (const e of B.adj[i]) {
    if (B.counts[e.p] > 0 || !slotBlocked(e.p)) return e.o;
  }
  return -1;
}

function showTutStep() {
  elTutText.textContent = t(TUT_KEYS[tutStep]);
  elTutText.dir = (LANG === 'ar') ? 'rtl' : 'ltr';
  elTut.classList.remove('hidden');
  clearHint();
  clearTimeout(tutTimer);

  if (tutStep === 0) {
    /* One island, not a pair — step 2 introduces the partner. Hinting both at
       once was half the reason "Tap two islands" read as one confusing move. */
    let start = -1;
    for (let p = 0; p < B.sol.length && start < 0; p++) if (B.sol[p] > B.counts[p]) start = B.pairs[p][0];
    if (start < 0) start = 0;
    islGroups[start].classList.add('hint');
    coachAt(start, false);
    /* advances when the player selects anything — see tutOnSelect */

  } else if (tutStep === 1) {
    /* Aim at a partner of whatever is selected RIGHT NOW. If they deselected,
       drop back a step rather than point at nothing. */
    const target = (sel >= 0) ? tutPartnerFor(sel) : -1;
    if (target < 0) { tutStep = 0; showTutStep(); return; }
    islGroups[target].classList.add('hint');
    coachAt(target, false);

  } else if (tutStep === 2) {
    /* Ring an island whose number is now MET, so "Number = bridges" is being
       read off a green island the player just finished — the old version put
       this caption on an island with no bridges at all, which proved nothing. */
    const deg = degrees();
    let target = -1;
    if (tutLastSlot >= 0) {
      const ends = B.pairs[tutLastSlot];
      for (const i of ends) if (deg[i] === B.numbers[i]) { target = i; break; }
      if (target < 0) target = ends[0];
    }
    if (target < 0) for (let i = 0; i < B.numbers.length && target < 0; i++) if (deg[i] === B.numbers[i]) target = i;
    if (target >= 0) { islGroups[target].classList.add('hint'); coachAt(target, true); }
    else hideCoach();
    tutTimer = setTimeout(function () { tutStep = 3; showTutStep(); }, 2600);

  } else {
    hideCoach();
    tutTimer = setTimeout(finishTutorial, 3000);
  }
}
/** The player picked an island — that is step 1 done. */
function tutOnSelect() {
  if (tutStep === 0 && sel >= 0) { tutStep = 1; showTutStep(); }
  else if (tutStep === 1) showTutStep();      // re-aim at the new selection
}
/** A bridge appeared — jump straight to the rule, whichever step we were on. */
function tutOnConnect() {
  if (tutStep === 0 || tutStep === 1) { tutStep = 2; showTutStep(); }
  else if (tutStep === 3) { clearTimeout(tutTimer); tutTimer = setTimeout(finishTutorial, 1800); }
}
function clearHint() {
  if (!islGroups) return;
  for (const g of islGroups) g.classList.remove('hint');
}
function finishTutorial() {
  tutorialSeen = true;
  persist();
  hideTutorial();
}
function hideTutorial() {
  tutStep = -1;
  clearTimeout(tutTimer);
  elTut.classList.add('hidden');
  hideCoach();
  clearHint();
}
document.getElementById('tut-skip').addEventListener('click', function (e) {
  e.stopPropagation();
  finishTutorial();
});

/* ================================================================
 * §8. Audio — synthesised, no asset files
 * ============================================================= */
let ac = null, bus = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} } return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    bus = ac.createGain();
    bus.gain.value = 0.22;
    bus.connect(ac.destination);
  } catch (e) { ac = null; }
}
function blip(freq, dur, type, gain, delay) {
  if (!ac || muted) return;
  try {
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) { /* ignore */ }
}
function sfxClick(soft) { blip(soft ? 320 : 420, 0.06, 'triangle', 0.32); }
function sfxConnect(k) {
  if (k === 0) { blip(240, 0.09, 'triangle', 0.3); return; }   // cleared
  blip(k === 2 ? 660 : 520, 0.09, 'triangle', 0.42);
}
function sfxWin() {
  const notes = [523, 659, 784, 1046];
  for (let i = 0; i < notes.length; i++) blip(notes[i], 0.2, 'triangle', 0.4, i * 0.075);
}
function sfxLose() {
  blip(300, 0.22, 'sawtooth', 0.3);
  blip(190, 0.32, 'sawtooth', 0.28, 0.13);
}

/* ================================================================
 * §9. Boot
 * ============================================================= */
function bootGame() {
  maybeResetLocal();
  LANG = getLanguage();
  applyUiFont(LANG);
  document.getElementById('lbl-score').textContent = t('score');
  document.getElementById('lbl-best').textContent = t('best');
  document.getElementById('lbl-level').textContent = t('level');
  document.getElementById('tut-skip-label').textContent = t('skip');

  const saved = parseInitialData();
  let resumeIdx = 0, resumeBr = null, resumeMoves = 0;
  if (saved) {
    if (typeof saved.st === 'string') {
      for (let i = 0; i < TOTAL_LEVELS && i < saved.st.length; i++) {
        const v = saved.st.charCodeAt(i) - 48;
        stars[i] = (v >= 0 && v <= 3) ? v : 0;
      }
    }
    muted = saved.m === 1 || saved.m === true;
    tutorialSeen = saved.tut === 1 || saved.tut === true;
    if (typeof saved.best === 'number' && saved.best >= 0) best = Math.floor(saved.best);
    if (typeof saved.sc === 'number' && saved.sc >= 0) score = Math.floor(saved.sc);
    if (score > best) best = score;
    if (typeof saved.lv === 'number' && saved.lv >= 0) resumeIdx = Math.min(saved.lv, TOTAL_LEVELS - 1);
    if (typeof saved.br === 'string') { resumeBr = saved.br; resumeMoves = saved.mv || 0; }
  }
  /* The app is authoritative when it names a level; otherwise use our own saved
     progress (game-common §3: 0/absent means "no saved level"). */
  const fromNative = getInitialLevelIdx();
  const startIdx = fromNative >= 0 ? fromNative : resumeIdx;
  /* Only replay the snapshot onto the level it was taken on. */
  if (!saved || saved.blv !== startIdx) resumeBr = null;

  document.getElementById('sound-btn').classList.toggle('muted', muted);
  measureTopbar();
  loadLevel(startIdx);
  updateBestHud();
  if (resumeBr) restoreBridges(resumeBr, resumeMoves);
}

/* Android can run injectedJavaScriptBeforeContentLoaded AFTER this inline
   script, so poll briefly for any injected input, then boot anyway. */
(function waitForNativeInjection() {
  let waited = 0;
  const STEP = 20, LIMIT = 200;
  (function tick() {
    const ready = typeof window.statusBarHeight !== 'undefined' ||
                  typeof window.currentLevel !== 'undefined' ||
                  typeof window.data !== 'undefined' ||
                  typeof window.language !== 'undefined';
    if (ready || waited >= LIMIT) { bootGame(); return; }
    waited += STEP;
    setTimeout(tick, STEP);
  })();
})();

/* QA hook — used by the headless bot harness, harmless in production. */
window.__bi = {
  get B() { return B; },
  get level() { return currentLevelIdx; },
  get score() { return score; },
  get best() { return best; },
  get runOver() { return runOver; },
  get sel() { return sel; },
  tap: tapIsland,
  load: loadLevel,
  newRun: newRun,
  isSolved: isSolved,
  degrees: degrees,
  componentOf: componentOf,
  genLevel: genLevel,
  tryLevel: tryLevel,
  solve: solve,
  buildSolved: buildSolved,
  buildPairs: buildPairs,
  between: between,
  levelConfig: levelConfig,
  movesLimitFor: movesLimitFor,
  levelScoreFor: levelScoreFor,
  parOf: parOf,
  starsFor: starsFor,
  slotBetween: slotBetween,
  SEED_OFF: SEED_OFF,
  TOTAL_LEVELS: TOTAL_LEVELS,
  setAuto: function (v) { devAuto = !!v; },
};
</script>
