function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ================================================================
 * §4. Tile pool + layout
 * Tiles are allocated ONCE at the maximum board size and recycled forever.
 * Nothing is created or destroyed during play, and a tile's grid position
 * lives in its inline `transform` so a fall is a single style write that the
 * compositor animates — no per-frame JavaScript while tiles are moving.
 * ============================================================= */
const MAX_CELLS = 7 * 16;       // largest board in LEVEL_RAMP; pool is sized once
const XLINK = 'http://www.w3.org/1999/xlink';
const pool = [];
let poolUsed = 0;

function buildPool() {
  for (let i = 0; i < MAX_CELLS; i++) {
    const el = document.createElement('div');
    el.className = 'tile hidden';
    el.innerHTML = '<div class="tile-face"><svg viewBox="0 0 32 32" aria-hidden="true">' +
                   '<use href="#f0"></use></svg></div>';
    boardEl.appendChild(el);
    const entry = {
      el: el,
      face: el.firstChild,
      use: el.getElementsByTagName('use')[0],
      type: -1, r: -1, c: -1,
    };
    el.__tile = entry;          // back-reference for O(1) tap hit-testing
    pool.push(entry);
  }
}
/** `href` is SVG2 (Chromium 49+); the xlink form keeps very old WebViews happy. */
function setTileType(t, type) {
  if (t.type === type) return;
  t.type = type;
  t.use.setAttribute('href', '#f' + type);
  t.use.setAttributeNS(XLINK, 'xlink:href', '#f' + type);
}
function takeTile(type, r, c) {
  const t = pool[poolUsed++];
  setTileType(t, type);
  t.r = r; t.c = c;
  t.el.className = 'tile';
  /* Deliberately NOT laid out here. Every caller of buildTileDom() runs
     resize() immediately afterwards, and resize() -> layoutAll() positions the
     whole board in one pass. Doing it per tile as well meant 192 extra width /
     height / transform writes per level load - and they were WRONG anyway,
     because the board size changes between levels so cellPx here is still the
     PREVIOUS level's value until resize() recomputes it. Pure waste that was
     immediately overwritten. */
  return t;
}
function releaseAll() {
  for (let i = 0; i < poolUsed; i++) pool[i].el.className = 'tile hidden';
  poolUsed = 0;
}
function applyTilePos(t) {
  const h = gapPx / 2;
  t.el.style.transform = 'translate(' + (t.c * cellPx + h) + 'px,' + (t.r * cellPx + h) + 'px)';
}

function resize() {
  const headH = Math.ceil(topbarEl.getBoundingClientRect().height);
  boardOuterEl.style.paddingTop = headH + 'px';

  const frame = 6 * 2 + 3 * 2;                       // #board-wrap padding + border
  const availW = Math.max(60, boardOuterEl.clientWidth - 16 - frame);
  let availH = Math.max(60, window.innerHeight - headH - 26 - frame);
  if (tutorialMode && !tutBanner.classList.contains('hidden')) {
    availH -= Math.ceil(tutBanner.getBoundingClientRect().height) + 28;
  }
  /* Divide by COLS+1 and ROWS+1, not COLS/ROWS: the link overlay deliberately
     spills one cell outside the board on every side (Onet routes are allowed to
     loop around the border ring) and #board-outer is overflow:hidden. Reserving
     half a cell on each side is what stops a path that goes around the left or
     right edge from being sliced off mid-draw. */
  cellPx = Math.floor(Math.max(16, Math.min(availW / (COLS + 1), availH / (ROWS + 1), 58)));
  gapPx  = Math.max(2, Math.round(cellPx * 0.09));

  const w = COLS * cellPx, h = ROWS * cellPx;
  boardEl.style.width = w + 'px';
  boardEl.style.height = h + 'px';
  boardEl.style.setProperty('--tile-size', (cellPx - gapPx) + 'px');
  linkSvg.style.left = -cellPx + 'px';
  linkSvg.style.top  = -cellPx + 'px';
  linkSvg.setAttribute('width',  (w + cellPx * 2) + '');
  linkSvg.setAttribute('height', (h + cellPx * 2) + '');
  linkSvg.setAttribute('viewBox', '0 0 ' + (w + cellPx * 2) + ' ' + (h + cellPx * 2));
  /* The dark under-stroke exists only to keep the connector readable where it
     crosses a tile, so it is now the THINNEST thing that still does that job:
     the core plus one pixel of ink on each side. It used to be roughly double
     the core, which is what still read as heavy. */
  const core = Math.max(2, Math.round(cellPx * 0.085));
  linkSvg.style.setProperty('--lw-core',  core + 'px');
  linkSvg.style.setProperty('--lw-under', (core + 2) + 'px');
  layoutAll();
  invalidateFlyGeom();        // board and HUD rects just moved
  if (tutorialMode) positionTutorialChrome();
}
/** Only positions. Size comes from --tile-size on the board. */
function layoutAll() {
  for (let i = 0; i < poolUsed; i++) {
    const t = pool[i];
    if (t.r >= 0) applyTilePos(t);
  }
}

/* ================================================================
 * §5. Board generation
 * The starting board is completely full, so — exactly as in classic Onet —
 * the only immediately linkable pairs are orthogonally adjacent ones plus
 * pairs that can route around the outer ring. `adjFraction` therefore plants a
 * share of pairs as adjacent dominoes; the rest are scattered.
 * ============================================================= */
function genBoardGrid(typeIds, idx) {
  const total = COLS * ROWS, nPairs = total >> 1;
  const bag = [];
  for (let i = 0; i < nPairs; i++) bag.push(typeIds[i % typeIds.length]);
  shuffleArr(bag);

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = -1;

  const isFree = new Uint8Array(total).fill(1);
  const order = [];
  for (let i = 0; i < total; i++) order.push(i);
  shuffleArr(order);

  const f = adjFraction(idx);
  let cursor = 0;
  for (let p = 0; p < nPairs; p++) {
    while (cursor < total && !isFree[order[cursor]]) cursor++;
    const a = order[cursor];
    isFree[a] = 0;
    const ar = (a / COLS) | 0, ac = a % COLS;

    let b = -1;
    if (Math.random() < f) {
      const cand = [];
      if (ar > 0        && isFree[a - COLS]) cand.push(a - COLS);
      if (ar < ROWS - 1 && isFree[a + COLS]) cand.push(a + COLS);
      if (ac > 0        && isFree[a - 1])    cand.push(a - 1);
      if (ac < COLS - 1 && isFree[a + 1])    cand.push(a + 1);
      if (cand.length) b = cand[(Math.random() * cand.length) | 0];
    }
    if (b < 0) {
      const rest = [];
      for (let i = cursor + 1; i < total; i++) if (isFree[order[i]]) rest.push(order[i]);
      if (!rest.length) break;
      b = rest[(Math.random() * rest.length) | 0];
    }
    isFree[b] = 0;
    grid[ar][ac] = bag[p];
    grid[(b / COLS) | 0][b % COLS] = bag[p];
  }
}

/** Make at least one pair linkable WITHOUT breaking pair parity: find a tile,
 *  find its partner, and swap the partner into a neighbouring cell. Counts per
 *  type are untouched, so the board stays perfectly pairable. */
function forceOneMove() {
  for (let tries = 0; tries < 300; tries++) {
    const r = (Math.random() * ROWS) | 0, c = (Math.random() * COLS) | 0;
    const type = grid[r][c];
    if (type < 0) continue;

    let pr = -1, pc = -1;
    for (let rr = 0; rr < ROWS && pr < 0; rr++) {
      for (let cc = 0; cc < COLS; cc++) {
        if ((rr !== r || cc !== c) && grid[rr][cc] === type) { pr = rr; pc = cc; break; }
      }
    }
    if (pr < 0) continue;

    const nb = [];
    if (r > 0)        nb.push([r - 1, c]);
    if (r < ROWS - 1) nb.push([r + 1, c]);
    if (c > 0)        nb.push([r, c - 1]);
    if (c < COLS - 1) nb.push([r, c + 1]);
    shuffleArr(nb);
    for (let i = 0; i < nb.length; i++) {
      const nr = nb[i][0], nc = nb[i][1];
      if (grid[nr][nc] < 0) continue;
      if (nr === pr && nc === pc) return true;            // already adjacent
      const tmp = grid[nr][nc]; grid[nr][nc] = grid[pr][pc]; grid[pr][pc] = tmp;
      return true;
    }
  }
  return false;
}

function fillBoard(typeIds, idx) {
  for (let attempt = 0; attempt < 12; attempt++) {
    genBoardGrid(typeIds, idx);
    if (hasMoves()) return;
  }
  forceOneMove();
}

/** Binds pool entries to grid cells. Leaves them UNPOSITIONED on purpose -
 *  the caller must follow with resize(), which lays the whole board out once
 *  with the correct cellPx for this level. */
function buildTileDom() {
  releaseAll();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      tiles[r][c] = (v < 0) ? null : takeTile(v, r, c);
    }
  }
}

/* ================================================================
 * §6. Gravity — the mechanic this game is built around
 * ============================================================= */
const FALL_BASE = 120;   // ms for a one-cell drop
const FALL_PER  = 46;    // extra ms per sqrt(cell) of distance

/** Compact every column downward. Returns the tiles that actually moved,
 *  each with the distance it fell (used to time its transition). */
function settleGravity() {
  const moves = [];
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] < 0) continue;
      if (r !== write) {
        grid[write][c] = grid[r][c]; grid[r][c] = -1;
        const t = tiles[r][c];
        tiles[write][c] = t; tiles[r][c] = null;
        t.r = write;
        moves.push({ tile: t, dist: write - r });
      }
      write--;
    }
  }
  return moves;
}

function fallMs(dist) { return Math.round(FALL_BASE + Math.sqrt(dist) * FALL_PER); }

/** Apply gravity and animate it. Everything after this point is driven by one
 *  timeout, not a per-frame loop — the compositor owns the motion. */
function applyGravity(ep) {
  const moves = settleGravity();
  droppedSet = new Set();
  if (!moves.length) { onSettled(ep, moves); return; }

  let longest = 0;
  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    droppedSet.add(m.tile);
    const ms = fallMs(m.dist);
    if (ms > longest) longest = ms;
    m.tile.el.style.transitionDuration = ms + 'ms';
    m.tile.el.classList.add('falling');
    applyTilePos(m.tile);
  }
  sfxDrop(moves.length);
  setTimeout(function () { if (ep === levelEpoch) onSettled(ep, moves); }, longest + 24);
}

function onSettled(ep, moves) {
  for (let i = 0; i < moves.length; i++) {
    const el = moves[i].tile.el;
    el.classList.remove('falling');
    el.style.transitionDuration = '';
    el.classList.add('landed');
  }
  if (moves.length) {
    setTimeout(function () {
      for (let i = 0; i < moves.length; i++) moves[i].tile.el.classList.remove('landed');
    }, 180);
  }
  busy = false;
  if (runPendingMatch(ep)) return;    // the queued pair owns the board now
  afterBoardChange(ep);
}

/** Play a pair the player queued mid-animation, if it is still playable.
 *  Re-validated against the SETTLED board: gravity may have moved both tiles,
 *  and a route that existed mid-fall may not exist now. */
function runPendingMatch(ep) {
  const q = pendingMatch;
  pendingMatch = null;
  if (!q || ep !== levelEpoch || ended || paused || busy) return false;
  const ta = q[0], tb = q[1];
  if (!ta || !tb || ta.r < 0 || tb.r < 0) return false;
  if (tiles[ta.r][ta.c] !== ta || tiles[tb.r][tb.c] !== tb) return false;
  if (grid[ta.r][ta.c] !== grid[tb.r][tb.c]) return false;
  if (!linkable(ta.r, ta.c, tb.r, tb.c)) return false;
  doMatch({ r: ta.r, c: ta.c }, { r: tb.r, c: tb.c });
  return true;
}

/* ================================================================
 * §7. Path finding
 *
 * Two routines with deliberately different jobs:
 *
 *  reachFrom(r,c)  — the HOT one. One turn-limited ray scan marks every tile
 *                    linkable from a source, so a colour group of k tiles costs
 *                    k scans instead of k*(k-1)/2 pairwise searches. Runs after
 *                    every single clear (deadlock check) and on the idle hint.
 *  findPath(a,b)   — the COLD one. Reconstructs the actual polyline for drawing,
 *                    called at most once per match.
 * ============================================================= */
let PW = 0, PH = 0;                 // padded dimensions (board + 1-cell ring)
let visBuf = null, hitBuf = null, layerA = null, layerB = null;
let scanId = 0;
const DR = [-1, 1, 0, 0], DC = [0, 0, -1, 1];
const MAX_TURNS = 2;

function allocPathBufs() {
  PW = COLS + 2; PH = ROWS + 2;
  const n = PW * PH;
  /* Stamped with scanId rather than cleared, so a scan never pays for a fill. */
  visBuf = new Int32Array(n * 4);
  hitBuf = new Int32Array(n);
  layerA = new Int32Array(n * 4);
  layerB = new Int32Array(n * 4);
  scanId = 0;
}

/** Padded coords: (pr,pc) = (r+1,c+1). The outer ring is always walkable — that
 *  is what lets Onet paths loop around the outside of the board. */
function isFreeP(pr, pc) {
  if (pr <= 0 || pr >= PH - 1 || pc <= 0 || pc >= PW - 1) return true;
  return grid[pr - 1][pc - 1] < 0;
}

/** Walk from (r,c) along direction d. Free cells become states we may turn from
 *  later; the first occupied cell is stamped as a candidate partner and stops
 *  the ray. Layers are processed in increasing turn order, so the first time a
 *  (cell,direction) is seen it is via the fewest turns — hence the early break. */
function ray(r, c, d, out, n) {
  const dr = DR[d], dc = DC[d];
  for (;;) {
    r += dr; c += dc;
    if (r < 0 || r >= PH || c < 0 || c >= PW) break;
    const cell = r * PW + c;
    if (!isFreeP(r, c)) { hitBuf[cell] = scanId; break; }
    const key = (cell << 2) | d;
    if (visBuf[key] === scanId) break;
    visBuf[key] = scanId;
    out[n++] = key;
  }
  return n;
}

/** Stamp every occupied cell linkable from (sr,sc) with <= MAX_TURNS turns. */
function reachFrom(sr, sc) {
  scanId++;
  const r0 = sr + 1, c0 = sc + 1;
  let cur = layerA, curN = 0;
  for (let d = 0; d < 4; d++) curN = ray(r0, c0, d, cur, curN);
  for (let turn = 1; turn <= MAX_TURNS && curN; turn++) {
    const nxt = (cur === layerA) ? layerB : layerA;
    let nxtN = 0;
    for (let i = 0; i < curN; i++) {
      const key = cur[i], cell = key >> 2, d = key & 3;
      const rr = (cell / PW) | 0, cc = cell - rr * PW;
      if (d < 2) { nxtN = ray(rr, cc, 2, nxt, nxtN); nxtN = ray(rr, cc, 3, nxt, nxtN); }
      else       { nxtN = ray(rr, cc, 0, nxt, nxtN); nxtN = ray(rr, cc, 1, nxt, nxtN); }
    }
    cur = nxt; curN = nxtN;
  }
}
function linkable(ar, ac, br, bc) {
  reachFrom(ar, ac);
  return hitBuf[(br + 1) * PW + (bc + 1)] === scanId;
}

/* -- exact polyline, for drawing only -------------------------------- */
function clearH(pr, c1, c2) {
  const a = Math.min(c1, c2), b = Math.max(c1, c2);
  for (let c = a + 1; c < b; c++) if (!isFreeP(pr, c)) return false;
  return true;
}
function clearV(pc, r1, r2) {
  const a = Math.min(r1, r2), b = Math.max(r1, r2);
  for (let r = a + 1; r < b; r++) if (!isFreeP(r, pc)) return false;
  return true;
}
/** Returns padded points [[pr,pc],...] or null. Classic 0/1/2-turn enumeration. */
function findPath(r1, c1, r2, c2) {
  const a1 = r1 + 1, b1 = c1 + 1, a2 = r2 + 1, b2 = c2 + 1;
  if (a1 === a2 && clearH(a1, b1, b2)) return [[a1, b1], [a2, b2]];
  if (b1 === b2 && clearV(b1, a1, a2)) return [[a1, b1], [a2, b2]];

  if (isFreeP(a1, b2) && clearH(a1, b1, b2) && clearV(b2, a1, a2))
    return [[a1, b1], [a1, b2], [a2, b2]];
  if (isFreeP(a2, b1) && clearV(b1, a1, a2) && clearH(a2, b1, b2))
    return [[a1, b1], [a2, b1], [a2, b2]];

  for (let c = 0; c < PW; c++) {                       // horizontal - vertical - horizontal
    if (c === b1 || c === b2) continue;
    if (!isFreeP(a1, c) || !isFreeP(a2, c)) continue;
    if (clearH(a1, b1, c) && clearV(c, a1, a2) && clearH(a2, c, b2))
      return [[a1, b1], [a1, c], [a2, c], [a2, b2]];
  }
  for (let r = 0; r < PH; r++) {                       // vertical - horizontal - vertical
    if (r === a1 || r === a2) continue;
    if (!isFreeP(r, b1) || !isFreeP(r, b2)) continue;
    if (clearV(b1, a1, r) && clearH(r, b1, b2) && clearV(b2, r, a2))
      return [[a1, b1], [r, b1], [r, b2], [a2, b2]];
  }
  return null;
}

/** Cheapest route ignoring the 2-turn cap, used by the tutorial to SHOW why a
 *  blocked pair cannot link. 0-1 BFS over (cell, direction). */
function findMinTurnPath(r1, c1, r2, c2) {
  const n = PW * PH, INF = 0x3fffffff;
  const dist = new Int32Array(n * 4).fill(INF);
  const prev = new Int32Array(n * 4).fill(-1);
  const src = (r1 + 1) * PW + (c1 + 1), dst = (r2 + 1) * PW + (c2 + 1);
  let dq = [];
  for (let d = 0; d < 4; d++) { dist[(src << 2) | d] = 0; dq.push((src << 2) | d); }
  let head = 0;
  while (head < dq.length) {
    const key = dq[head++];
    const cell = key >> 2, d = key & 3, dd = dist[key];
    const r = (cell / PW) | 0, c = cell - r * PW;
    for (let nd = 0; nd < 4; nd++) {
      const nr = r + DR[nd], nc = c + DC[nd];
      if (nr < 0 || nr >= PH || nc < 0 || nc >= PW) continue;
      const ncell = nr * PW + nc;
      if (ncell !== dst && !isFreeP(nr, nc)) continue;
      const cost = dd + (nd === d ? 0 : 1);
      const nkey = (ncell << 2) | nd;
      if (cost < dist[nkey]) { dist[nkey] = cost; prev[nkey] = key; dq.push(nkey); }
    }
  }
  let bk = -1, bd = INF;
  for (let d = 0; d < 4; d++) { const k = (dst << 2) | d; if (dist[k] < bd) { bd = dist[k]; bk = k; } }
  if (bk < 0 || bd >= INF) return null;
  const cells = [];
  for (let k = bk; k !== -1; k = prev[k]) {
    const cell = k >> 2;
    cells.push([(cell / PW) | 0, cell - ((cell / PW) | 0) * PW]);
    if (cell === src) break;
  }
  cells.reverse();
  const pts = [cells[0]];
  for (let i = 1; i < cells.length - 1; i++) {
    const p = cells[i - 1], q = cells[i], s = cells[i + 1];
    if ((q[0] - p[0]) !== (s[0] - q[0]) || (q[1] - p[1]) !== (s[1] - q[1])) pts.push(q);
  }
  pts.push(cells[cells.length - 1]);
  return { pts: pts, turns: bd };
}

/** First linkable pair on the board, or null. Early-exits on the first hit. */
/** Two touching tiles of the same type are ALWAYS linkable: the path between
 *  them is a straight zero-turn segment with no cell in between, so clearH /
 *  clearV trivially succeed. That means the question `hasMoves()` actually
 *  asks - "does ANY move exist?" - can often be answered by one O(cells) sweep
 *  with no BFS at all. It pays off constantly here because gravity keeps
 *  re-stacking columns and manufacturing fresh vertical neighbours.
 *
 *  Measured on the 12x16 board before this existed: 71.5 reachFrom and 1881
 *  ray() calls PER MOVE, because findAnyPair had to exhaust several whole type
 *  buckets by BFS before it stumbled on a linkable pair.
 *
 *  Deliberately NOT used when `randomize` is set: that path feeds the idle
 *  hint, and always surfacing a touching pair would make hints monotonous.
 *  The hint runs at most once per 5s of idling, so it is not worth optimising
 *  at the cost of variety. */
function findTouchingPair() {
  for (let r = 0; r < ROWS; r++) {
    const row = grid[r], below = (r + 1 < ROWS) ? grid[r + 1] : null;
    for (let c = 0; c < COLS; c++) {
      const v = row[c];
      if (v < 0) continue;
      if (c + 1 < COLS && row[c + 1] === v) return [{ r: r, c: c }, { r: r, c: c + 1 }];
      if (below && below[c] === v)          return [{ r: r, c: c }, { r: r + 1, c: c }];
    }
  }
  return null;
}

function findAnyPair(randomize) {
  if (!randomize) {
    const touching = findTouchingPair();
    if (touching) return touching;
  }
  const buckets = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      if (v < 0) continue;
      (buckets[v] || (buckets[v] = [])).push(r * COLS + c);
    }
  }
  const order = [];
  for (let i = 0; i < buckets.length; i++) if (buckets[i] && buckets[i].length > 1) order.push(i);
  if (randomize) shuffleArr(order);

  for (let oi = 0; oi < order.length; oi++) {
    const list = buckets[order[oi]];
    if (randomize) shuffleArr(list);
    for (let i = 0; i < list.length; i++) {
      const a = list[i], ar = (a / COLS) | 0, ac = a % COLS;
      reachFrom(ar, ac);
      for (let j = 0; j < list.length; j++) {
        if (j === i) continue;
        const b = list[j], br = (b / COLS) | 0, bc = b % COLS;
        if (hitBuf[(br + 1) * PW + (bc + 1)] === scanId)
          return [{ r: ar, c: ac }, { r: br, c: bc }];
      }
    }
  }
  return null;
}
function hasMoves() { return findAnyPair(false) !== null; }
/* ================================================================
 * §8. Link drawing
 * ============================================================= */
let linkTimer = 0;
/** Padded cell -> pixel centre inside #link-svg (which is offset by one cell). */
function pxOf(pr, pc) { return [pc * cellPx + cellPx / 2, pr * cellPx + cellPx / 2]; }

function drawLink(pts) {
  if (!pts) return;
  let d = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pxOf(pts[i][0], pts[i][1]);
    d += (i ? 'L' : 'M') + p[0] + ' ' + p[1] + ' ';
  }
  linkSvg.innerHTML = '<path class="link-under" d="' + d + '"/><path class="link-path" d="' + d + '"/>';
  linkSvg.firstChild.classList.add('link-anim');
  linkSvg.lastChild.classList.add('link-anim');
  clearTimeout(linkTimer);
  linkTimer = setTimeout(function () { linkSvg.innerHTML = ''; }, 210);
}

/** Tutorial: draw a route that needs MORE than 2 turns, with a dot on each
 *  corner, so the player can see exactly why the pair will not link. */
function drawBendPath(pts, holdMs) {
  let d = '', dots = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pxOf(pts[i][0], pts[i][1]);
    d += (i ? 'L' : 'M') + p[0] + ' ' + p[1] + ' ';
    if (i > 0 && i < pts.length - 1) dots += '<circle class="bend-dot" cx="' + p[0] + '" cy="' + p[1] + '" r="6"/>';
  }
  linkSvg.innerHTML = '<path class="bend-under" d="' + d + '"/><path class="bend-path" d="' + d + '"/>' + dots;
  clearTimeout(linkTimer);
  linkTimer = setTimeout(function () { linkSvg.innerHTML = ''; }, holdMs);
}

/* ================================================================
 * §9. Scoring, praise and floating text
 * ============================================================= */
/* Identical geometry/colours to the SCORE pill's .pill-ico star. */
const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14 L18.3 21 L12 17.3 L5.7 21 L7.3 14 L2 9.3 L9.1 8.6 Z" fill="#F5B92B" stroke="#141210" stroke-width="1.6" stroke-linejoin="round"/></svg>';

const BASE_POINTS  = 10;
const MAX_MULT     = 4;
const FLY_STAGGER  = 55;
const FLY_MS       = 620;    // flight time; pushed into .fly as --fly-ms
/* The flight uses cubic-bezier(.45,0,.3,1), which is heavily decelerating: by
   90% of FLY_MS it has already covered 99.3% of the distance (measured from
   the curve itself - see the bezier walk in the commit that added this). The
   last 10% of the duration is therefore a sub-pixel crawl the eye cannot
   follow. Crediting on the literal transitionend (100%) waited out that dead
   tail on every single star, which read as the SCORE pulse lagging a beat
   behind a star that visibly already arrived. FLY_ARRIVE_FRAC moves the
   credit to the moment that is actually indistinguishable from arrival. */
const FLY_ARRIVE_FRAC = 0.9;

/* -- Score delivery ------------------------------------------------
   `score` is the TRUTH and moves the instant a pair clears - saves, the
   win/lose payload and BEST all read it, so being killed mid-flight can
   never cost the player points. What the HUD SHOWS is `scoreShown`, and
   that only moves when a star actually reaches the SCORE pill.
   `scorePending` is what is still in the air, and the invariant

       scoreShown + scorePending === score

   holds even while two matches overlap. That is why an arriving star adds
   its OWN share rather than snapping to `score`: snapping would swallow
   the points still flying from the previous match and the counter would
   run ahead of the stars. updateScoreHud() is the deliberate snap, used
   at level load / restore / restart where nothing is in flight. */
let scoreShown = 0, scorePending = 0, bestShown = 0;

function renderScoreHud() { elScore.textContent = String(scoreShown); }
function renderBestHud()  { elBest.textContent  = String(bestShown); }
function updateScoreHud() { scoreShown = score; scorePending = 0; renderScoreHud(); }
function updateBestHud()  { bestShown = best; renderBestHud(); }

/** Credit one star's share the moment it touches the pill. */
function deliverScore(share) {
  if (!(share > 0)) return;
  scorePending = Math.max(0, scorePending - share);
  scoreShown   = Math.min(score, scoreShown + share);
  renderScoreHud();
  /* BEST is only ever overtaken BY the running score, so it has to climb in
     lockstep with what SCORE shows - otherwise BEST would leak the points
     that have not landed yet. */
  if (scoreShown > bestShown) { bestShown = scoreShown; renderBestHud(); }
}

function updateLevelHud() { elLevel.textContent = String(currentLevelIdx + 1); }

/** Replay a CSS animation from frame zero WITHOUT forcing a synchronous layout.
 *
 *  The classic trick is remove-class / read offsetWidth / add-class, because
 *  reading offsetWidth flushes pending style and layout and so makes the
 *  browser notice the class went away. That flush is the single most expensive
 *  DOM operation on the hot path: it stalls the main thread on the WHOLE
 *  document, and it happened while tiles were mid-animation - the worst moment
 *  to block. Measured at ~2 per move just from the praise/combo popups, plus
 *  one more on every mistapped pair.
 *
 *  Restarting through the animation object costs none of that: the animation is
 *  already there, so it is simply rewound. The old trick is kept for WebViews
 *  without getAnimations(), which is also where the class is being added for
 *  the first time and there is nothing to rewind. */
function restartAnim(el, cls) {
  if (el.classList.contains(cls) && el.getAnimations) {
    const anims = el.getAnimations();
    if (anims.length) {
      for (let i = 0; i < anims.length; i++) { anims[i].currentTime = 0; anims[i].play(); }
      return;
    }
  }
  el.classList.remove(cls);
  void el.offsetWidth;            // only reached on the first play, or very old WebViews
  el.classList.add(cls);
}

function popText(el, text, cls) {
  el.textContent = text;
  restartAnim(el, cls);
}
function showPraise(text) { popText(praiseEl, text, 'praise-anim'); }
function showCombo(text)  { popText(comboEl, text, 'combo-anim'); }

let toastTimer = 0;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
}

/** Stars travel from the link up to the SCORE pill, each carrying a slice of
 *  the points. Cadence is uniform regardless of path length, so a short link
 *  and a long one feel the same.
 *  Both rectangles are cached: reading them per match forced a synchronous
 *  layout of the whole document, and neither moves except on resize. */
let flyGeom = null;
function invalidateFlyGeom() { flyGeom = null; }
function getFlyGeom() {
  if (!flyGeom) {
    const r = boardEl.getBoundingClientRect();
    const t = pillScore.getBoundingClientRect();
    flyGeom = { bx: r.left, by: r.top,
                tx: t.left + t.width / 2, ty: t.top + t.height / 2 };
  }
  return flyGeom;
}
function spawnFlyers(pts, n, gained) {
  const g = getFlyGeom();
  const rect = { left: g.bx, top: g.by };
  const tx = g.tx, ty = g.ty;
  const count = Math.max(1, Math.min(n, 6));
  /* Shares are worked out up front so they add back up to exactly `gained` -
     the last star carries the remainder, so integer division never quietly
     drops a point on the floor. */
  const base = Math.floor(gained / count);
  for (let i = 0; i < count; i++) {
    const share = (i === count - 1) ? gained - base * (count - 1) : base;
    const f = (count === 1) ? 0.5 : i / (count - 1);
    const seg = f * (pts.length - 1);
    const si = Math.min(pts.length - 2, Math.floor(seg)), st = seg - si;
    const p0 = pxOf(pts[si][0], pts[si][1]), p1 = pxOf(pts[si + 1][0], pts[si + 1][1]);
    const x = rect.left - cellPx + p0[0] + (p1[0] - p0[0]) * st;
    const y = rect.top  - cellPx + p0[1] + (p1[1] - p0[1]) * st;
    flyOne(x, y, tx, ty, i, share);
  }
}
function flyOne(x, y, tx, ty, i, share) {
  const el = document.createElement('div');
  el.className = 'fly';
  el.innerHTML = STAR_SVG;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.setProperty('--fly-ms', FLY_MS + 'ms');
  document.body.appendChild(el);

  const dx = tx - x, dy = ty - y;
  let credited = false, removed = false;

  /* Crediting and removing the element are deliberately separate. Crediting
     happens the instant the star is visually (not literally) at the pill;
     removal waits for the star's own transition to actually finish so it
     never pops out mid-flight. */
  function credit() {
    if (credited) return;
    credited = true;
    deliverScore(share);
  }
  function remove() {
    if (removed) return;
    removed = true;
    el.removeEventListener('transitionend', onEnd);
    clearTimeout(creditTimer);
    clearTimeout(safety);
    if (el.parentNode) el.parentNode.removeChild(el);
    credit();   // fallback: guarantees the points land even if creditTimer was throttled
  }
  function onEnd(e) { if (e.propertyName === 'transform') remove(); }
  el.addEventListener('transitionend', onEnd);
  /* Independent route to the same cleanup. `transitionend` normally wins, but
     it does not fire at all when frames are not being produced - a hidden
     tab, or a WebView that has stopped compositing - and the star would then
     sit in the DOM (and any un-credited points in `scorePending`) forever.
     Aimed at the NOMINAL landing time (flight plus the two-frame kick), not
     parked far out as a panic timer. */
  const safety = setTimeout(remove, i * FLY_STAGGER + FLY_MS + 90);

  let creditTimer = 0;
  /* Kick off on a frame boundary. A bare setTimeout fires anywhere inside a
     frame, so the same stagger produced a different first-frame offset at
     60 / 120 / 144Hz; two rAFs are two frames on every one of them (and the
     second is what guarantees the start transform was computed, so the
     transition actually runs - and so this is the true zero point FLY_ARRIVE_FRAC
     is measured from, not the spawn time). */
  function kick() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (removed) return;
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.45)';
        el.style.opacity = '0';
        creditTimer = setTimeout(credit, FLY_MS * FLY_ARRIVE_FRAC);
      });
    });
  }
  if (i) setTimeout(kick, i * FLY_STAGGER); else kick();
}

/* ================================================================
 * §10. Audio — synthesised, no external files (game-common: single file)
 * Soft and rounded; impacts use filtered noise (modal) rather than a pitch
 * slide, and everything lands in 250-3000Hz so it is audible on a phone.
 * ============================================================= */
let actx = null, sfxOut = null;
function audioEnsure() {
  if (actx || muted) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    sfxOut = actx.createGain(); sfxOut.gain.value = 0.85;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 5000;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 150;
    const comp = actx.createDynamicsCompressor();
    sfxOut.connect(lp); lp.connect(hp); hp.connect(comp); comp.connect(actx.destination);
  } catch (e) { actx = null; }
}
function canPlay() { return !!actx && !muted && !paused && actx.state !== 'suspended'; }

function tone(freq, dur, peak, type, slideTo) {
  if (!canPlay()) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(); o.type = type || 'sine';
  const g = actx.createGain();
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);     // soft attack, no click
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxOut);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noiseBurst(freq, q, dur, peak) {
  if (!canPlay()) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = freq; bp.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(peak, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(bp); bp.connect(g); g.connect(sfxOut);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
function sfxSelect() { tone(520, 0.07, 0.10, 'sine'); }
function sfxLink(combo) {
  const step = Math.min(combo, 7);
  const f = 440 * Math.pow(2, step / 12);
  tone(f, 0.16, 0.13, 'sine');
  tone(f * 1.5, 0.13, 0.06, 'triangle');
}
function sfxBad()  { tone(190, 0.13, 0.09, 'triangle', 150); }
/** ONE thunk per settle, not one per tile — otherwise a big cascade machine-guns. */
function sfxDrop(n) {
  const w = Math.min(1, 0.45 + n * 0.06);
  noiseBurst(300, 2.4, 0.10, 0.30 * w);
  noiseBurst(620, 3.0, 0.06, 0.16 * w);
}
function sfxShuffle() { noiseBurst(900, 1.6, 0.22, 0.14); }
function sfxWin() { [523, 659, 784].forEach(function (f, i) { setTimeout(function () { tone(f, 0.22, 0.11, 'sine'); }, i * 110); }); }
function sfxLose() { [392, 330, 262].forEach(function (f, i) { setTimeout(function () { tone(f, 0.28, 0.10, 'triangle'); }, i * 150); }); }
function sfxTick() { tone(880, 0.05, 0.07, 'sine'); }

/* ================================================================
 * §11. Input and matching
 * ============================================================= */
function tileAt(p) { return tiles[p.r][p.c]; }

function select(r, c) {
  selected = tiles[r][c];          // the tile OBJECT: survives a gravity pass
  selected.el.classList.add('selected');
  sfxSelect();
}
function deselect() {
  if (!selected) return;
  selected.el.classList.remove('selected');
  selected = null;
}
function shakeTile(r, c) {
  const t = tiles[r][c];
  if (!t) return;
  restartAnim(t.el, 'shake');
  setTimeout(function () { t.el.classList.remove('shake'); }, 240);
}
function clearHint() {
  if (!hintPair) return;
  /* Tile OBJECTS, not coordinates: a hinted tile can be moved by gravity
     between being lit and being cleared, and {r,c} would then point at the
     tile that fell into its place. */
  for (let i = 0; i < hintPair.length; i++) {
    const t = hintPair[i];
    if (t && t.el) t.el.classList.remove('hint');
  }
  hintPair = null;
}
function showHintPair(pair) {
  clearHint();
  if (!pair) return;
  const shown = [];
  for (let i = 0; i < pair.length; i++) {
    const p = pair[i], t = tiles[p.r] && tiles[p.r][p.c];
    if (t) { t.el.classList.add('hint'); shown.push(t); }
  }
  if (!shown.length) return;
  hintPair = shown;
  /* Put both halves on the SAME beat. Adding the class together is usually
     enough, but a tile that was already hinted keeps its old animation running
     (a remove+add inside one task is never seen by the browser), and it would
     then blink against its partner. Rewinding both is unconditional and cheap. */
  for (let i = 0; i < shown.length; i++) {
    const face = shown[i].face;
    if (!face || !face.getAnimations) continue;
    const anims = face.getAnimations();
    for (let k = 0; k < anims.length; k++) anims[k].currentTime = 0;
  }
}

/* A pair the player completed while the board was still animating. Held here
   and fired the moment the board is ready. See handleTap / runPendingMatch. */
let pendingMatch = null;
function clearPendingMatch() { pendingMatch = null; }

/* Progress is written by afterBoardChange() once a completed move has settled,
   and nowhere else during play. Selecting, deselecting and bouncing off a
   blocked pair change nothing that is worth a localStorage write on a low-end
   phone - the board is identical and only the clock has moved, which the next
   completed move records anyway. */
let idleAcc = 0;
function handleTap(r, c) {
  if (ended || paused) return;
  if (!tiles[r] || !tiles[r][c]) return;
  idleAcc = 0;
  audioEnsure();
  /* The tutorial's demo clock stays frozen until the player actually acts, so
     the lesson text can be read without the number ticking away underneath. */
  if (tutorialMode && tutStep === 3) tutTimerRunning = true;

  if (!selected) {
    if (tutorialMode && !tutAllowsFirst(r, c)) { tutWrongChoice(r, c); return; }
    select(r, c);
    return;
  }
  if (selected === tiles[r][c]) { deselect(); return; }

  const a = { r: selected.r, c: selected.c }, b = { r: r, c: c };
  if (grid[a.r][a.c] !== grid[b.r][b.c]) {          // different fruit -> reselect
    deselect();
    if (tutorialMode && !tutAllowsFirst(r, c)) { tutWrongChoice(r, c); return; }
    select(r, c);
    return;
  }
  if (tutorialMode && !tutAllowsPair(a, b)) { deselect(); tutWrongChoice(r, c); return; }

  if (linkable(a.r, a.c, b.r, b.c)) {
    /* Busy means tiles are still popping or falling. Rather than swallow the
       tap - which is what made the game feel like it stopped listening while
       the score stars were still on screen - remember the pair and play it as
       soon as the board settles. The two tile OBJECTS are stored, so the
       pending pair stays valid even if gravity moves them in the meantime. */
    if (busy) {
      pendingMatch = [tiles[a.r][a.c], tiles[b.r][b.c]];
      deselect();
      return;
    }
    deselect();
    doMatch(a, b);
  } else {
    /* Phase 2 IS the "why won't this link?" lesson — the tap is meant to fail,
       and failing is what advances it. (Phases: 0 link, 1 drop, 2 bend, 3 clear.) */
    if (tutorialMode && tutStep === 2) { tutShowBend(a, b); return; }
    shakeTile(a.r, a.c); shakeTile(b.r, b.c);
    sfxBad();
    deselect();
  }
}

function doMatch(a, b) {
  const ep = levelEpoch;
  busy = true;
  clearHint();

  const pts = findPath(a.r, a.c, b.r, b.c);
  drawLink(pts);

  const ta = tiles[a.r][a.c], tb = tiles[b.r][b.c];
  const usedDrop = !!droppedSet && (droppedSet.has(ta) || droppedSet.has(tb));

  grid[a.r][a.c] = -1; grid[b.r][b.c] = -1;
  tiles[a.r][a.c] = null; tiles[b.r][b.c] = null;
  ta.el.classList.add('pop'); tb.el.classList.add('pop');
  pairsLeft--;

  /* DROP COMBO — the signature mechanic. A clear that consumes a tile which
     just fell continues the chain; anything else breaks it. This is what makes
     gravity the scoring engine instead of a decoration. */
  if (usedDrop) dropCombo++; else dropCombo = 0;
  const mult = Math.min(1 + 0.5 * dropCombo, MAX_MULT);

  /* The tutorial scores TOO - points, flying stars, praise, drop combo, all of
     it. Learning the feedback is half of what the tutorial is for, and a
     silent first board taught the wrong thing. The practice points are wiped
     in finishTutorial() before level 1 starts. */
  {
    const now = nowMs();
    const findMs = now - lastFindAt;
    lastFindAt = now;
    let bonus = 0, praise = '';
    if (findMs < 1100)      { bonus = 20; praise = t('wow'); }
    else if (findMs < 2200) { bonus = 10; praise = t('fast'); }

    const gained = Math.round((BASE_POINTS + bonus) * mult);
    score += gained;
    /* BEST is the one thing practice may NOT touch: it is a persistent record
       that gets written through to native storage, and a tutorial must not be
       able to set it. The on-screen BEST still climbs with SCORE (bestShown,
       updated by deliverScore), so it looks exactly like a real level - it is
       only the saved number that is held back, and finishTutorial() puts the
       display back in step with it. */
    if (!tutorialMode && score > best) { best = score; saveDataThrottled(lightData()); }
    /* The HUD is NOT touched here. The stars carry `gained` and each credits
       its slice on arrival; with no path to fly along there is nothing to
       wait for, so those points are banked immediately instead. */
    if (pts) { scorePending += gained; spawnFlyers(pts, Math.min(2 + Math.round(mult), 6), gained); }
    else     { scoreShown += gained; renderScoreHud();
               if (scoreShown > bestShown) { bestShown = scoreShown; renderBestHud(); } }
    if (dropCombo >= 1) showCombo(t('dropCombo') + ' x' + dropCombo.toFixed(0));
    else if (praise) showPraise(praise);
  }
  sfxLink(dropCombo);

  setTimeout(function () {
    if (ep !== levelEpoch) return;
    ta.el.className = 'tile hidden'; tb.el.className = 'tile hidden';
    ta.r = -1; tb.r = -1;
  }, 270);
  setTimeout(function () { if (ep === levelEpoch) applyGravity(ep); }, 200);
}

/** Runs after every settle: win check, deadlock net, persistence. */
function afterBoardChange(ep) {
  if (ep !== levelEpoch || ended) return;
  if (tutorialMode) { tutOnBoardChange(ep); return; }
  if (pairsLeft <= 0) { winLevel(); return; }
  if (!hasMoves()) { fixDeadBoard(ep); return; }
  saveCurrentState();
}

/** Deadlock net. Types are only ever removed in pairs, so counts stay even and
 *  a workable arrangement always exists — we just have to find one. */
/** Restore a move with ONE swap instead of reshuffling the board.
 *
 *  Why one swap is always enough - this is a proof, not a heuristic:
 *  tiles only ever leave the board in same-type PAIRS, so every type still
 *  present has an EVEN count, so every tile still on the board still has a
 *  partner somewhere. Move that partner into a cell next to it and the two are
 *  ADJACENT - and two adjacent same-type tiles always link, with zero turns,
 *  by definition of the path rules. So the board can always be revived by
 *  moving exactly one tile.
 *
 *  The old code knew this: forceOneMove() did precisely this swap. It just sat
 *  behind 40 rounds of full-board reshuffling as a last resort, so the cheap
 *  guaranteed fix only ran when the expensive unguaranteed one had already
 *  failed 40 times.
 *
 *  Cost is CONSTANT - one O(cells) scan, two setTileType calls, no pathfinding
 *  - where the reshuffle cost scaled with whatever was still on the board.
 *  Measured side by side on the same dead board: 2 type writes and 0 BFS
 *  searches, against 8 type writes, 7 BFS searches and a full array shuffle.
 *  Those shuffle numbers are small only because dead boards mostly happen LATE,
 *  when few tiles are left; on a dense one the same code path is up to 40
 *  rounds of (shuffle every value + a full hasMoves() search) plus one type
 *  write per surviving tile.
 *
 *  The point is not really the microseconds though - it is that the player
 *  sees two fruits change instead of the whole board scrambling under a
 *  "shuffled!" toast. There is no shuffle left to announce.
 *
 *  @returns {boolean} false only if the board is so sparse that no tile has a
 *           filled neighbour, which cannot happen on a board that has no moves.
 */
function repairOneSwap() {
  let ar = -1, ac = -1, nr = -1, nc = -1;
  for (let r = 0; r < ROWS && ar < 0; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] < 0) continue;
      /* Any filled orthogonal neighbour: that cell is where the partner goes. */
      if (r > 0 && grid[r - 1][c] >= 0)        { ar = r; ac = c; nr = r - 1; nc = c; break; }
      if (r < ROWS - 1 && grid[r + 1][c] >= 0) { ar = r; ac = c; nr = r + 1; nc = c; break; }
      if (c > 0 && grid[r][c - 1] >= 0)        { ar = r; ac = c; nr = r; nc = c - 1; break; }
      if (c < COLS - 1 && grid[r][c + 1] >= 0) { ar = r; ac = c; nr = r; nc = c + 1; break; }
    }
  }
  if (ar < 0) return false;

  const type = grid[ar][ac];
  let pr = -1, pc = -1;
  for (let r = 0; r < ROWS && pr < 0; r++) {
    for (let c = 0; c < COLS; c++) {
      if ((r !== ar || c !== ac) && grid[r][c] === type) { pr = r; pc = c; break; }
    }
  }
  if (pr < 0) return false;
  /* If the partner already sits in the neighbouring cell the pair is adjacent,
     so the board was never dead and we must not touch it. */
  if (pr === nr && pc === nc) return false;

  const displaced = grid[nr][nc];
  grid[nr][nc] = type;
  grid[pr][pc] = displaced;
  setTileType(tiles[nr][nc], grid[nr][nc]);
  setTileType(tiles[pr][pc], grid[pr][pc]);
  /* A small pop on just the two tiles that moved: legible, but nothing like a
     board-wide scramble, so it needs no toast. */
  popTwo(tiles[nr][nc], tiles[pr][pc]);
  return true;
}

/** Called when the settled board has no move left. */
function fixDeadBoard(ep) {
  deselect();
  clearPendingMatch();
  repairs++;
  if (repairOneSwap() && hasMoves()) {
    droppedSet = null;
    dropCombo = 0;
    if (ep === levelEpoch) saveCurrentState();
    return;
  }
  /* Unreachable by the argument above; kept so a surprise can never hard-lock
     a level. Tests assert this counter stays at zero. */
  shuffleFallbacks++;
  autoShuffle(ep);
}
let repairs = 0, shuffleFallbacks = 0;

function popTwo(a, b) {
  if (a) restartAnim(a.el, 'landed');
  if (b) restartAnim(b.el, 'landed');
}

function autoShuffle(ep) {
  busy = true;
  /* A shuffle reassigns FRUIT to the tiles already on the board, so anything
     the player picked before it refers to a tile that has since become a
     different fruit. Drop both, or they would see a selection ring sitting on
     something they never chose. */
  deselect();
  clearPendingMatch();
  const cells = [], vals = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] < 0) continue;
      cells.push([r, c]); vals.push(grid[r][c]);
    }
  }
  for (let attempt = 0; attempt < 40; attempt++) {
    shuffleArr(vals);
    for (let i = 0; i < cells.length; i++) grid[cells[i][0]][cells[i][1]] = vals[i];
    if (hasMoves()) break;
    if (attempt === 39) forceOneMove();
  }
  for (let i = 0; i < cells.length; i++) {
    const r = cells[i][0], c = cells[i][1];
    setTileType(tiles[r][c], grid[r][c]);
  }
  droppedSet = null;
  dropCombo = 0;
  sfxShuffle();
  showToast(t('shuffled'));
  busy = false;
  if (ep === levelEpoch) saveCurrentState();
}

function showAutoHint() {
  if (busy || ended || paused || tutorialMode) return;
  const pair = findAnyPair(true);
  if (pair) showHintPair(pair);
}

boardEl.addEventListener('click', function (e) {
  const el = e.target.closest ? e.target.closest('.tile') : null;
  if (!el) return;
  /* The element carries its own pool entry (set once in buildPool), so a tap is
     an O(1) lookup. It used to walk the pool comparing nodes, which on the
     12x16 board meant up to 192 comparisons for every single tap. */
  const t = el.__tile;
  if (t && t.r >= 0) { handleTap(t.r, t.c); return; }
});

/* ================================================================
 * §12. Timer, win / lose, ads
 * ============================================================= */
function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

/* Every write below is guarded. This runs 5x a second for a whole level, and a
   write that sets a property to the value it already has still costs a style
   invalidation - the seconds text in particular only actually changes once a
   second, so four writes in five were pure waste. */
let lastBarQ = -1, lastBarState = '\u0000', lastSecsText = '';
function resetTimerHud() { lastBarQ = -1; lastBarState = '\u0000'; lastSecsText = ''; }
function renderTimer() {
  const frac = timeTotal > 0 ? Math.max(0, timeLeft / timeTotal) : 0;
  const q = Math.round(frac * 1000) / 1000;
  if (q !== lastBarQ) { lastBarQ = q; barFill.style.transform = 'scaleX(' + q + ')'; }

  const state = frac <= 0.18 ? 'danger' : (frac <= 0.4 ? 'warn' : '');
  if (state !== lastBarState) {
    lastBarState = state;
    barFill.classList.toggle('warn',   state === 'warn');
    barFill.classList.toggle('danger', state === 'danger');
    elSecs.classList.toggle('danger',  state === 'danger');
  }
  const secs = String(Math.max(0, Math.ceil(timeLeft)));
  if (secs !== lastSecsText) { lastSecsText = secs; elSecs.textContent = secs; }
}

function maybeRequestAds() {
  endCounter++;
  if (endCounter % 3 === 0) sendMessage('ads');
}
function lightData() {
  return { levelIdx: currentLevelIdx, score: score, best: best,
           tutorialSeen: tutorialSeen, muted: muted };
}

function winLevel() {
  if (ended) return;
  ended = true;
  updateScoreHud();       // stars still in the air must not hold back the total
  sfxWin();
  const nextIdx = Math.min(currentLevelIdx + 1, MAX_LEVEL_IDX);
  /* Endless by design: there is no final level, so `victory` never fires.
     Documented deviation from game-common §1.5 (same as animal-connect). */
  sendMessage('game_result', { result: 'win', showModal: true });
  saveDataNow({ levelIdx: nextIdx, score: score, best: best,
                tutorialSeen: tutorialSeen, muted: muted });
  saveLocal({ levelIdx: nextIdx, score: score, best: best,
              tutorialSeen: tutorialSeen, muted: muted, game: null });
  maybeRequestAds();
}
function loseLevel() {
  if (ended) return;
  ended = true;
  updateScoreHud();       // ditto: the result modal shows the settled score
  sfxLose();
  if (score > best) best = score;
  updateBestHud();
  sendMessage('game_result', { result: 'lose', showModal: true });
  /* Timing out ends the RUN: the next run restarts at level 1 with score 0. */
  saveDataNow({ levelIdx: 0, score: 0, best: best, tutorialSeen: tutorialSeen, muted: muted });
  saveLocal({ levelIdx: 0, score: 0, best: best, tutorialSeen: tutorialSeen, muted: muted, game: null });
  maybeRequestAds();
}

/* ================================================================
 * §13. Persistence
 * ============================================================= */
function gameSnapshot() {
  if (ended || tutorialMode || pairsLeft <= 0) return null;
  const flat = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) flat.push(grid[r][c]);
  return { i: currentLevelIdx, w: COLS, h: ROWS, t: Math.round(timeLeft), g: flat };
}
function saveCurrentState() {
  const light = lightData();
  saveLocal({ levelIdx: light.levelIdx, score: score, best: best,
              tutorialSeen: tutorialSeen, muted: muted, game: gameSnapshot() });
}
function tryRestoreState(idx, snap) {
  if (!snap || snap.i !== idx || !snap.g) return false;
  if (snap.w !== COLS || snap.h !== ROWS) return false;
  if (snap.g.length !== COLS * ROWS) return false;
  let count = 0;
  for (let i = 0; i < snap.g.length; i++) {
    const v = snap.g[i];
    if (!(v === -1 || (typeof v === 'number' && v >= 0 && v < ICON_COUNT))) return false;
    if (v >= 0) count++;
  }
  if (count === 0 || (count & 1)) return false;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) grid[r][c] = snap.g[r * COLS + c];
  pairsLeft = count >> 1;
  if (typeof snap.t === 'number' && snap.t > 0) timeLeft = Math.min(snap.t, timeTotal);
  return true;
}
/* ================================================================
 * §14. Level lifecycle
 * ============================================================= */
function ensureGridArrays() {
  grid = []; tiles = [];
  for (let r = 0; r < ROWS; r++) {
    const gr = [], tr = [];
    for (let c = 0; c < COLS; c++) { gr.push(-1); tr.push(null); }
    grid.push(gr); tiles.push(tr);
  }
}

function loadLevel(idx, snap) {
  levelEpoch++;                       // invalidates every in-flight continuation
  clearPendingMatch();
  clearTimeout(linkTimer);
  linkSvg.innerHTML = '';
  clearHint();
  selected = null;

  currentLevelIdx = Math.max(0, Math.min(idx, MAX_LEVEL_IDX));
  const cfg = levelConfig(currentLevelIdx);
  COLS = cfg.cols; ROWS = cfg.rows;
  ensureGridArrays();
  allocPathBufs();

  timeTotal = cfg.time; timeLeft = cfg.time;
  ended = false; busy = false; paused = false;
  dropCombo = 0; droppedSet = null; idleAcc = 0; lastTickSec = -1;
  tutorialMode = false; tutTimerRunning = false;
  tutBanner.classList.add('hidden');
  barBg.classList.remove('tut-focus');
  hudSubEl.style.display = '';
  pauseVeil.classList.add('hidden');

  if (!(snap && tryRestoreState(currentLevelIdx, snap))) {
    fillBoard(cfg.typeIds, currentLevelIdx);
    pairsLeft = (COLS * ROWS) >> 1;
  }
  buildTileDom();
  popInAll();

  updateLevelHud(); updateScoreHud(); updateBestHud();
  resize();
  resetTimerHud();
  renderTimer();
  lastFindAt = nowMs();
  startTicker();
  saveCurrentState();
}

function popInAll() {
  boardEl.classList.add('board-popin');
  setTimeout(function () {
    boardEl.classList.remove('board-popin');
  }, 240);
}

/* ================================================================
 * §15. Tutorial — ONE board, no scene change (mentor mandate)
 *
 * Every step's target is discovered on the LIVE board at runtime instead of
 * being hard-coded, so a step can never ask for something the board cannot
 * deliver — and the board itself is regenerated until it can teach all four
 * lessons (see buildTutorialBoard).
 * ============================================================= */
const TUT_COLS = 6, TUT_ROWS = 4;
const TUT_TYPE_IDS = [0, 1, 2, 3, 4, 5];
let tutStep = 0;
let tutTarget = null;         // the pair the player must clear right now
let tutBendPair = null;
let tutTimerRunning = false;

function cloneGrid() { const g = []; for (let r = 0; r < ROWS; r++) g.push(grid[r].slice()); return g; }
function restoreGrid(g) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = g[r][c]; }
/** Gravity on the grid only (no DOM) — used to look ahead while designing the
 *  tutorial board. Returns the destination cells that received a moved tile. */
function settleGridOnly() {
  const moved = [];
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] < 0) continue;
      if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = -1; moved.push(w * COLS + c); }
      w--;
    }
  }
  return moved;
}

/** A vertical adjacent same-type pair with at least two tiles stacked above it,
 *  so clearing it produces a fall the player cannot miss. */
function findVerticalLinkPair() {
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 1; r--) {
      if (grid[r][c] < 0 || grid[r][c] !== grid[r - 1][c]) continue;
      let above = 0;
      for (let k = r - 2; k >= 0; k--) if (grid[k][c] >= 0) above++;
      if (above >= 2) return [{ r: r, c: c }, { r: r - 1, c: c }];
    }
  }
  return null;
}
/** A linkable pair with at least one endpoint among the cells that just fell. */
function findDropCreatedPair(movedCells) {
  const moved = {};
  for (let i = 0; i < movedCells.length; i++) moved[movedCells[i]] = 1;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      if (v < 0 || !moved[r * COLS + c]) continue;
      reachFrom(r, c);
      for (let r2 = 0; r2 < ROWS; r2++) {
        for (let c2 = 0; c2 < COLS; c2++) {
          if ((r2 === r && c2 === c) || grid[r2][c2] !== v) continue;
          if (hitBuf[(r2 + 1) * PW + (c2 + 1)] === scanId)
            return [{ r: r, c: c }, { r: r2, c: c2 }];
        }
      }
    }
  }
  return null;
}
/** A same-type pair that CANNOT link and whose cheapest route needs exactly 3
 *  turns — so the demo shows "one turn too many", not "hopelessly boxed in". */
function findBendPair() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      if (v < 0) continue;
      for (let r2 = 0; r2 < ROWS; r2++) {
        for (let c2 = 0; c2 < COLS; c2++) {
          if ((r2 === r && c2 === c) || grid[r2][c2] !== v) continue;
          if (findPath(r, c, r2, c2)) continue;
          const mp = findMinTurnPath(r, c, r2, c2);
          if (mp && mp.turns === 3) return [{ r: r, c: c }, { r: r2, c: c2 }];
        }
      }
    }
  }
  return null;
}
/** Greedy solver used to prove the tutorial board can actually be emptied. */
function greedyLeftover() {
  let guard = 0;
  for (;;) {
    if (++guard > 400) break;
    const pair = findAnyPair(false);
    if (!pair) break;
    grid[pair[0].r][pair[0].c] = -1;
    grid[pair[1].r][pair[1].c] = -1;
    settleGridOnly();
  }
  let left = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] >= 0) left++;
  return left;
}

/** Regenerate until the board can teach LINK -> DROP -> BEND -> CLEAR. */
function buildTutorialBoard() {
  for (let attempt = 0; attempt < 400; attempt++) {
    genBoardGrid(TUT_TYPE_IDS, 0);
    const start = cloneGrid();

    const link = findVerticalLinkPair();
    if (!link || !linkable(link[0].r, link[0].c, link[1].r, link[1].c)) continue;

    grid[link[0].r][link[0].c] = -1; grid[link[1].r][link[1].c] = -1;
    const moved = settleGridOnly();
    const drop = findDropCreatedPair(moved);
    if (!drop) { restoreGrid(start); continue; }

    grid[drop[0].r][drop[0].c] = -1; grid[drop[1].r][drop[1].c] = -1;
    settleGridOnly();
    if (!findBendPair()) { restoreGrid(start); continue; }
    if (greedyLeftover() !== 0) { restoreGrid(start); continue; }

    restoreGrid(start);
    return link;
  }
  genBoardGrid(TUT_TYPE_IDS, 0);
  if (!hasMoves()) forceOneMove();
  return findVerticalLinkPair();
}

function startTutorial() {
  levelEpoch++;
  tutorialMode = true;
  tutStep = 0;
  tutTimerRunning = false;
  ended = false; busy = false; paused = false;
  selected = null; dropCombo = 0; droppedSet = null;
  currentLevelIdx = 0;
  COLS = TUT_COLS; ROWS = TUT_ROWS;
  ensureGridArrays();
  allocPathBufs();
  timeTotal = 15; timeLeft = 15;

  const link = buildTutorialBoard();
  pairsLeft = (COLS * ROWS) >> 1;
  buildTileDom();
  popInAll();
  hudSubEl.style.display = 'none';      // no LEVEL / timer row during the tutorial
  updateScoreHud(); updateBestHud();
  setTutPhase(0, link);
  startTicker();
}

function setTutPhase(n, target) {
  tutStep = n;
  tutTarget = target || null;
  /* The lesson - and therefore which pair is legal - just changed, so a pair
     queued against the previous step must not survive into this one.
     (Steps 0-2 only accept taps on their own target, so this is belt and
     braces; step 3 is free play and can genuinely have one in flight.) */
  clearPendingMatch();
  clearHint();
  const key = ['tutLink', 'tutDrop', 'tutBend', 'tutClear'][n] || 'tutClear';
  tutTextEl.textContent = t(key);
  tutBanner.classList.remove('hidden');
  if (n === 3) {
    hudSubEl.style.display = '';        // reveal the timer, and let it blink
    renderTimer();
    barBg.classList.add('tut-focus');
  } else {
    barBg.classList.remove('tut-focus');
  }
  if (tutTarget) showHintPair(tutTarget);
  resize();
}

function positionTutorialChrome() {
  invalidateFlyGeom();        // the banner shifts the board under the HUD
  const headH = Math.ceil(topbarEl.getBoundingClientRect().height);
  const bh = Math.ceil(tutBanner.getBoundingClientRect().height);
  const wrapTop = boardWrapEl.getBoundingClientRect().top;
  tutBanner.style.top = Math.max(headH + 6, headH + (wrapTop - headH - bh) / 2) + 'px';
  /* Nothing else to place: the timer cue lives on the bar itself now, so this
     no longer has to measure the bar on every layout change. */
}

function samePair(p, a, b) {
  if (!p) return false;
  const k1 = p[0].r + ',' + p[0].c, k2 = p[1].r + ',' + p[1].c;
  const j1 = a.r + ',' + a.c, j2 = b.r + ',' + b.c;
  return (k1 === j1 && k2 === j2) || (k1 === j2 && k2 === j1);
}
function tutAllowsFirst(r, c) {
  if (tutStep === 3 || !tutTarget) return true;
  return (tutTarget[0].r === r && tutTarget[0].c === c) ||
         (tutTarget[1].r === r && tutTarget[1].c === c);
}
function tutAllowsPair(a, b) {
  if (tutStep === 3 || !tutTarget) return true;
  return samePair(tutTarget, a, b);
}
function tutWrongChoice(r, c) {
  shakeTile(r, c);
  sfxBad();
  showToast(t('tutPick'));
  if (tutTarget) showHintPair(tutTarget);
}
function spawnCheck(r, c) {
  const rect = boardEl.getBoundingClientRect();
  tutCheck.style.left = (rect.left + c * cellPx + cellPx / 2) + 'px';
  tutCheck.style.top  = (rect.top  + r * cellPx + cellPx / 2) + 'px';
  restartAnim(tutCheck, 'tut-check-anim');
}
function tutShowBend(a, b) {
  const mp = findMinTurnPath(a.r, a.c, b.r, b.c);
  busy = true;
  if (mp) drawBendPath(mp.pts, 2400);
  sfxBad();
  deselect();
  const ep = levelEpoch;
  setTimeout(function () {
    if (ep !== levelEpoch) return;
    busy = false;
    setTutPhase(3, null);
  }, 2500);
}

/** Called after every settle while the tutorial is running.
 *  NOTE this is a full replacement for the rest of afterBoardChange(), so
 *  anything that must hold on every board - the dead-end net especially - has
 *  to be repeated here. It once was not, and the tutorial could dead-end. */
function tutOnBoardChange(ep) {
  if (tutStep === 0) {
    const moved = [];
    if (droppedSet) {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (tiles[r][c] && droppedSet.has(tiles[r][c])) moved.push(r * COLS + c);
    }
    const drop = findDropCreatedPair(moved);
    if (drop) { spawnCheck(drop[0].r, drop[0].c); setTutPhase(1, drop); return; }
    setTutPhase(3, null); return;
  }
  if (tutStep === 1) {
    tutBendPair = findBendPair();
    if (tutBendPair) { setTutPhase(2, tutBendPair); return; }
    setTutPhase(3, null); return;
  }
  if (tutStep === 3) {
    if (pairsLeft <= 0) { finishTutorial(); return; }
    /* The same net the real levels get. Step 3 asks the player to clear the
       WHOLE board, so a dead end here is a hard stop - and the tutorial is the
       worst possible place to strand someone. Steps 0-2 do not need it: they
       only accept the scripted pair, which the generator guarantees is
       linkable, and they hand over as soon as it is played. */
    if (!hasMoves()) { fixDeadBoard(ep); return; }
  }
}

function finishTutorial() {
  tutorialMode = false;
  tutTarget = null;
  tutBanner.classList.add('hidden');
  barBg.classList.remove('tut-focus');
  hudSubEl.style.display = '';

  /* Practice is over: the points earned learning the game do not carry into
     the run. Both HUD numbers are put back in step with the real state -
     SCORE to zero, BEST to the record the tutorial was not allowed to write.
     Done BEFORE saveDataNow so the practice score is never persisted. */
  clearFlyers();
  score = 0;
  updateScoreHud();               // scoreShown = 0, scorePending = 0
  updateBestHud();                // bestShown = best

  tutorialSeen = true;
  saveDataNow(lightData());
  loadLevel(0, null);
}

/** Drop any star still in the air. Their credit callbacks may still run - the
 *  clamps in deliverScore() turn those into no-ops once score is back to 0 -
 *  but the elements must not fly on into the next board. */
function clearFlyers() {
  const flying = document.querySelectorAll('.fly');
  for (let i = 0; i < flying.length; i++)
    if (flying[i].parentNode) flying[i].parentNode.removeChild(flying[i]);
}
document.getElementById('tut-skip').addEventListener('click', function (e) {
  e.stopPropagation();
  if (!tutorialMode) return;
  finishTutorial();
});

/* ================================================================
 * §16. Ticker
 * There is deliberately NO requestAnimationFrame loop. The background is CSS,
 * falls are compositor transitions and the link fades in CSS — nothing needs a
 * 60Hz callback, so the only periodic work is the countdown at 5Hz.
 * ============================================================= */
const TICK_MS = 200;
const IDLE_HINT_S = 5;
let tickHandle = 0, lastTickAt = 0, lastTickSec = -1;

function startTicker() {
  if (tickHandle) return;
  lastTickAt = nowMs();
  tickHandle = setInterval(tick, TICK_MS);
}
function stopTicker() {
  if (tickHandle) { clearInterval(tickHandle); tickHandle = 0; }
}
function tick() {
  const now = nowMs();
  let dt = (now - lastTickAt) / 1000;
  lastTickAt = now;
  /* If the WebView was backgrounded the gap can be huge; never swallow it as
     elapsed play time. */
  if (!(dt > 0) || dt > 1) dt = TICK_MS / 1000;
  if (paused || ended) return;

  if (!busy && !tutorialMode && !hintPair) {
    idleAcc += dt;
    if (idleAcc >= IDLE_HINT_S) { idleAcc = 0; showAutoHint(); }
  }
  if (tutorialMode) {
    if (tutStep === 3 && tutTimerRunning) {
      timeLeft = Math.max(0, timeLeft - dt);   // demo only — never triggers a loss
      renderTimer();
    }
    return;
  }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; renderTimer(); loseLevel(); return; }
  renderTimer();
  const s = Math.ceil(timeLeft);
  if (s <= 10 && s !== lastTickSec) { lastTickSec = s; sfxTick(); }
}

/* ================================================================
 * §17. Pause / native callbacks / chrome
 * ============================================================= */
function pauseGame() {
  if (paused || ended) return;
  paused = true;
  clearPendingMatch();
  stopTicker();
  pauseVeil.classList.remove('hidden');
  try { if (actx && actx.state === 'running') actx.suspend(); } catch (e) {}
}
function resumeGame() {
  if (!paused) return;
  paused = false;
  pauseVeil.classList.add('hidden');
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
  lastFindAt = nowMs();
  startTicker();
}
pauseVeil.addEventListener('click', function () { resumeGame(); });

window.onAppPause = function () { pauseGame(); };

/* Backgrounding the WebView used to leave the 5Hz ticker and the audio context
   running. Pausing on hide stops both, and it is also the honest behaviour: the
   countdown should not keep draining while the player cannot see the board. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') pauseGame();
});
window.onNextLevel = function () {
  if (currentLevelIdx >= MAX_LEVEL_IDX) return;
  loadLevel(currentLevelIdx + 1, null);      // score carries over across levels
};
window.onRetryLevel = function () {
  score = 0;                                  // a loss ends the run: restart at level 1
  updateScoreHud();
  loadLevel(0, null);
};

document.getElementById('back-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  if (!tutorialMode && !ended) saveCurrentState();
  sendMessage('quit');
});
soundBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  soundBtn.classList.toggle('muted', muted);
  if (!muted) { audioEnsure(); try { if (actx && actx.state === 'suspended') actx.resume(); } catch (er) {} }
  saveDataNow(lightData());
  saveCurrentState();
});

function applyStaticLabels() {
  document.getElementById('lbl-score').textContent = t('score');
  document.getElementById('lbl-best').textContent  = t('best');
  document.getElementById('lbl-level').textContent = t('level');
  document.getElementById('tut-skip-label').textContent = t('skip');
  document.getElementById('pause-txt').textContent = t('resume');
  document.documentElement.lang = LANG;
  if (LANG === 'ar') document.documentElement.dir = 'rtl';
}
function envSafeTop() {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);';
  document.body.appendChild(d);
  const h = d.getBoundingClientRect().height;
  d.parentNode.removeChild(d);
  return h || 0;
}
function applyTopInset() {
  topbarEl.style.paddingTop = (Math.max(getStatusBarHeight(), envSafeTop()) + 8) + 'px';
}

let resizeTimer = 0;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { applyTopInset(); resize(); }, 90);
});

/* ================================================================
 * §18. Boot
 * ============================================================= */
function bootGame() {
  if (booted) return;
  booted = true;

  LANG = getLanguage();
  applyUiFont(LANG);
  applyStaticLabels();
  applyTopInset();
  buildPool();

  const obj = parseInitialData();
  let startIdx = 0, snap = null;
  if (obj) {
    if (typeof obj.best === 'number' && isFinite(obj.best)) best = Math.max(0, obj.best | 0);
    if (typeof obj.score === 'number' && isFinite(obj.score)) score = Math.max(0, obj.score | 0);
    if (typeof obj.levelIdx === 'number' && isFinite(obj.levelIdx))
      startIdx = Math.max(0, Math.min(obj.levelIdx | 0, MAX_LEVEL_IDX));
    if (obj.tutorialSeen === true) tutorialSeen = true;
    if (obj.muted === true) muted = true;
    if (obj.game) snap = obj.game;
  }
  /* `currentLevel` from native wins when supplied (it is the app's resume
     point); -1 means "not supplied", so fall back to the saved index. */
  const fromNative = getInitialLevelIdx();
  if (fromNative >= 0 && fromNative !== startIdx) { startIdx = fromNative; snap = null; }

  soundBtn.classList.toggle('muted', muted);
  updateScoreHud(); updateBestHud();

  if (!tutorialSeen) startTutorial();      // no menu: first ever boot goes to the tutorial
  else loadLevel(startIdx, snap);

  /* Unlock audio on the first real gesture (autoplay policy). */
  const unlock = function () {
    audioEnsure();
    try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
    document.removeEventListener('pointerdown', unlock);
  };
  document.addEventListener('pointerdown', unlock);
}

/* Android can run injectedJavaScriptBeforeContentLoaded AFTER this inline
   script, so poll briefly for the injected globals, then boot anyway. */
(function waitForNativeInjection() {
  const start = Date.now();
  (function check() {
    const ready = typeof window.currentLevel === 'number' ||
                  typeof window.data === 'string' ||
                  typeof window.language === 'string';
    if (ready || Date.now() - start > 200) bootGame();
    else setTimeout(check, 10);
  })();
})();
</script>
