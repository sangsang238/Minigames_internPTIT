<!--
  Fruit Drop — QuanKA
  Onet / Pikachu connect puzzle WITH GRAVITY: tap 2 identical fruit tiles, they
  clear if a path with <= 2 turns (<= 3 straight segments) links them through
  empty cells (the path may run through the border ring outside the board).
  DIFFERENCE vs animal-connect: after every clear, tiles FALL to fill the space
  below them, so the board re-settles after every move.

  Art: Fluent Emoji "Flat" (Microsoft) — stock vector icons, MIT licensed.
    Copyright (c) Microsoft Corporation. Licensed under the MIT License.
    https://github.com/microsoft/fluentui-emoji
  Style: neo-brutalist print — cream paper, 3px ink outlines, hard zero-blur
    offset shadows, flat colour blocks. No gradient / blur / filter anywhere.

  Level-based, endless (levelConfig(idx) generates forever) => `victory` never
  fires; documented deviation from game-common §1.5, same as animal-connect.
  Tuân thủ .claude/game-common.md (bridge, level, i18n), popup-common.md (game
  theo level => KHÔNG tự vẽ popup kết quả, showModal:true), zip-common.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Fruit Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet" />
<style>
/* ── Reset + mobile tap fixes (game-common §UI) ───────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

:root {
  --ui-font: 'Google Sans Flex', system-ui, sans-serif;
  /* Neo-brutalist print palette — cream stock + black ink + flat accents */
  --paper:   #F4EFE4;
  --paper-2: #EDE6D7;
  --ink:     #141210;
  --card:    #FFFFFF;
  --dot:     rgba(20,18,16,.09);
  --tomato:  #E8462F;
  --sun:     #F5B92B;
  --leaf:    #3BA35A;
  --sky:     #2F6FE0;
  --grape:   #7A4FC9;
  --text:      var(--ink);
  --text-soft: rgba(20,18,16,.58);
  /* The ink outline is the structural constant of the style (no raised shadows) */
  --bw: 3px;
  --sat: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--ui-font);
  font-weight: 800;
  color: var(--text);
  background-color: var(--paper);
  /* Halftone dots — painted ONCE by the compositor, never redrawn. */
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px);
  background-size: 9px 9px;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

/* Background is the halftone paper ONLY — the drifting circles/squares were
   removed on request. Nothing in the background animates now, so the page has
   zero background work of any kind (no canvas, no compositor animation). */

/* ── App wrapper ──────────────────────────────────────────────── */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Header (same FORM as the other QuanKA games, neo-brutalist skin) ──
   left:0;right:0;margin:0 auto — NOT translateX(-50%), which overflows the
   layout box to 150vw and causes horizontal scroll. */
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  margin: 0 auto;
  width: 100%;
  max-width: 520px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  pointer-events: none;
}
#topbar .btn3d, .hud-scores { pointer-events: auto; }

#hud-bar { display: flex; align-items: center; gap: 8px; }

.hud-scores { flex: 1; min-width: 0; display: flex; gap: 8px; }
.hud-pill {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 4px 8px 5px 5px;
  background: var(--card);
  border: var(--bw) solid var(--ink);
  border-radius: 6px;
  -webkit-user-select: none; user-select: none;
}
.pill-text { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 1 0 auto; }
.pill-ico { flex: 0 0 auto; width: clamp(15px, 4.4vw, 20px); height: clamp(15px, 4.4vw, 20px); display: block; }
.hud-pill .label {
  font-size: clamp(8px, 2.7vw, 10px);
  font-weight: 800;
  letter-spacing: 1.4px;
  color: var(--text-soft);
  line-height: 1.05;
  white-space: nowrap;
}
.hud-pill .value {
  font-size: clamp(15px, 4.6vw, 22px);
  line-height: 1.1;
  color: var(--ink);
  white-space: nowrap;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
#hud-best { color: #C98A0A; }   /* BEST accent (gold) — shared QuanKA convention */

/* Sub-row: LEVEL x | time bar | seconds — spans the header width */
#hud-sub { display: flex; align-items: center; gap: 9px; padding: 0 2px; }
.sub-level {
  flex: 0 0 auto;
  font-size: 11px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-soft);
  white-space: nowrap;
}
.sub-level #hud-level { color: var(--ink); font-weight: 900; }

#time-bar-bg {
  flex: 1; min-width: 0; height: 12px;
  background: var(--card);
  border: 2.5px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
}
#time-bar-fill {
  height: 100%; width: 100%;
  background: var(--leaf);
  /* scaleX, NOT width: animating width relayouts and repaints the bar every
     single frame, and with a 200ms tick against a 250ms transition this bar is
     never once idle during a level. transform runs on the compositor, so the
     countdown now costs no main-thread work at all between ticks. */
  transform-origin: left center;
  transform: scaleX(1);
  will-change: transform;
  transition: transform .25s linear, background .3s;
}
/* Tutorial: the timer BLINKS to introduce itself, instead of an arrow pointing
   at it from below. The arrow was a fixed-position SVG that had to be measured
   and repositioned against the bar on every layout change; the bar can simply
   draw attention to itself. `steps()` is right here - this is a blink, and a
   blink is exactly what stepped timing is for (a SCALE would not be). Animating
   opacity keeps it on the compositor, so it costs no main-thread work. */
@keyframes tutBarBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
#time-bar-bg.tut-focus { animation: tutBarBlink .7s steps(2,end) infinite; }

#time-bar-fill.warn { background: var(--sun); }
@keyframes timeDanger { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
#time-bar-fill.danger { background: var(--tomato); animation: timeDanger .6s steps(2,end) infinite; }

#hud-secs {
  flex: 0 0 auto; min-width: 26px; text-align: right;
  font-size: 14px; font-weight: 900; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#hud-secs.danger { color: var(--tomato); }

/* ── Board ────────────────────────────────────────────────────── */
#board-outer {
  flex: 1;
  display: flex;
  width: 100%;
  padding: 8px;
  min-height: 0;
  /* Never scroll: the link overlay is intentionally 1 cell larger than the
     board on every side (Onet border-ring paths) and would otherwise make this
     container scrollable on BOTH axes. Ring room is reserved in the cell-size
     maths instead — see resize(). */
  overflow: hidden;
}
#board-wrap {
  margin: auto;
  position: relative;
  border-radius: 8px;
  background: var(--paper-2);
  border: var(--bw) solid var(--ink);
  padding: 6px;
}
/* `layout style` keeps a tile's work from escaping into the rest of the page.
   NOT `paint`: .selected and .pop scale a face beyond its tile box and paint
   containment would slice them off at the edge of the board. */
#board { position: relative; z-index: 1; contain: layout style; }

#link-svg { position: absolute; z-index: 3; pointer-events: none; overflow: visible; }
/* Stroke widths scale with the cell (set in resize()): a fixed 9px under-stroke
   is a quarter of a 35px cell and blots out whatever tile the route crosses. */
/* Rounded caps and joins, like animal-connect. Square caps overshot the end
   cell and mitre joins threw a spike out of every corner, which is what made
   the connector look crude at a turn. The fade is eased, not stepped, for the
   same reason - a 4-step fade on a thin line reads as flicker. */
.link-under { fill: none; stroke: var(--ink); stroke-width: var(--lw-under, 8px); stroke-linecap: round; stroke-linejoin: round; }
.link-path  { fill: none; stroke: var(--tomato); stroke-width: var(--lw-core, 4px); stroke-linecap: round; stroke-linejoin: round; }
/* Short on purpose, tightened twice on feedback (.34s -> .26s -> .2s, and the
   hold before the fade cut with it) so the connector is gone before the eye
   goes looking for the next pair. */
@keyframes linkFade { 0%,40% { opacity: 1; } 100% { opacity: 0; } }
.link-anim { animation: linkFade .2s ease-in forwards; }

/* Blocked-pair demo route (> 2 turns) shown in the tutorial */
.bend-under { fill: none; stroke: var(--ink); stroke-width: var(--lw-under, 8px); stroke-linecap: round; stroke-linejoin: round; }
.bend-path {
  fill: none; stroke: var(--tomato); stroke-width: var(--lw-core, 4px);
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 7 7;
  /* steps(), not linear: `linear` repainted this path on every frame for as
     long as the demo was up (60/s, or 144/s on a fast panel) to move it 28px.
     16 discrete hops read the same at this dash size and cost ~4-9x less. */
  animation: bendDash 1s steps(16,end) infinite;
}
@keyframes bendDash { to { stroke-dashoffset: -28; } }
.bend-dot { fill: var(--tomato); stroke: var(--ink); stroke-width: 2.5; }

/* ── Tiles ────────────────────────────────────────────────────── */
.tile {
  position: absolute;
  cursor: pointer;
  /* One number for the whole board (set on #board in resize()), not 192 pairs
     of inline width/height writes every level load and every resize. */
  width: var(--tile-size, 40px);
  height: var(--tile-size, 40px);
  -webkit-user-select: none;
  user-select: none;
  /* transform carries the grid position; a fall just changes it and lets the
     compositor run the transition — zero per-frame JS while tiles are falling */
  transition: transform 0s;
}
.tile.falling {
  transition-property: transform;
  transition-timing-function: cubic-bezier(.5,.05,.72,.28);  /* accelerating = gravity */
  /* `will-change` lives HERE and nowhere else. It used to sit on `.tile`, which
     promoted all 120 tiles of a 12x10 board to their own compositor layer for
     the whole level - a large, permanent GPU-memory bill to accelerate
     something that is stationary almost all of the time. Hinting only while a
     tile is genuinely in motion is the handful of frames where it pays. */
  will-change: transform;
}
.tile.hidden { display: none; }

.tile-face {
  width: 100%;
  height: 100%;
  border-radius: 5px;
  background: var(--card);
  border: var(--bw) solid var(--ink);
  /* NO drop shadow on board tiles: on a packed 10x12 grid every tile's hard
     shadow would fall across its neighbour and the board would read as mush.
     The ink border carries the style here; hard shadows are reserved for the
     things that sit ON the paper — HUD pills, buttons, the board frame. */
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  /* NOTE: every state animation lives on .tile-face, never on .tile — a
     keyframe with transform on .tile would override the inline grid translate
     and snap the tile to (0,0). */
  /* Eased, not stepped: a 2-step scale looks like the device dropped frames.
     Everything else in this file may stay chunky; growth and shrink may not. */
  transition: transform .12s ease, box-shadow .15s ease;
}
.tile-face svg { width: 86%; height: 86%; flex-shrink: 0; display: block; pointer-events: none; }

/* Spawn pop-in. Declared BEFORE .selected/.hint on purpose: it sets
   `transform` and `animation` at the same specificity as those state rules,
   so if it came later it would silently outrank them and a tile selected or
   hinted during the first 200ms of a level would show neither state. */
@keyframes tilePopin { 0% { opacity: 0; transform: translate(0,-8px); } 100% { opacity: 1; transform: translate(0,0); } }
/* Driven by ONE class on the board, not one per tile: a 112-tile level used to
   cost 224 classList operations (add on every tile, remove on every tile) at
   exactly the moment the level is trying to appear smoothly. Now it is 2.

   Specificity is deliberately UNCHANGED at (0,3,0) - `.board-popin .tile
   .tile-face` counts the same three classes as `.tile.selected .tile-face` -
   so the declaration-order rule below still decides, exactly as before. Do not
   "tidy" this into `#board.popin ...`: an id would outrank the state rules and
   a tile selected or hinted during the first 220ms would show neither. */
.board-popin .tile .tile-face { animation: tilePopin .22s ease-out backwards; }

/* Selected: grows and gains a much fatter INK outline.
   Deliberately colour-free — the tiles are 14 different coloured fruits, so any
   accent ring collides with something (a tomato ring on the apple tile merged
   into one solid red block). Black already reads against every icon, and the
   size jump carries the state on its own. */
.tile.selected { z-index: 3; }
.tile.selected .tile-face {
  transform: scale(1.1);
  box-shadow: 0 0 0 3px var(--ink);
}

/* Hint / tutorial target: sky-blue outer ring, blinking in hard steps.
   No fruit in the set is blue, so this one accent is always distinguishable.
   The ring is declared on the element as well as in the keyframes so it still
   shows if the animation never runs (reduced-motion, or a paused compositor). */
.tile.hint { z-index: 2; }
.tile.hint .tile-face {
  box-shadow: 0 0 0 4px var(--sky);
  animation: hintBlink .76s steps(1,end) infinite;
}
@keyframes hintBlink { 0%,49%   { box-shadow: 0 0 0 4px var(--sky); }
                       50%,100% { box-shadow: 0 0 0 0 var(--sky); } }

@keyframes tilePop { 0% { transform: scale(1); opacity: 1; }
                     45% { transform: scale(1.18); opacity: 1; }
                     100% { transform: scale(.2); opacity: 0; } }
.tile.pop { pointer-events: none; z-index: 4; }
.tile.pop .tile-face { animation: tilePop .26s ease-in forwards; }

/* Landing squash — sells the gravity without any JS per frame */
@keyframes tileLand { 0% { transform: scaleY(1); } 40% { transform: scaleY(.86) translateY(6%); } 100% { transform: scaleY(1); } }
.tile.landed .tile-face { animation: tileLand .18s ease-out; }

/* Invalid pair shake — margin-left, not transform: transform is holding the
   grid position, and the standalone `translate` property needs Chromium 104+ */
@keyframes tileShake { 0%,100% { margin-left: 0; } 20% { margin-left: -3px; } 40% { margin-left: 3px; }
                       60% { margin-left: -2px; } 80% { margin-left: 2px; } }
.tile.shake { animation: tileShake .22s steps(2,end); }

/* ── btn3d (game-common §1.4 / popup-common §6), neo-brutalist skin ── */
.btn3d {
  --radius: 6px;
  --surface-color: var(--card);
  --surface-text: var(--ink);
  --surface-height: 42px;
  --surface-width: auto;
  --surface-padding-x: 16px;
  --surface-font-size: 16px;
  position: relative;
  display: inline-block;
  padding: 0; border: 0;
  background: transparent;
  cursor: pointer;
  font: inherit; color: inherit;
  -webkit-user-select: none; user-select: none;
}
.btn3d-shadow { display: none; }
.btn3d-surface {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--surface-height);
  width: var(--surface-width);
  padding: 0 var(--surface-padding-x);
  border-radius: var(--radius);
  background: var(--surface-color);
  border: var(--bw) solid var(--ink);
  color: var(--surface-text);
  font-family: var(--ui-font);
  font-size: var(--surface-font-size);
  font-weight: 800;
  letter-spacing: .6px;
  /* No backdrop-filter anywhere in this game — it is banned for perf on
     WebView, and the flat style has no use for it. */
  transition: transform .08s steps(2,end), box-shadow .08s steps(2,end);
}
/* Flat press: no raised surface to sink, so feedback is a small scale + fill. */
.btn3d:active .btn3d-surface { transform: scale(.94); background: var(--paper-2); }
.btn3d.btn-icon { --surface-height: 42px; --surface-width: 42px; --surface-padding-x: 0; }
.back-ico    { width: 52%; height: 52%; fill: currentColor; display: block; }
.restart-ico { width: 62%; height: 62%; fill: currentColor; display: block; }
.snd-ico     { width: 58%; height: 58%; display: block; }
.snd-slash   { display: none; }
#sound-btn.muted .snd-waves { display: none; }
#sound-btn.muted .snd-slash { display: block; }

.btn3d.mini { --surface-height: 32px; --surface-font-size: 13px; --surface-padding-x: 12px;
              --surface-color: var(--sun); }

/* ── Floating text — OUTLINE only, never a background chip (QA 2026-07-28/29) ── */
.pop-txt {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  white-space: nowrap;
  font-weight: 900;
  color: var(--card);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  letter-spacing: .5px;
}
@supports not (paint-order: stroke) {
  .pop-txt {
    -webkit-text-stroke: 0;
    text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink),
                 2px 2px var(--ink), -2px -2px var(--ink), 2px -2px var(--ink), -2px 2px var(--ink);
  }
}
#combo-badge { top: 40%; font-size: 30px; z-index: 100; }
#praise      { top: 30%; font-size: 21px; z-index: 101; }
#toast       { top: 22%; font-size: 17px; z-index: 150; transition: opacity .25s steps(3,end); }
#toast.show  { opacity: 1; }

@keyframes comboPop { 0% { opacity: 0; transform: translateX(-50%) scale(.5); }
                      28% { opacity: 1; transform: translateX(-50%) scale(1.2); }
                      66% { opacity: 1; transform: translateX(-50%) scale(1); }
                      100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(.9); } }
.combo-anim { animation: comboPop .66s steps(6,end) forwards; }
@keyframes praisePop { 0% { opacity: 0; transform: translateX(-50%) scale(.6); }
                       25% { opacity: 1; transform: translateX(-50%) scale(1.1); }
                       70% { opacity: 1; transform: translateX(-50%) translateY(-10px) scale(1); }
                       100% { opacity: 0; transform: translateX(-50%) translateY(-34px) scale(.9); } }
.praise-anim { animation: praisePop 1s steps(8,end) forwards; }

/* Score flyer — a small inked chip that travels from the link to the SCORE pill */
/* Score flyer — the SAME star as the SCORE pill icon, so the thing that flies
   up and the thing it lands in are visibly one idea. */
.fly {
  position: fixed;
  z-index: 40;
  width: 24px; height: 24px;
  margin: -12px 0 0 -12px;
  pointer-events: none;
  will-change: transform, opacity;
  /* Duration comes from JS (--fly-ms, see FLY_MS) so the moment the star lands
     and the moment its points are credited can never drift apart. */
  transition: transform var(--fly-ms,620ms) cubic-bezier(.45,0,.3,1),
              opacity   var(--fly-ms,620ms) steps(4,end);
}
.fly svg { width: 100%; height: 100%; display: block; }
/* The pop is at 0%, and each value is HELD to its own stop rather than
   interpolated - a chunky 3-frame decay in the house steps() style that starts
   on the very first frame. The old shape put scale(1) at 0% and the peak at
   45% under steps(2,end), which meant the pill sat perfectly still for the
   first half of the animation before doing anything. */
/* No throb on the SCORE pill: removed on request. The number changing as each
   star lands is the feedback; scaling the whole pill on top of that was noise,
   and with up to six stars per match it fired six times in a row. */

/* ── Tutorial ─────────────────────────────────────────────────── */
#tut-banner {
  position: fixed;
  left: 50%;
  top: 80px;
  transform: translateX(-50%);
  z-index: 240;
  width: min(88%, 380px);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: var(--bw) solid var(--ink);
  border-radius: 8px;
  padding: 12px 13px;
  transition: opacity .2s steps(3,end);
}
#tut-banner.hidden { opacity: 0; pointer-events: none; }
#tut-text { flex: 1; color: var(--ink); font-size: 14px; line-height: 1.4; font-weight: 800; }


#tut-check { position: fixed; z-index: 45; pointer-events: none; width: 46px; height: 46px;
             margin: -23px 0 0 -23px; opacity: 0; }
#tut-check svg { width: 100%; height: 100%; display: block; }
.tut-check-anim { animation: tutCheckPop .7s steps(6,end) forwards; }
@keyframes tutCheckPop { 0% { opacity: 0; transform: scale(.3); }
                         35% { opacity: 1; transform: scale(1.15); }
                         70% { opacity: 1; transform: scale(1); }
                         100% { opacity: 0; transform: scale(1.05) translateY(-8px); } }

/* ── Pause veil (not a result popup — game-common §1.3 onAppPause) ── */
#pause-veil {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  background: rgba(20,18,16,.62);
  opacity: 1;
  transition: opacity .2s steps(3,end);
}
#pause-veil.hidden { opacity: 0; pointer-events: none; }
#pause-veil .pv-txt {
  color: var(--card); font-size: 20px; letter-spacing: 1.5px; font-weight: 900;
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
}

/* ── Responsive — MUST stay last so it can override the rules above.
   (animal-connect had a @media block sitting BEFORE the base rules with equal
   specificity, so its small-screen overrides never once applied.) ── */
@media (max-height: 640px) {
  #topbar .btn3d.btn-icon { --surface-height: 36px; --surface-width: 36px; }
  #tut-banner { padding: 9px 12px; }
  #tut-text { font-size: 13px; }
}
@media (max-width: 360px) {
  .btn3d.btn-icon { --surface-height: 38px; --surface-width: 38px; }
  :root { --bw: 2.5px; }
}
</style>
</head>
<body>

<!-- Fluent Emoji "Flat" icon sprite (MIT, (c) Microsoft). One <symbol> per

/* ================================================================
 * §1. Native bridge (game-common §1) — game WITH levels
 * ============================================================= */
function post(msg) {
  try {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    } else {
      console.log('[fruit-drop → native]', msg);
      devSimulateNative(msg);
    }
  } catch (e) { /* ignore */ }
}
function sendMessage(type, opts) {
  opts = opts || {};
  post({
    type: type,
    level: currentLevelIdx + 1,
    result: opts.result != null ? opts.result : null,
    data: opts.data != null ? opts.data : null,
    showModal: opts.showModal === true,
  });
}
/** Dev-only: in a plain browser there is no app popup, so fake the buttons the
 *  app would show. Never runs inside the real WebView. */
function devSimulateNative(msg) {
  if (msg.type !== 'game_result') return;
  setTimeout(function () {
    if (msg.result === 'win' && typeof window.onNextLevel === 'function') window.onNextLevel();
    else if (typeof window.onRetryLevel === 'function') window.onRetryLevel();
  }, 1400);
}
function saveData(payload) {
  const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
  sendMessage('save_data', { data: data });
}

/* Throttled variant for the mid-run record.
   Score accumulates across a whole run, so once the player passes their old
   best EVERY subsequent clear sets a new one — sending save_data each time put
   ~260 bridge messages through a single session. The record still must survive
   the app being killed, so: localStorage is written immediately (it is in-
   WebView and free) while native gets at most one message every SAVE_MIN_MS,
   with a trailing send so the final value is never dropped. Level end and run
   end always force an immediate, unthrottled send. */
const SAVE_MIN_MS = 4000;
let lastSaveAt = -1e9, saveTrailing = 0;
function saveDataThrottled(payload) {
  const now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastSaveAt >= SAVE_MIN_MS) {
    lastSaveAt = now;
    clearTimeout(saveTrailing); saveTrailing = 0;
    saveData(payload);
    return;
  }
  if (saveTrailing) return;
  saveTrailing = setTimeout(function () {
    saveTrailing = 0;
    lastSaveAt = (window.performance && performance.now) ? performance.now() : Date.now();
    saveData(lightData());
  }, SAVE_MIN_MS - (now - lastSaveAt));
}
function saveDataNow(payload) {
  clearTimeout(saveTrailing); saveTrailing = 0;
  lastSaveAt = (window.performance && performance.now) ? performance.now() : Date.now();
  saveData(payload);
}

}

/** Light data (native, wins) merged over the heavy in-progress board (localStorage). */
function parseInitialData() {
  if (isResetRun()) { clearLocal(); return null; }    // repo convention for playtests
  let nativeObj = null, localObj = null;
  const raw = getInitialData();
  if (raw) { try { nativeObj = JSON.parse(raw); } catch (e) {} }
  const lraw = readLocal();
  if (lraw) { try { localObj = JSON.parse(lraw); } catch (e) {} }
  if (!nativeObj && !localObj) return null;
  const merged = Object.assign({}, localObj || {}, nativeObj || {});
  if (localObj && localObj.game) merged.game = localObj.game;
  return merged;
}
/* ================================================================
 * §2. Level configuration — endless, generated from the index
 * ============================================================= */
const ICON_COUNT = 14;
const MAX_LEVEL_IDX = 9998;          // guard against absurd values from native

/* [cols, rows, typesOnBoard]; every cols*rows is EVEN so the board tiles
   perfectly into pairs. Both the shape and the type count were MEASURED with
   the gravity-aware deadlock simulator, and both corrected an assumption:
     - Gravity makes dead ends far MORE likely than in static Onet, not less.
       Clearing a pair in static Onet leaves a hole in the middle of the board,
       and those holes are the routing corridors later pairs need. Gravity
       migrates every hole to the top instead, leaving a dense slab whose only
       linkable tiles are the ones on its surface.
     - So the two levers that matter are SHAPE and TYPE COUNT, not the
       adjacency fraction. Wide beats tall by a mile (12x10 dead-ends 7.5% of
       games, 10x12 with identical cells and types dead-ends 20%), and every
       extra fruit type hurts sharply (on one board: 6 types 5%, 14 types 38%).
   Hence: boards stay wide, and the number of DIFFERENT fruits on the board is
   held so that roughly 3+ pairs of each are present. Measured result for this
   table is ~6-12% of games needing a single auto-shuffle. */
/* PORTRAIT ramp. Boards are TALLER than wide and never exceed 7 columns,
   because the game is designed for a phone held upright.

   Sizes below are written [COLS, ROWS, types] - so level 1 is 5 wide by 6 tall.

   Columns climb 5 -> 6 -> 7 and then stop; after that only rows grow. Seven is
   the cap the brief sets, and it is also roughly what the screen wants: at 7
   columns a 360px phone gives 40px of width per cell, so width stops being the
   binding constraint and height takes over.

   ROW STEPS ARE NOT ALWAYS 1, and that is parity, not carelessness: COLS x ROWS
   must be EVEN or the board cannot tile into pairs. With 6 columns (even) rows
   may step by 1; with 5 or 7 (odd) rows must stay even, so they step by 2. That
   is why the tail runs 7x8, 7x10, 7x12 rather than 7x8, 7x9, 7x10.

   THIS RAMP IS DELIBERATELY TALL, which reverses the rule the previous table
   was built around. Wide used to beat tall by 4-10 points of dead-end rate, and
   that mattered because a dead board meant a full reshuffle in the player's
   face. It does not mattermuch any more: a dead board now costs ONE two-tile
   swap (see repairOneSwap), so the orientation penalty is paid in something the
   player barely sees rather than in a board-wide scramble. Re-measured on this
   table - see the README - dead boards cost well under one repair per game.

   Cells: 30 36 42 48 56 70 84 98 112, i.e. +6,+6,+6,+8,+14,+14,+14,+14. The
   board stops growing at 7x16 and the clock keeps tightening from there. */
const LEVEL_RAMP = [
  [5, 6, 5],  [6, 6, 6],   [6, 7, 7],   [6, 8, 8],
  [7, 8, 9],  [7, 10, 10], [7, 12, 12], [7, 14, 12], [7, 16, 12],
];

/* Only ~12 fruits are ever on one board, but the window ROTATES with the level
   so all 14 icons are seen across a run — variety without the dead-end cost. */
function typeIdsFor(idx, n) {
  const ids = [], off = idx % ICON_COUNT;
  for (let i = 0; i < n; i++) ids.push((off + i) % ICON_COUNT);
  return ids;
}

function levelConfig(idx) {
  const s = LEVEL_RAMP[Math.min(idx, LEVEL_RAMP.length - 1)];
  const cols = s[0], rows = s[1];
  const pairs = (cols * rows) / 2;
  /* Time is per PAIR, so a bigger board is automatically granted more of it -
     growing the board lengthens a level rather than instantly starving it. The
     squeeze is this coefficient, and it moves in THREE named phases so that
     only ONE difficulty lever is ever in motion:

       L1-L9    the BOARD grows (see LEVEL_RAMP) and the clock tightens with it
       L10-L15  the board is fixed at 7x16; the CLOCK alone keeps tightening
       L16+     nothing moves. This is the difficulty CEILING, held for ever.

     The handovers are exact on purpose: perPair is 1.6 at L9, which is both the
     end of the growth phase and the start of the clock phase, and it reaches
     the floor exactly at L15 so that L16 is the first level identical to the
     one before it.

     Tuned so a RUN lasts roughly 5-10 minutes. A run ends when the clock gets
     tighter than the player is fast, so it all follows from ONE assumption:
     how many seconds a player needs per pair, scanning included:
         2.6s/pair (slow)       fails L6   run ~6.1 min
         2.2s/pair (typical)    fails L8   run ~8.3 min
         1.8s/pair (quick)      fails L9   run ~8.5 min
         1.5s/pair (very fast)  fails L10  run ~8.6 min
         1.2s/pair (implausible)fails L13  run ~10.2 min
     The last row runs slightly over the 10-minute target, and that is the
     direct price of stretching the squeeze out to L15: a longer tail means the
     very fastest players get more levels before it bites. It is paid by a rate
     no playtest has yet shown to be real, and steepening the early phase to
     claw it back would spoil the common case, so it is left alone.

     THE FLOOR MUST SIT BELOW THE FASTEST PLAUSIBLE RATE or quick players never
     lose at all - with the floor at 1.5 a 1.5s/pair player once ran 274 minutes
     in the model without failing a level. 0.9 is under any rate a human
     sustains across 56 pairs, so every run ends.

     That per-pair figure is an ASSUMPTION, not a measurement: it is the one
     number to re-tune if playtests disagree, and everything else follows from
     it. */
  const GROWTH_END = 8;                 // idx of L9, last level whose board grew
  const SQUEEZE_END = 14;               // idx of L15, last level that gets less time
  const PER_PAIR_HANDOVER = 1.6;        // value at L9, shared by both phases
  const PER_PAIR_FLOOR = 0.9;           // value from L15 on
  let perPair;
  if (idx <= GROWTH_END) {
    perPair = 4.0 - idx * 0.30;                       // 4.0 at L1 down to 1.6 at L9
  } else if (idx <= SQUEEZE_END) {
    const step = (PER_PAIR_HANDOVER - PER_PAIR_FLOOR) / (SQUEEZE_END - GROWTH_END);
    perPair = PER_PAIR_HANDOVER - (idx - GROWTH_END) * step;
  } else {
    perPair = PER_PAIR_FLOOR;
  }
  const time = Math.round(pairs * perPair / 5) * 5;
  return { cols: cols, rows: rows, typeIds: typeIdsFor(idx, s[2]),
           time: time, pairs: pairs };
}

/* Fraction of pairs planted as an ADJACENT domino. Measured as a weak lever on
   the dead-end rate but a strong one on how "obviously paired" the board looks,
   so it is kept LOW and the safety comes from the ramp above instead. */
function adjFraction(idx) { return 0.15; }
