<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#96c4dd">
<title>Hamster Jump</title>

<!-- Google Sans Flex (game-common.md — UI font chung) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">

<style>
/* ── Reset chung (game-common.md — bắt buộc, đặt đầu stylesheet) ── */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent; /* tắt ô xanh dương khi chạm */
  -webkit-touch-callout: none;              /* tắt menu giữ-để-chọn */
}

:root {
  --ui-font: 'Google Sans Flex', system-ui, sans-serif;
  --sbh: 0px;                /* statusBarHeight (dp) — JS set lúc boot */
  --sat: env(safe-area-inset-top, 0px);   /* safeTop() đọc biến này — trước đây không ai khai báo */
  --text: #5a4326;
  --glass-border: rgba(255, 255, 255, .6);
}

html, body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #96c4dd;
  font-family: var(--ui-font);
  font-weight: 700;
  color: var(--text);
}

#app { position: fixed; inset: 0; }

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── Header chuẩn — BỐ CỤC copy từ index(exampleforheader.html):
      Back/Volume neo 2 mép (absolute), 2 pill SCORE+BEST BẰNG NHAU căn giữa;
      top + width do layoutHud() đặt. Màu giữ tông kem ấm của game. ──────── */
.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.btn3d.hud-back { position: absolute; left: 12px; }
.btn3d.hud-mute { position: absolute; right: 12px; }
.hud-scores {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
}
.hud-pill {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  background: rgba(255, 250, 236, .94);
  border: 2px solid rgba(150, 105, 45, .3);
  border-radius: 14px;
  padding: 7px 8px 9px 4px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 rgba(150, 100, 40, .22);
}
.pill-text { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 1 0 auto; }
.pill-ico {
  flex: 0 0 auto;
  width: clamp(16px, 4.8vw, 21px); height: clamp(16px, 4.8vw, 21px); display: block;
  filter: drop-shadow(0 1px 1px rgba(150, 100, 30, .35));
}
.hud-pill .label {
  font-size: clamp(10px, 3.2vw, 13px);
  font-weight: 700; letter-spacing: .5px;
  color: #a9803f; line-height: 1.05; white-space: nowrap;
}
.hud-pill .value {
  font-size: clamp(16px, 5vw, 24px); line-height: 1.1;
  color: #6f4a1c; white-space: nowrap;
  font-weight: 800; text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
}
#best-val { color: #e8842c; }
.back-ico { width: 52%; height: 52%; fill: currentColor; display: block; }
.snd-ico { width: 58%; height: 58%; display: block; }

/* Nút Back / Volume: icon vuông, nền kem phẳng đồng bộ pill (top/size do JS) */
.btn3d.hud-back, .btn3d.hud-mute { --surface-height: 44px; --surface-width: 44px; --radius: 13px; }
.btn3d.hud-back .btn3d-shadow, .btn3d.hud-mute .btn3d-shadow { display: none; }
.btn3d.hud-back .btn3d-surface, .btn3d.hud-mute .btn3d-surface {
  background: rgba(255, 250, 236, .94);
  border: 2px solid rgba(150, 105, 45, .3);
  color: #7a4f1e;
  backdrop-filter: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 rgba(150, 100, 40, .22);
}
.btn3d.hud-back:active .btn3d-surface, .btn3d.hud-mute:active .btn3d-surface { background: rgba(244, 232, 210, .95); }
#mute-btn .ico-off { display: none; }
#mute-btn.muted .ico-on { display: none; }
#mute-btn.muted .ico-off { display: block; }

/* chỉ báo chuỗi Perfect */
#streak {
  position: absolute;
  top: calc(max(var(--sbh), env(safe-area-inset-top, 0px)) + 88px);
  left: 0; right: 0;
  text-align: center; font-size: 16px; font-weight: 800;
  color: #e8842c; text-shadow: 0 1px 0 rgba(255, 255, 255, .85);
  pointer-events: none; z-index: 5;
  opacity: 1; transition: opacity .25s;
}
#streak.hidden { opacity: 0; }
/* 2 class luân phiên → chạy lại animation mà KHÔNG cần ép reflow (void offsetWidth) */
#streak.pop, #streak.pop-b { animation: streakPop .3s ease-out; }
@keyframes streakPop {
  0%   { transform: scale(1.45); }
  100% { transform: scale(1); }
}

/* ── btn3d (game-common §1.4 / popup-common §6) ───────────────── */
.btn3d {
  --radius: 12px;
  --surface-color: rgba(255, 255, 255, .5);
  --surface-text: var(--text);
  --surface-height: 42px;
  --surface-width: auto;
  --surface-padding-x: 16px;
  --surface-font-size: 18px;
  position: relative;
  display: inline-block;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  font: inherit;
  color: inherit;
  -webkit-user-select: none;
  user-select: none;
}
.btn3d-shadow { display: none; }
.btn3d-surface {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--surface-height);
  width: var(--surface-width);
  padding: 0 var(--surface-padding-x);
  border-radius: var(--radius);
  background: var(--surface-color);
  border: 1px solid var(--glass-border);
  color: var(--surface-text);
  font-family: var(--ui-font);
  font-size: var(--surface-font-size);
  letter-spacing: .5px;
  /* KHÔNG backdrop-filter: mọi nút đều nằm trên canvas vẽ lại 60fps → blur nền
     phải tính lại mỗi khung, cực đắt trên WebView. (Tất cả biến thể nút vốn đã
     override về none, nên bỏ hẳn không đổi giao diện.) */
  transition: transform .09s ease-out, background .1s;
}
.btn3d:active { transform: scale(.94); }
.btn3d:active .btn3d-surface { background: rgba(255, 255, 255, .75); }

.btn3d.btn-icon {
  --surface-height: 42px;
  --surface-width: 42px;
  --surface-padding-x: 0;
}
.back-ico { width: 52%; height: 52%; fill: currentColor; display: block; }

/* ── Màn loading (che lúc dò độ phân giải) ────────────────────── */
#loading {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  /* ĐỤC hoàn toàn: dưới nó canvas bị cấp phát lại 2-3 lần, hở ra là chớp đen */
  background: linear-gradient(180deg, #fdf6e4 0%, #f6e7c6 55%, #efdcb2 100%);
  opacity: 1; transition: opacity .3s;
}
#loading.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
.load-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.load-cheese {
  width: 84px; height: 63px; display: block;
  animation: loadBob 1.1s ease-in-out infinite;
}
@keyframes loadBob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-9px) rotate(3deg); }
}
.load-title {
  font-family: var(--ui-font);
  font-size: 17px; font-weight: 800; letter-spacing: .5px;
  color: #8a6329; text-shadow: 0 1px 0 rgba(255, 255, 255, .7);
}
.load-bar {
  width: 148px; height: 7px; border-radius: 4px; overflow: hidden;
  background: rgba(150, 105, 45, .18);
}
.load-bar > i {
  display: block; height: 100%; width: 0%;
  border-radius: 4px; background: #e8a33c;
  transition: width .2s ease-out;
}

/* ── Tutorial: gợi ý + nhắc bấm ───────────────────────────────── */
#tut-hint {
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: 17%;
  text-align: center;
  font-size: 19px;
  color: #5a4326;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
  /* nền đục thay cho backdrop-filter: blur() — blur nền đè lên canvas động
     buộc trình duyệt blur lại TOÀN khung mỗi frame (thủ phạm giật nặng nhất) */
  background: rgba(255, 252, 244, .88);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 10px 14px;
  z-index: 4;
  pointer-events: none;
  opacity: 1;
  transition: opacity .25s, visibility 0s;
}
/* visibility: hidden → thoát hẳn khỏi cây vẽ; opacity:0 vẫn bị composite mỗi frame.
   Hoãn visibility tới khi mờ xong để vẫn còn hiệu ứng fade-out. */
#tut-hint.hidden { opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
#tut-tap {
  position: absolute;
  left: 0; right: 0;
  bottom: 27%;
  text-align: center;
  font-size: 36px;
  color: #e8842c;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .9);
  z-index: 4;
  pointer-events: none;
  animation: tapPulse .5s ease-in-out infinite;
}
#tut-tap.hidden { display: none; }

@keyframes tapPulse {
  0%, 100% { opacity: .55; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.06); }
}

/* ── Popup Game Over / New Best (popup-common.md) ─────────────── */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 9, 24, .7);
  opacity: 1;
  transition: opacity .25s, visibility 0s;
}
.overlay.hidden {
  opacity: 0; pointer-events: none;
  visibility: hidden;                 /* không composite lớp phủ full-screen khi đang chơi */
  transition: opacity .25s, visibility 0s .25s;
}

.card {
  width: min(82%, 360px);
  padding: 26px;
  text-align: center;
  border-radius: 22px;
  background: linear-gradient(180deg, #4a3520, #241708);  /* gradient theme phô mai nướng — tông tối */
  border: 2px solid rgba(255, 205, 120, .25);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  transform: scale(1);
  transition: transform .25s;
}
.overlay.hidden .card { transform: scale(.9); }

.card-title { color: #fff; font-size: 30px; margin-bottom: 14px; }

.sb { display: flex; justify-content: center; gap: 30px; margin-bottom: 18px; }
.sb .k {
  font-family: system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #8fb4ff;
  font-weight: 800;
}
.sb .v { font-size: 32px; color: #fff; }
.sb .v.best { color: #ffd23f; }

.btn3d.play {
  --surface-height: 52px;
  --surface-padding-x: 34px;
  --surface-color: #ffb02e;
  --surface-text: #3a2400;
  --surface-font-size: 17px;
}
.btn3d.play .btn3d-surface { border: 0; backdrop-filter: none; }
/* popup-common §7: amber CTA là màu cố định — không cho :active glass đè */
.btn3d.play:active .btn3d-surface { background: var(--surface-color); }

/* nút Menu phụ trên popup kết quả — glass tối */
.ov-menu-row { margin-top: 10px; }
#ov-menu-btn {
  --surface-height: 40px;
  --surface-padding-x: 24px;
  --surface-font-size: 15px;
}
#ov-menu-btn .btn3d-surface {
  background: rgba(255, 255, 255, .12);
  border-color: rgba(255, 255, 255, .25);
  color: #fff;
  backdrop-filter: none;
}

/* Chữ Ả Rập là chữ nối liền — bỏ letter-spacing để không đứt nét */
body.lang-ar #score-label,
body.lang-ar .chip .lbl,
body.lang-ar .sb .k,
body.lang-ar .btn3d-surface { letter-spacing: 0; }

/* ── Responsive: co giãn theo bề rộng, chỉnh layout khi màn thấp ── */
#topbar { gap: 8px; }
#hud-mid { flex: 1 1 auto; min-width: 0; }
#back-btn, #hud-right { flex: 0 0 auto; }
#score-num { font-size: clamp(28px, 9vw, 40px); }
.chip { min-width: clamp(64px, 17vw, 87px); }
.chip .val { font-size: clamp(19px, 5.2vw, 25px); }
#hud-coin { font-size: clamp(16px, 4.4vw, 21px); }
#start-title { font-size: clamp(28px, 8.5vw, 44px); }

@media (max-width: 380px) {
  .chip .lbl { font-size: 11px; letter-spacing: 2px; }
  #coin-ico { width: 18px; height: 18px; }
  #score-label { font-size: 10px; }
  #streak { font-size: 13px; }
  #info-btn { right: 10px; }
  #snd-btn { left: 10px; }
}

@media (max-height: 600px) {
  /* màn thấp / landscape: dồn menu lên, nút hướng dẫn nằm cạnh cột chip */
  #menu { top: 6%; }
  #start-title { margin-bottom: 12px; }
  #play-btn { --surface-height: 48px; --surface-font-size: 18px; }
  #tut-btn { --surface-height: 40px; }
  #menu .btn-row { margin-top: 10px; }
  #tut-hint { bottom: 7%; font-size: 16px; padding: 7px 12px; }
  #tut-tap { bottom: 24%; font-size: 30px; }
  #info-btn {
    top: calc(max(var(--sbh), env(safe-area-inset-top, 0px)) + 8px);
    right: calc(12px + clamp(64px, 17vw, 87px) + 12px);
  }
  .card.info-card { max-height: 92%; }
}
</style>
</head>
<body>

<div id="app">

  <canvas id="game-canvas"></canvas>

  <!-- Màn loading: che lúc dò độ phân giới (calibrate). Phải ĐỤC để 2-3 lần
       cấp phát lại canvas không lộ ra thành chớp đen như bản trước. -->
  <div id="loading">
    <div class="load-box">
      <svg class="load-cheese" viewBox="0 0 64 48" aria-hidden="true">
        <path d="M4 20 L58 20 L58 40 Q58 44 54 44 L8 44 Q4 44 4 40 Z" fill="#f3e17f" stroke="rgba(160,125,55,.45)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M4 20 L14 8 L58 8 L58 20 Z" fill="#f9efad" stroke="rgba(160,125,55,.45)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="20" cy="30" r="4.5" fill="#d9bf5c"/>
        <circle cx="38" cy="35" r="3" fill="#d9bf5c"/>
        <circle cx="47" cy="27" r="3.6" fill="#d9bf5c"/>
      </svg>
      <div class="load-title" id="load-title">Loading…</div>
      <div class="load-bar"><i id="load-fill"></i></div>
    </div>
  </div>

  <!-- Header chuẩn (bố cục copy từ index(exampleforheader).html) -->
  <div class="hud">
    <div class="btn3d btn-icon hud-back" id="back-btn" role="button" aria-label="Back" tabindex="0">
      <span class="btn3d-shadow"></span>
      <span class="btn3d-surface">
        <svg class="back-ico" viewBox="0 0 447.243 447.243" aria-hidden="true">
          <path fill="currentColor" d="M420.361 192.229a31.967 31.967 0 0 0-5.535-.41H99.305l6.88-3.2a63.998 63.998 0 0 0 18.08-12.8l88.48-88.48c11.653-11.124 13.611-29.019 4.64-42.4-10.441-14.259-30.464-17.355-44.724-6.914a32.018 32.018 0 0 0-3.276 2.754l-160 160c-12.504 12.49-12.515 32.751-.025 45.255l.025.025 160 160c12.514 12.479 32.775 12.451 45.255-.063a32.084 32.084 0 0 0 2.745-3.137c8.971-13.381 7.013-31.276-4.64-42.4l-88.32-88.64a64.002 64.002 0 0 0-16-11.68l-9.6-4.32h314.24c16.347.607 30.689-10.812 33.76-26.88 2.829-17.445-9.019-33.88-26.464-36.71z"/>
        </svg>
      </span>
    </div>

    <div class="hud-scores" id="hud-scores">
      <div class="hud-pill">
        <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14 L18.3 21 L12 17.3 L5.7 21 L7.3 14 L2 9.3 L9.1 8.6 Z" fill="#ffc63f" stroke="#c8901a" stroke-width="1" stroke-linejoin="round"/>
        </svg>
        <div class="pill-text">
          <div class="label" id="lbl-score">SCORE</div>
          <div class="value" id="score-val">0</div>
        </div>
      </div>
      <div class="hud-pill">
        <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 18 L4.2 8 L9 12.5 L12 5.5 L15 12.5 L19.8 8 L21 18 Z" fill="#ffc63f" stroke="#a9740a" stroke-width="1.2" stroke-linejoin="round"/>
          <rect x="3.4" y="16.6" width="17.2" height="3" rx="1.2" fill="#f0b400"/>
        </svg>
        <div class="pill-text">
          <div class="label" id="lbl-best">BEST</div>
          <div class="value" id="best-val">0</div>
        </div>
      </div>
    </div>

    <div class="btn3d btn-icon hud-mute" id="mute-btn" role="button" aria-label="Sound" tabindex="0">
      <span class="btn3d-shadow"></span>
      <span class="btn3d-surface">
        <svg class="snd-ico ico-on" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 9v6h4l5 4.5v-15L7 9H3z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18.2 6.1a8.3 8.3 0 0 1 0 11.8"/>
        </svg>
        <svg class="snd-ico ico-off" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 9v6h4l5 4.5v-15L7 9H3z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 9.5l5 5m0-5l-5 5"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- chuỗi Perfect (dưới hàng điểm) -->
  <div id="streak" class="hidden">Perfect &times;2</div>


  <!-- Tutorial: gợi ý + nhắc bấm -->
  <div id="tut-hint" class="hidden"></div>
  <div id="tut-tap" class="hidden">TAP!</div>

  <!-- Popup kết quả (popup-common.md — game điểm cao tự vẽ) -->
  <div id="overlay" class="overlay hidden"><div class="card">
    <div class="card-title" id="ov-title">Game Over</div>
    <div class="sb">
      <div><div class="k" id="ov-lbl-score">SCORE</div><div class="v"      id="ov-score">0</div></div>
      <div><div class="k" id="ov-lbl-best">BEST</div> <div class="v best" id="ov-best">0</div></div>
    </div>
    <button class="btn3d play" id="ov-btn" type="button">
      <span class="btn3d-shadow"></span><span class="btn3d-surface" id="ov-btn-text">Play Again</span>
    </button>
  </div></div>

</div>

<script>
'use strict';

/* ================================================================
 * §0. i18n (game-common §5 — inline, fallback 'en')
 * ================================================================ */
const SUPPORTED_LANGS = [
  'en','vi','zh-Hans','zh-Hant','ja','ko','es','es-MX','es-AR',
  'pt-BR','pt','fr','de','it','nl','pl','ru','tr','ar','hi','th','id','fil',
];
const LATIN_LANGS = new Set([
  'en','vi','es','es-MX','es-AR','pt-BR','pt','fr','de','it','nl','pl','tr','id','fil',
]);
const DEFAULT_LANG = 'en';

/* i18n gọn theo QA 2026-07-22: CHỈ TUTORIAL được dịch (23 locale);
   mọi text UI khác (Score/Best/nhãn HUD/popup…) dùng tiếng Anh — t() fallback 'en'. */
const I18N = {
  en: { score:'SCORE', best:'BEST', perfect:'Perfect!', playAgain:'Play Again', gameOver:'Game Over',
    newBest:'New Best!', tapToResume:'Tap to resume', back:'Back', sound:'Sound', loading:'Loading…', tutTap:'TAP!',
    tutJump:'Tap to jump when the cheese gets close!', tutGood:'Nice!', tutHaveFun:'Have fun!' },
  vi: { tutTap:'NHẢY!', tutJump:'Chạm để nhảy khi phô mai tới gần!', tutGood:'Giỏi lắm!',
    tutHaveFun:'Chúc chơi vui vẻ!' },
  'zh-Hans': { tutTap:'跳！', tutJump:'奶酪靠近时点击跳跃！', tutGood:'真棒！', tutHaveFun:'玩得开心！' },

let LANG = DEFAULT_LANG;
function t(key) {
  return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
}

function getLanguage() {
  const fromWin = typeof window.language === 'string' ? window.language : null;
  const fromUrl = new URLSearchParams(window.location.search).get('language');
  const raw = fromWin != null ? fromWin : fromUrl;
  return SUPPORTED_LANGS.includes(raw) ? raw : DEFAULT_LANG;
}

function applyUiFont(lang) {
  if (!LATIN_LANGS.has(lang)) {
    document.documentElement.style.setProperty('--ui-font', 'system-ui, sans-serif');
  }
}

/* Font cho chữ vẽ lên canvas (game-common §UI — canvas không đọc CSS) */
let CANVAS_FONT_STACK = "'Google Sans Flex', system-ui, sans-serif";

/* ================================================================
 * §1. Native bridge (game-common §1 — game KHÔNG level)
 * ================================================================ */
function post(msg) {
  try {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    } else {
      console.log('[hamster-jump → native]', msg);
    }
  } catch (e) { /* ignore */ }
}

function sendMessage(type, opts) {
  opts = opts || {};
  post({
    type,
    level: null,                        // game không có level → luôn null
    result: opts.result ?? null,
    data: opts.data ?? null,
    showModal: opts.showModal === true,
  });
}

function saveData(payload) {
  const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
  sendMessage('save_data', { data });
}

/* ── localStorage (game-common §1.2 — chỉ data nhẹ) ───────────── */
const LS_KEY = 'hamster_jump_v1';

function saveLocal(payload) {
  try {
    const s = typeof payload === 'string' ? payload : JSON.stringify(payload);
    localStorage.setItem(LS_KEY, s);
  } catch (e) { /* private mode / quota */ }
}
function readLocal() {
  try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; }
}

/* ── statusBarHeight (game-common §2 — ưu tiên URL) ───────────── */
function getStatusBarHeight() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('statusBarHeight');
  const fromWin = typeof window.statusBarHeight !== 'undefined' ? window.statusBarHeight : null;
  let h = Number(fromUrl != null ? fromUrl : fromWin);
  if (Number.isNaN(h) || h < 0) h = 0;
  return h;
}

/* ── data (game-common §4 — ưu tiên window) ───────────────────── */
function getInitialData() {
  const fromWin = typeof window.data === 'string' ? window.data : null;
  const fromUrl = new URLSearchParams(window.location.search).get('data');
  return fromWin != null ? fromWin : (fromUrl || '');
}

/** Đọc {best, tut, mute} từ native (ưu tiên) + localStorage; lấy max để không mất dữ liệu.
 *  Trả thêm `game` (tower snapshot) từ localStorage nếu có. */
function loadSaved() {
  const out = { best: 0, tut: 0, mute: 0, game: null };
  const pick = (raw, fromNative) => {
    try {
      const o = JSON.parse(raw || 'null');
      if (o) {
        if (Number.isFinite(+o.best)) out.best = Math.max(out.best, Math.floor(+o.best));
        if (o.tut) out.tut = 1;
        if (o.mute) out.mute = 1;
        // game snapshot chỉ lấy từ localStorage (native không giữ phần này)
        if (!fromNative && o.game && Array.isArray(o.game.tower)) out.game = o.game;
      }
    } catch (e) { /* data bẩn → bỏ qua */ }
  };
  pick(getInitialData(), true);
  pick(readLocal(), false);
  return out;
}

/* ============================================================
 * §1b. Âm thanh — WebAudio synth toàn bộ, không file ngoài.
 *      Thiết kế "ấm & mềm": mọi giọng đi qua lowpass riêng rồi
 *      lowpass master trước khi ra loa → không bao giờ gắt/chói.
 *      Mở khoá ở cử chỉ đầu tiên (autoplay policy); nút loa tắt/bật,
 *      trạng thái lưu cùng save_data ({mute}).
 * ============================================================ */
let audioCtx = null, audioMaster = null, bgmOut = null;
let bgmTimer = null, bgmNextT = 0, bgmStep = 0;
let muted = false;

/* nội bộ block này */
let sfxBus = null, masterLP = null, masterHP = null, noiseBuf = null;
const VOL = 0.72;                // âm lượng master (đã hạ cho êm hơn)

/* Dựng đồ thị: voice → (sfxBus|bgmOut) → masterLP → masterHP
   → audioMaster(VOL) → compressor → destination. */
function audioEnsure() {
  if (audioCtx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 24;
    comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.18;

    audioMaster = audioCtx.createGain();
    audioMaster.gain.value = muted ? 0 : VOL;
    audioMaster.connect(comp);
    comp.connect(audioCtx.destination);

    masterLP = audioCtx.createBiquadFilter();
    masterLP.type = 'lowpass'; masterLP.frequency.value = 2800; masterLP.Q.value = 0.5;

    masterHP = audioCtx.createBiquadFilter();
    masterHP.type = 'highpass'; masterHP.frequency.value = 100; masterHP.Q.value = 0.4;

    masterLP.connect(masterHP);
    masterHP.connect(audioMaster);

    sfxBus = audioCtx.createGain();
    sfxBus.gain.value = 1.0;
    sfxBus.connect(masterLP);

    bgmOut = audioCtx.createGain();
    bgmOut.gain.value = 0.1;                 // BGM luôn nằm dưới SFX
    bgmOut.connect(masterLP);

    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    startBgm();
    return true;
  } catch (e) { return false; }
}

function audioUnlock() {
  if (!audioEnsure()) return;
  if (audioCtx.state === 'suspended') { audioCtx.resume().catch(function () {}); }
}

function setMuted(v) {
  muted = v;
  if (audioMaster) audioMaster.gain.value = muted ? 0 : VOL;
  $('mute-btn').classList.toggle('muted', muted);
  persistSaved();
}

/* voice() — 1 giọng có bao êm (attack ≥ 8ms, tắt mượt bằng setTargetAtTime).
   Ấm nhờ detune + hài âm 2 (body) + quãng tám dưới (sub). Mỗi giọng có
   lowpass riêng nên luôn tròn tiếng. */
function voice(o) {
  if (!audioCtx) return;
  o = o || {};
  const t = audioCtx.currentTime + (o.at || 0);
  const type = o.type || 'sine';
  const f0 = o.freq || 440;
  const dur = o.dur || 0.18;
  const peak = (o.peak == null ? 0.07 : o.peak);
  const atk = Math.max(0.008, o.attack || 0.012);
  const rel = Math.max(0.06, o.release || 0.11);
  const bus = o.bus || sfxBus;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + atk);
  const relStart = Math.max(t + atk + 0.005, t + dur);
  g.gain.setTargetAtTime(0.0001, relStart, rel / 3);
  const stop = relStart + rel * 4 + 0.05;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = o.lp || 1500;
  lp.Q.value = (o.q == null ? 0.7 : o.q);
  g.connect(lp); lp.connect(bus);

  let lfo = null, lg = null;
  if (o.vib) {
    lfo = audioCtx.createOscillator(); lfo.type = 'sine';
    lfo.frequency.value = o.vib.rate || 6;
    lg = audioCtx.createGain(); lg.gain.value = o.vib.depth || 8;
    lfo.connect(lg); lfo.start(t); lfo.stop(stop);
  }

  function mkOsc(freq, detune, gscale, tp) {
    const node = audioCtx.createOscillator();
    node.type = tp || type;
    node.frequency.setValueAtTime(freq, t);
    if (o.slide) {
      node.frequency.exponentialRampToValueAtTime(
        Math.max(20, o.slide * (freq / f0)), t + dur);
    }
    if (detune) node.detune.value = detune;
    if (lg) lg.connect(node.detune);
    if (gscale != null && gscale !== 1) {
      const ng = audioCtx.createGain(); ng.gain.value = gscale;
      node.connect(ng); ng.connect(g);
    } else {
      node.connect(g);
    }
    node.start(t); node.stop(stop);
  }

  mkOsc(f0, -(o.detune || 0));
  if (o.detune) mkOsc(f0, o.detune);
  if (o.body) mkOsc(f0 * 2, 0, o.body, 'sine');
  if (o.sub)  mkOsc(f0 / 2, 0, 0.5, 'sine');
}

/* noiseVoice() — noise trắng LỌC THẤP mạnh (thud/tap/poof), không bao giờ
   bandpass rít. Ngắn & nhỏ. */
function noiseVoice(o) {
  if (!audioCtx || !noiseBuf) return;
  o = o || {};
  const t = audioCtx.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const peak = (o.peak == null ? 0.05 : o.peak);
  const rel = Math.max(0.05, o.release || 0.12);

  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = o.lp || 500; lp.Q.value = o.q || 0.5;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + Math.max(0.008, o.attack || 0.01));
  const relStart = Math.max(t + 0.02, t + dur);
  g.gain.setTargetAtTime(0.0001, relStart, rel / 3);

  src.connect(lp); lp.connect(g); g.connect(o.bus || sfxBus);
  src.start(t); src.stop(relStart + rel * 4 + 0.05);
}

/* ---- BGM: "Toy-Chip March" — polka đồ chơi vui nhộn, ẤM & MỀM (C trưởng, ~128 BPM).
   Bass oom-pah + giai điệu music-box hỏi/đáp; 3 biến tấu giai điệu xoay vòng (chu kỳ
   thật ~24 nhịp ≈ 45s) để không nhàm. Mọi nốt qua bgmOut (đã lọc), peak nhỏ, ≤ D5. ---- */
const NT = {
  F2: 87.31, G2: 98.00, A2: 110.00,
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33
};
const STEP_DUR      = 0.2344;    // móc đơn @ ~128 BPM
const SWING         = 0.028;     // trễ nhẹ phách lẻ → nảy/springy
const STEPS_PER_BAR = 8;
const BARS          = 8;         // 1 vòng = 8 nhịp (A: hỏi, B: đáp)
const TOTAL_STEPS   = STEPS_PER_BAR * BARS;
let   bgmVariant    = 0;         // 0/1/2 → MEL_A/B/C, xoay mỗi vòng

/* Hợp âm 8 nhịp: C Am F G | C F G C. root/fifth = oom-pah; pah = 3 nốt đệm ngắn. */
const PROG = [
  { root: 'C3', fifth: 'G3', pah: ['C4', 'E4', 'G4'] },
  { root: 'A2', fifth: 'E3', pah: ['A3', 'C4', 'E4'] },
  { root: 'F2', fifth: 'C3', pah: ['F3', 'A3', 'C4'] },
  { root: 'G2', fifth: 'D3', pah: ['G3', 'B3', 'D4'] },
  { root: 'C3', fifth: 'G3', pah: ['C4', 'E4', 'G4'] },
  { root: 'F2', fifth: 'C3', pah: ['F3', 'A3', 'C4'] },
  { root: 'G2', fifth: 'D3', pah: ['G3', 'B3', 'D4'] },
  { root: 'C3', fifth: 'G3', pah: ['C4', 'E4', 'G4'] }
];
/* null = LẶNG (chừa khoảng thở). Đỉnh cao nhất D5 → không chói. */
const MEL_A = [
  ['E4', 'G4', 'C5', null, 'G4', null, 'E4', null],
  ['D4', 'F4', 'A4', null, 'F4', null, 'D4', null],
  ['C4', 'F4', 'A4', null, 'C5', null, 'A4', 'G4'],
  ['G4', null, 'D4', null, 'G4', null, null, null],
  ['G4', 'A4', 'B4', 'C5', null, 'B4', 'G4', null],
  ['A4', null, 'F4', 'A4', 'C5', null, 'A4', null],
  ['B4', null, 'G4', 'B4', 'D5', null, 'B4', 'A4'],
  ['C5', null, 'G4', null, 'E4', null, 'C4', null]
];
const MEL_B = [
  ['G4', 'E4', 'G4', 'C5', null, 'E4', 'G4', null],
  ['A4', 'E4', 'A4', null, 'C5', null, 'E4', null],
  ['A4', 'C5', 'A4', 'F4', null, 'A4', 'G4', null],
  ['B4', null, 'G4', 'D4', null, 'G4', null, null],
  ['C5', 'B4', 'G4', 'E4', 'G4', null, 'C5', null],
  ['C5', null, 'A4', 'F4', 'A4', null, 'C5', null],
  ['D5', null, 'B4', 'G4', 'B4', null, 'D5', 'B4'],
  ['C5', 'G4', 'E4', null, 'C4', null, null, null]
];
const MEL_C = [
  ['C5', 'G4', 'E4', 'G4', null, 'C5', null, 'G4'],
  ['C5', 'A4', 'E4', null, 'A4', null, 'C5', null],
  ['A4', 'F4', 'C5', null, 'A4', 'F4', null, 'G4'],
  ['D4', 'G4', 'B4', null, 'D5', null, 'B4', null],
  ['E4', 'G4', 'C5', 'E4', 'G4', null, 'C5', null],
  ['F4', 'A4', 'C5', null, 'A4', null, 'F4', null],
  ['G4', 'B4', 'D5', null, 'B4', 'G4', 'D4', null],
  ['E4', 'G4', 'C5', null, 'G4', null, 'C4', null]
];
const MELS = [MEL_A, MEL_B, MEL_C];

/* nốt giai điệu: MARIMBA/MUSIC-BOX ấm — sine tròn + hài âm quãng tám nhẹ (body),
   gảy mềm rồi ngân dịu; dễ nghe hơn hẳn tiếng triangle "chip" cũ. */
function chip(name, at, dur, peak) {
  const f = NT[name]; if (f == null) return;
  voice({ freq: f, type: 'sine', dur: dur * 0.7, peak: peak,
    attack: .008, release: .2, lp: 2200, q: .5, body: .3, detune: 2, at: at, bus: bgmOut });
}
/* bass oom: sine tròn trầm ngắn (không sub — dưới ~100Hz bị masterHP cắt). */
function oom(name, at, peak) {
  const f = NT[name]; if (f == null) return;
  voice({ freq: f, type: 'sine', dur: .17, peak: peak,
    attack: .010, release: .17, lp: 380, q: .5, at: at, bus: bgmOut });
}
/* "pah": chùm 3 nốt đệm ngắn êm (sine tròn) — cú nảy đặc trưng polka. */
function pah(names, at, peak) {
  for (let i = 0; i < names.length; i++) {
    const f = NT[names[i]]; if (f == null) continue;
    voice({ freq: f, type: 'sine', dur: .1, peak: peak,
      attack: .012, release: .12, lp: 1200, q: .5, body: .12, detune: 3, at: at, bus: bgmOut });
  }
}
/* tick trầm MỜ cực nhỏ ở phách mạnh — cảm giác bước chân, không hi-hat chói. */
function bgmTick(at) {
  noiseVoice({ lp: 800, dur: .05, peak: .010, attack: .008, release: .06, at: at, bus: bgmOut });
}

/* Lên lịch 1 móc đơn. at = độ trễ (giây) từ audioCtx.currentTime. */
function scheduleStep(step, at) {
  const bar = Math.floor(step / STEPS_PER_BAR) % BARS;
  const slot = step % STEPS_PER_BAR;
  const chord = PROG[bar];
  const mel = MELS[bgmVariant][bar];
  const swung = (slot % 2 === 1) ? SWING : 0;

  if (slot === 0)                    oom(chord.root,  at, .070);
  else if (slot === 4)               oom(chord.fifth, at, .060);
  else if (slot === 2 || slot === 6) pah(chord.pah,   at, .026);
  if (slot === 0 || slot === 4) bgmTick(at);

  const note = mel[slot];
  if (note) chip(note, at + swung, STEP_DUR * 1.1, .055);
}

function startBgm() {
  if (bgmTimer || !audioCtx) return;
  bgmNextT = audioCtx.currentTime + 0.15;
  bgmStep = 0;
  bgmVariant = 0;
  bgmTimer = setInterval(function () {
    if (!audioCtx || audioCtx.state !== 'running' || muted) return;
    const now = audioCtx.currentTime;
    if (bgmNextT < now - 0.5) bgmNextT = now + 0.05;   // bù trễ sau resume, không dồn
    const horizon = now + 0.9;
    while (bgmNextT < horizon) {
      scheduleStep(bgmStep, bgmNextT - now);
      bgmStep++;
      if (bgmStep >= TOTAL_STEPS) { bgmStep = 0; bgmVariant = (bgmVariant + 1) % MELS.length; }
      bgmNextT += STEP_DUR;
    }
  }, 200);
}

/* ============================================================
 * SFX — mềm, ngắn, tròn. Đỉnh nhỏ để chồng nhau vẫn êm.
 * ============================================================ */

// Nút UI: blip sine rất dịu.
function sButton() {
  voice({ freq: 520, type: 'sine', dur: .08, peak: .04, lp: 1500, release: .09, body: .15 });
}

/* NHẢY & ĐÁP dùng CHUNG một tiếng "pop/tap" tự nhiên, mềm (ý người dùng: 1 sound).
   Sine trượt xuống nhanh + một chạm noise lọc thấp rất khẽ = tiếng chạm thật mà êm. */
function sPop() {
  voice({ freq: 336, slide: 178, type: 'sine', dur: .1, peak: .05, lp: 1050, attack: .009, release: .1, body: .12, sub: true });
  noiseVoice({ lp: 620, dur: .028, peak: .013, attack: .008, release: .05 });
}
function sJump() { sPop(); }
function sLand() { sPop(); }

// Nhảy lò xo: nảy hơn, cao hơn, dài hơn + vibrato → khác rõ tiếng pop thường.
function sBoing() {

const GOLD_SPEED = 1.25;      // ×1.25 ở tầng thấp — vẫn thử phản xạ

const GOLD_TAPER_FROM = 15;   // bắt đầu hạ đúng quãng QA thấy nhanh quá
const GOLD_TAPER_TO = 30;
function goldMul(level) {
  if (level <= GOLD_TAPER_FROM) return GOLD_SPEED;
  if (level >= GOLD_TAPER_TO) return GOLD_SPEED_HI;
  const q = (level - GOLD_TAPER_FROM) / (GOLD_TAPER_TO - GOLD_TAPER_FROM);
  return GOLD_SPEED + (GOLD_SPEED_HI - GOLD_SPEED) * q;
}

/* ================================================================
 * §4. Canvas & camera

let pxk = 1;                 // px thiết bị trên 1 đơn vị logic (= dpr * scale)

/* ── Dò trần DPR trong MÀN LOADING (§4a) ───────────────────────────
   Chi phí một khung tỉ lệ thẳng với số pixel canvas, nên trần DPR là đòn bẩy
   mạnh nhất: 2 → 1.75 cắt 23% số pixel, 2 → 1.5 cắt 44%.
   SÀN 1.5 — dưới nữa thì chữ và viền phô mai mờ thấy rõ, thà chịu rớt khung.

   BẢN CŨ DÒ NGAY TRONG VÁN và đó là một sai lầm: mỗi lần hạ trần phải gán lại
   canvas.width, tức cấp phát lại backing store + XOÁ TRẮNG canvas. Việc đó lại
   xảy ra ở CUỐI loop(), tức sau render() — nên khung đó được compose đúng lúc
   canvas vừa bị xoá → người chơi thấy CHỚP ĐEN giữa ván (~10 điểm, rồi 11 điểm
   thêm cái nữa ứng với 2 nấc hạ).
   Nay dồn hết vào màn loading: đo xong mới dựng thế giới thật và chạy vòng lặp.
   Trong ván KHÔNG BAO GIỜ đổi độ phân giải nữa. */
const DPR_STEPS = [2, 1.75, 1.5];
let dprStep = 0, dprCap = DPR_STEPS[0];

const CAL_WARM = 6;        // khung bỏ đi sau mỗi lần đổi độ phân giải (cấp phát lại + khung đầu)
const CAL_SAMPLE = 22;     // khung đo thật mỗi nấc
const CAL_BUDGET = 18;     // ms: trung vị dưới mức này coi như giữ được 60fps

/* Đo bằng khoảng cách giữa các rAF chứ không phải performance.now() quanh
   render(): lệnh canvas 2D được XẾP HÀNG, đo quanh render() chỉ ra thời gian
   nạp lệnh chứ không ra thời gian tô thật. Nhịp rAF mới là cái người chơi thấy. */
function calibrate(done) {
  const fill = $('load-fill');
  let deltas = [], warm = CAL_WARM, last = 0;

  apply(0);
  requestAnimationFrame(tick);

  function apply(i) {
    dprStep = i;
    dprCap = DPR_STEPS[i];
    resize();
    deltas = []; warm = CAL_WARM; last = 0;
    if (fill) fill.style.width = Math.round((i / DPR_STEPS.length) * 100) + '%';
  }

  function tick(ts) {
    render();                              // cảnh mẫu — màn loading che nên không ai thấy
    if (last) {
      if (warm > 0) warm--;
      else deltas.push(ts - last);
    }
    last = ts;

    if (deltas.length < CAL_SAMPLE) { requestAnimationFrame(tick); return; }

    /* trung vị, không phải trung bình: một khung GC lẻ loi không được quyền
       đẩy cả máy xuống một nấc mờ hơn */
    deltas.sort(function (a, b) { return a - b; });
    const med = deltas[deltas.length >> 1];

    if (med <= CAL_BUDGET || dprStep >= DPR_STEPS.length - 1) {
      if (fill) fill.style.width = '100%';
      done();
      return;
    }
    apply(dprStep + 1);                    // chưa đạt → hạ một nấc rồi đo lại
    requestAnimationFrame(tick);
  }
}

function resize() {
  /* Trần DPR động (§4a): máy DPR 3 phải tô ×2.25 lần pixel mỗi khung → rớt khung
     "giật giật" trên WebView; 2x vẫn nét trên điện thoại, yếu hơn thì tự hạ tiếp */
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  const app = $('app');
  const w = app.clientWidth, h = app.clientHeight;
  /* Android WebView bắn 'resize' liên tục khi thanh URL trượt / bàn phím mở.
     Gán canvas.width tức là cấp phát lại backing store + xoá màn → khựng thấy rõ.
     Kích thước không đổi thì bỏ qua hoàn toàn. */
  if (w === cssW && h === cssH && pxk === dpr * (w / LW)) return;
  cssW = w;
  cssH = h;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  scale = cssW / LW;
  LH = cssH / scale;
  pxk = dpr * scale;
  ctx.setTransform(pxk, 0, 0, pxk, 0, 0);
  /* bgStatic phụ thuộc LW/LH/pxk — invalidateSprites() xoá, dựng lại lúc vẽ đầu
     tiên (phải hoãn: wallPattern chỉ có sau khi boot chạy xong) */
  invalidateSprites();         // mọi bitmap cache vẽ theo pxk → dựng lại
  layoutHud();
  /* Vẽ lại NGAY trong cùng lượt: gán canvas.width vừa XOÁ TRẮNG backing store.
     Đợi tới rAF kế tiếp thì khung hiện tại bị compose lúc canvas còn trắng →
     chớp đen. Đây chính là cái người chơi thấy khi xoay máy / thanh URL trượt. */
  if (ctx && tower.length) render();
}

/* ── Sprite cache (§4b) ────────────────────────────────────────────
   Nguyên tắc: hình nào KHÔNG đổi theo thời gian thì rasterize MỘT LẦN ra
   canvas phụ rồi drawImage, thay vì tô lại vài chục path vector mỗi khung.
   Mọi cache đều dựng theo pxk nên phải xoá khi resize. */
function mkSprite(wL, hL) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(wL * pxk));
  c.height = Math.max(1, Math.ceil(hL * pxk));
  const g = c.getContext('2d');
  g.setTransform(pxk, 0, 0, pxk, 0, 0);
  /* dw/dh = kích thước LOGIC thật của bitmap (đã làm tròn lên) — dùng làm đích
     drawImage để không bị co/giãn lệch nửa pixel */
  return { c, g, wL, hL, dw: c.width / pxk, dh: c.height / pxk };
}
/* Vẽ bằng ctx thật nhưng xuất ra sprite: tạm hoán đổi ctx toàn cục để tái dùng
   nguyên các hàm vẽ sẵn có (rr/frontFacePath/drawDecor…) không phải viết lại. */
function intoSprite(sp, ox, oy, fn) {
  const prev = ctx;
  ctx = sp.g;
  ctx.save();
  ctx.translate(ox, oy);
  fn();
  ctx.restore();
  ctx = prev;
}
const blockSprites = new Map();   // "kind|seed|w" → sprite tĩnh của 1 miếng phô mai
let decorSprites = null;          // [tranh, kệ, cửa sổ] — 3 loại đồ treo tĩnh
let tableSprite = null;           // thảm + đĩa + bóng (hoàn toàn tĩnh)
let bgStatic = null;              // gradient + vignette tô sẵn — 1 blit ĐỤC thay 3 lượt tô
function invalidateSprites() {
  blockSprites.clear();
  decorSprites = null;
  tableSprite = null;
  bgStatic = null;
}

/* ĐO ĐƯỢC (đếm diện tích tô mỗi khung): nền ngốn 2,40 màn/khung trong tổng 2,69
   — tức 90% công tô pixel, còn CẢ tháp phô mai + hamster chỉ 0,12 màn. Chi tiết:
   gradient 1,00 màn + giấy dán tường 1,00 màn + vignette 0,38 màn.
   Gradient và vignette đều ĐỨNG YÊN theo màn hình (không parallax) nên nướng
   sẵn được thành một bitmap ĐỤC: 1 lần blit đục thay cho 1 lượt shader gradient
   + 2 dải alpha blend. Trên WebView không tăng tốc GPU, blit đục rẻ hơn hẳn tô
   gradient/alpha trên mỗi pixel — mà đây lại đúng loại máy đang giật. */
function buildBgStatic() {
  bgStatic = mkSprite(LW, LH);
  const g = bgStatic.g;
  const grad = g.createLinearGradient(0, 0, 0, LH);
  grad.addColorStop(0, C.bgTop);
  grad.addColorStop(0.55, C.bgMid);
  grad.addColorStop(1, C.bgBot);
  g.fillStyle = grad;
  g.fillRect(0, 0, LW, LH);
  /* Giấy dán tường nướng luôn vào đây: nền tụt còn ĐÚNG 1 blit đục (2,40 → 1,00
     màn/khung, cắt 51% công tô pixel toàn khung). Đổi lại hoa văn tường thôi
     trôi theo camera — nhưng đồ treo (tranh/kệ/cửa sổ/đèn/cây) vẫn parallax
     0.4 nên chiều sâu vẫn đọc ra, và hoa văn lặp đều thì đứng hay trôi rất khó
     phân biệt. Đây là đường tô-bằng-shader CUỐI CÙNG còn kín màn. */
  if (wallPattern) {
    g.fillStyle = wallPattern;
    g.fillRect(0, 0, LW, LH);
  }
  const vg = g.createLinearGradient(0, 0, LW, 0);
  vg.addColorStop(0, 'rgba(28,52,82,.15)');
  vg.addColorStop(0.18, 'rgba(28,52,82,0)');
  vg.addColorStop(0.82, 'rgba(28,52,82,0)');
  vg.addColorStop(1, 'rgba(28,52,82,.15)');
  g.fillStyle = vg;
  const vw = LW * 0.19;                 // 64% giữa trong suốt → chỉ tô 2 dải mép
  g.fillRect(0, 0, vw, LH);
  g.fillRect(LW - vw, 0, vw, LH);
}


function safeTop() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sat');
  return parseFloat(v) || 0;
}
/* Bố cục header — CƠ CHẾ copy từ index(exampleforheader).html: Back/Volume neo 2
   mép, 2 pill SCORE+BEST BẰNG NHAU căn giữa, top căn theo chiều cao pill. */
function layoutHud() {
  const hudScores = $('hud-scores'), hudBack = $('back-btn'), hudMute = $('mute-btn');
  if (!hudScores || !hudBack || !hudMute) return;
  const rectW = $('app').clientWidth;
  const topInset = Math.max(getStatusBarHeight(), safeTop()) + 8;
  hudScores.style.top = topInset + 'px';
  const pillH = Math.round(hudScores.getBoundingClientRect().height);
  const btnSize = Math.round(pillH * 0.92);
  [hudBack, hudMute].forEach(function (b) {
    b.style.setProperty('--surface-height', btnSize + 'px');
    b.style.setProperty('--surface-width', btnSize + 'px');
  });
  const wrapH = hudBack.getBoundingClientRect().height || btnSize;
  const btnTop = topInset + Math.round((pillH - wrapH) / 2);
  hudBack.style.top = btnTop + 'px';
  hudMute.style.top = btnTop + 'px';
  const btnW = hudBack.getBoundingClientRect().width || btnSize;
  hudScores.style.width = Math.round(rectW - 2 * (12 + btnW + 18)) + 'px';
  const belowTop = topInset + pillH + 6;
  const sk = $('streak');
  if (sk) sk.style.top = belowTop + 'px';
}

function surfaceY() { return -tower.length * BLOCK_H; }   // mặt trên tháp (world)
function topCx() { return tower[tower.length - 1].cx; }
/* ĐỘ CAO TIÊU ĐIỂM của camera — BẮT BUỘC LIÊN TỤC.
   Cũ: mục tiêu = mặt tháp, mà `tower.length` +1 NGAY khoảnh khắc ghim miếng
   → mục tiêu nhảy nguyên 1 tầng (92px) trong đúng 1 frame. Camera ease
   12%/frame nên hamster bị đẩy ~11px chỉ trong frame đó rồi mới trôi về.
   VỊ TRÍ vẫn liền (C0) nhưng VẬN TỐC đứt (C1): đang rơi ~4px/frame bỗng
   thành 15px/frame — mắt đọc ra thành một cú "khựng", và LẦN ĐÁP NÀO CŨNG CÓ.
   Đo được: mọi bước jump->idle đều đúng 15.1px/frame, lớn nhất cả ván.
   Nay khi hamster đang bay, tiêu điểm ĐI TRƯỚC theo độ cao của nó nhưng KẸP
   tối đa 1 tầng. Frame cuối trước khi ghim h vẫn > BLOCK_H nên kẹp = BLOCK_H;
   ghim xong mặt tháp cao thêm đúng BLOCK_H → hai bên BẰNG NHAU, hết bước nhảy.
   Bonus: camera dâng mượt theo cú nhảy, đáp xuống không phải bù thêm gì. */
function camFocusY() {
  let f = surfaceY();
  if (ham && ham.state === 'jump') {
    const p = Math.min(1, (timeMs - ham.t0) / (ham.jumpDur || JUMP_DUR));
    const h = (ham.jumpH || JUMP_H) * Math.sin(p * Math.PI);
    f -= Math.min(BLOCK_H, h);
  }
  return f;
}
function camTargetOff() { return LH * 0.62 - camFocusY(); }
/* Trục NGANG cũng đứt y hệt trục dọc: mục tiêu cũ là topCx() — tâm miếng trên
   cùng — mà lúc ghim, "miếng trên cùng" đổi sang miếng vừa đáp, lệch tới ±w/2
   so với miếng cũ → mục tiêu nhảy một phát (đo được 7.5px/frame rồi tắt dần,
   càng đáp lệch càng nặng — đúng kiểu người chơi thật). Bám theo HAMSTER thì
   liên tục tuyệt đối: lúc ghim ham.x không hề đổi. Khung hình gần như y cũ vì
   hamster luôn đứng trên miếng trên cùng (lệch tối đa nửa miếng). */
function camTargetX() { return (ham ? ham.x : topCx()) - LW / 2; }
function sx(wx) { return wx - camX; }                      // world → screen X
function sy(wy) { return wy + camOff; }                    // world → screen Y
/* Nửa chiều cao khung nhìn (toạ độ TRƯỚC zoom) + lề an toàn.
   CŨ trả về nguyên LH/zoom = gấp ĐÔI mức cần thiết: mọi phép cull dùng
   `LH/2 ± cullPad()` nên vùng vẽ rộng 3 màn hình → tô thừa ~2× số miếng
   phô mai, mỗi miếng vài chục path. Đúng ra chỉ cần nửa khung. */
function cullPad() { return LH * 0.5 / Math.max(viewZoom, 0.05) + 48; }

/* ================================================================
 * §5. Helpers vẽ
 * ================================================================ */
function seededRand(seed) {
  let u = seed + 0x6D2B79F5;
  u = Math.imul(u ^ (u >>> 15), u | 1);
  u ^= u + Math.imul(u ^ (u >>> 7), u | 61);
  return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
}

function rr(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

/* Mặt trước của khối 3D: góc TRÊN sắc (để nối liền với cạnh mặt trên),
   góc dưới bo tròn */
function frontFacePath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.closePath();
}

/* ================================================================
 * §6. Vẽ — bếp, bàn, phô mai, hamster, hiệu ứng
 * ================================================================ */

/* ── Nền: tường bếp có chiều sâu — giấy dán tường + đồ treo + bụi sáng ── */
const DECOR = {
  line: 'rgba(40,72,104,.45)',
  wood: '#b08356',
  woodDark: '#8f6740',
  paper: '#f3e9d2',
};

let wallPattern = null;
/* Giấy dán tường dựng 1 LẦN thành pattern (sọc dọc + motif phô mai lặp đều) */
function makeWallPattern() {
  const c = document.createElement('canvas');
  c.width = 120;
  c.height = 120;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(30,65,100,.08)';
  g.lineWidth = 8;
  g.beginPath(); g.moveTo(4, 0); g.lineTo(4, 120); g.stroke();
  g.fillStyle = 'rgba(30,65,100,.11)';
  for (const m of [[38, 34], [98, 94]]) {
    g.save();
    g.translate(m[0], m[1]);
    g.beginPath();
    g.moveTo(-11, 7); g.lineTo(11, 7); g.lineTo(11, -1);
    g.quadraticCurveTo(0, -9, -11, 7);
    g.closePath(); g.fill();
    g.restore();
  }
  return g.createPattern(c, 'repeat');
}

/* Tranh treo tường (vẽ phô mai) */
function drawDecorFrame(x, y) {
  ctx.strokeStyle = DECOR.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y); ctx.lineTo(x + 48, y - 16); ctx.lineTo(x + 88, y);
  ctx.stroke();
  ctx.fillStyle = DECOR.wood;
  rr(x, y, 96, 76, 6); ctx.fill();
  ctx.strokeStyle = DECOR.woodDark; ctx.stroke();
  ctx.fillStyle = DECOR.paper;
  rr(x + 8, y + 8, 80, 60, 3); ctx.fill();
  ctx.fillStyle = '#e8cf6e';
  ctx.beginPath();
  ctx.moveTo(x + 24, y + 52); ctx.lineTo(x + 72, y + 52); ctx.lineTo(x + 72, y + 34);
  ctx.quadraticCurveTo(x + 48, y + 18, x + 24, y + 52);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(190,160,70,.8)';
  ctx.beginPath(); ctx.arc(x + 52, y + 42, 3.4, 0, Math.PI * 2); ctx.fill();
}

/* Kệ gỗ + lọ gia vị + miếng phô mai */
function drawDecorShelf(x, y) {
  ctx.fillStyle = 'rgba(210,230,240,.55)';
  rr(x + 14, y - 34, 24, 34, 5); ctx.fill();
  ctx.fillStyle = 'rgba(226,180,120,.7)';
  rr(x + 50, y - 26, 28, 26, 6); ctx.fill();
  ctx.fillStyle = DECOR.woodDark;
  rr(x + 14, y - 40, 24, 8, 3); ctx.fill();
  rr(x + 52, y - 31, 24, 7, 3); ctx.fill();
  ctx.fillStyle = '#e8cf6e';
  ctx.beginPath();
  ctx.moveTo(x + 96, y); ctx.lineTo(x + 134, y); ctx.lineTo(x + 134, y - 14);
  ctx.quadraticCurveTo(x + 115, y - 28, x + 96, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = DECOR.wood;
  rr(x, y, 150, 10, 3); ctx.fill();
  ctx.strokeStyle = DECOR.woodDark;
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* Cửa sổ sáng nhìn ra trời + quầng nắng hắt xuống */
function drawDecorWindow(x, y) {
  ctx.fillStyle = 'rgba(255,250,220,.10)';
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 96);
  ctx.lineTo(x - 26, y + 190);
  ctx.lineTo(x + 158, y + 190);
  ctx.lineTo(x + 124, y + 96);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = DECOR.wood;
  rr(x, y, 132, 104, 8); ctx.fill();
  ctx.fillStyle = '#c8e9f6';
  rr(x + 8, y + 8, 116, 88, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.ellipse(x + 44, y + 40, 20, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 62, y + 34, 14, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = DECOR.wood;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + 66, y + 8); ctx.lineTo(x + 66, y + 96);
  ctx.moveTo(x + 8, y + 52); ctx.lineTo(x + 124, y + 52);
  ctx.stroke();
}

/* Dây đèn màu nhấp nháy vắt ngang tường */
function drawDecorLights(y, seed) {
  ctx.strokeStyle = DECOR.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, y);
  ctx.quadraticCurveTo(LW / 2, y + 46, LW + 10, y);
  ctx.stroke();
  const cols = ['#ffd23f', '#ff8fb2', '#8fd3ff', '#b8e986'];
  for (let k = 0; k <= 8; k++) {
    const tt = k / 8;
    const bx2 = -10 + tt * (LW + 20);
    const by2 = y + 92 * tt * (1 - tt) + 5;
    const tw = 0.5 + 0.5 * Math.sin(timeMs * 0.004 + k * 1.9 + seed);
    ctx.globalAlpha = 0.45 + 0.5 * tw;
    ctx.fillStyle = cols[k % 4];
    ctx.beginPath();
    ctx.arc(bx2, by2, 4.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* Chậu cây treo — lá đung đưa nhẹ */
function drawDecorPlant(x, y, seed) {
  ctx.strokeStyle = DECOR.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x - 20, y + 26);
  ctx.moveTo(x, y); ctx.lineTo(x + 20, y + 26);
  ctx.stroke();
  const sway = Math.sin(timeMs * 0.0012 + seed) * 0.1;
  ctx.fillStyle = 'rgba(96,150,96,.9)';
  for (let k = 0; k < 5; k++) {
    ctx.save();
    ctx.translate(x, y + 34);
    ctx.rotate(-0.9 + k * 0.45 + sway);
    ctx.beginPath();
    ctx.ellipse(0, 26, 7, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#c9764a';
  rr(x - 26, y + 26, 52, 26, 7); ctx.fill();
  ctx.strokeStyle = DECOR.woodDark;
  ctx.stroke();
}

/* 3 loại đồ treo TĨNH (tranh / kệ / cửa sổ) rasterize 1 lần. Đèn dây & chậu cây
   có animation (nhấp nháy, lá đung đưa) nên vẫn vẽ vector trực tiếp. */
const DECOR_BOX = [
  { w: 100, h: 100, ox: 2, oy: 20 },     // tranh: dây treo nhô lên 16px
  { w: 156, h: 80, ox: 2, oy: 44 },      // kệ: lọ/phô mai cao hơn mặt kệ
  { w: 190, h: 200, ox: 30, oy: 2 },     // cửa sổ: quầng nắng loe rộng xuống dưới
];
function buildDecorSprites() {
  decorSprites = DECOR_BOX.map(function (b, k) {
    const sp = mkSprite(b.w, b.h);
    intoSprite(sp, b.ox, b.oy, function () {
      if (k === 0) drawDecorFrame(0, 0);
      else if (k === 1) drawDecorShelf(0, 0);
      else drawDecorWindow(0, 0);
    });
    return sp;
  });
}

function drawBackground() {
  if (!decorSprites) buildDecorSprites();
  if (!bgStatic) buildBgStatic();

  /* nền tường + vignette: 1 blit ĐỤC (xem buildBgStatic) thay cho 1 lượt tô
     gradient kín màn + 2 dải alpha. Đục nên rasterizer khỏi trộn alpha. */
  ctx.drawImage(bgStatic.c, 0, 0, bgStatic.dw, bgStatic.dh);

  /* giấy dán tường đã nướng sẵn trong bgStatic — không còn lượt pattern fill nào */

  /* đồ treo tường theo dải (parallax 0.4): tranh / kệ / cửa sổ / đèn dây / cây */
  const par = 0.4, bandH = 330;
  const yTop = -camOff;
  const first = Math.floor((yTop - bandH) / bandH);
  const last = Math.ceil((yTop + LH / par) / bandH);
  for (let i = first; i <= last; i++) {
    const by = i * bandH * par + camOff * par;
    if (by > LH + 220 || by < -260) continue;      // dải ngoài khung → bỏ hẳn
    /* xoay vòng 5 loại + jitter nhẹ — không bao giờ lặp 3 lần cùng loại */
    const kind = (((i % 5) + 5) + Math.floor(seededRand(i * 137 + 11) * 2)) % 5;
    const bx = 40 + seededRand(i * 71 + 3) * (LW - 240) - camX * 0.15;
    if (kind < 3) {
      const b = DECOR_BOX[kind], sp = decorSprites[kind];
      const dy = kind === 0 ? 60 : (kind === 1 ? 116 : 40);
      ctx.drawImage(sp.c, bx - b.ox, by + dy - b.oy, sp.dw, sp.dh);
    } else if (kind === 3) drawDecorLights(by + 50, i);
    else drawDecorPlant(bx + 60, by + 30, i);
  }

  /* bụi sáng lơ lửng — nền "thở" nhẹ */
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < 8; k++) {
    const sd = seededRand(k * 97 + 5);
    const px = (sd * LW + timeMs * (0.006 + sd * 0.008)) % LW;
    const py = (seededRand(k * 41 + 9) * LH + Math.sin(timeMs * 0.0006 + k) * 40 + LH) % LH;
    ctx.globalAlpha = 0.10 + 0.14 * (0.5 + 0.5 * Math.sin(timeMs * 0.002 + k * 2.1));
    ctx.beginPath();
    ctx.arc(px, py, 2.4 + sd * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* vignette đã nướng sẵn trong bgStatic — không còn tô lại mỗi khung */
}

/* Nĩa hoạt hình — 4 răng, vòm, cán bo tròn có vệt sáng */
function drawForkAt(px2, py2, rot, s) {
  ctx.save();
  ctx.translate(px2, py2);
  ctx.rotate(rot);
  ctx.scale(s || 1, s || 1);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(95,100,115,.5)';
  ctx.fillStyle = '#dfe3ea';
  for (let k = 0; k < 4; k++) {           // 4 răng
    rr(-16.5 + k * 9, -56, 6, 26, 3);
    ctx.fill(); ctx.stroke();
  }
  ctx.beginPath();                         // vòm đầu nĩa thu về cổ
  ctx.moveTo(-17, -34);
  ctx.lineTo(17, -34);
  ctx.quadraticCurveTo(17, -14, 6, -10);
  ctx.lineTo(6, -6);
  ctx.lineTo(-6, -6);
  ctx.lineTo(-6, -10);
  ctx.quadraticCurveTo(-17, -14, -17, -34);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  rr(-5.5, -8, 11, 62, 5.5);               // cán
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  rr(-2, -2, 3, 46, 1.5);                  // vệt sáng
  ctx.fill();
  ctx.restore();
}

/* Dao hoạt hình kiểu dao bếp cổ điển — sống dao thẳng, lưỡi cong về mũi,
   cán gỗ có 2 đinh tán */
function drawKnifeAt(px2, py2, rot, s) {
  ctx.save();
  ctx.translate(px2, py2);
  ctx.rotate(rot);
  ctx.scale(s || 1, s || 1);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(95,100,115,.5)';
  /* lưỡi dao */
  ctx.fillStyle = '#e8ebf1';
  ctx.beginPath();
  ctx.moveTo(-9, -2);                          // gốc lưỡi (cạnh sống)
  ctx.lineTo(-9, -48);                         // sống dao thẳng
  ctx.quadraticCurveTo(-9, -60, 0, -63);       // bo về mũi dao
  ctx.quadraticCurveTo(14, -52, 14, -28);      // cạnh cắt cong
  ctx.quadraticCurveTo(14, -9, 10, -2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* ánh thép dọc sống dao */
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  rr(-6.5, -52, 3, 44, 1.5);
  ctx.fill();
  /* viền cạnh cắt sáng */
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(1, -61);
  ctx.quadraticCurveTo(12, -50, 12, -28);
  ctx.stroke();
  /* gờ chắn (bolster) */
  ctx.fillStyle = '#c9ccd4';
  rr(-8, -3, 17, 7, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(95,100,115,.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  /* cán gỗ + 2 đinh tán */
  ctx.fillStyle = '#b5762e';
  rr(-6.5, 4, 14, 52, 7);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,75,25,.65)';
  ctx.stroke();
  ctx.fillStyle = '#e6c78f';
  ctx.beginPath(); ctx.arc(0.5, 16, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0.5, 42, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  rr(-3.5, 8, 3, 42, 1.5);
  ctx.fill();
  ctx.restore();
}

/* Bàn ăn + tấm lót (rug) + đĩa + dao nĩa. World y = 0 là ĐÁY miếng phô mai
   gốc: tâm đĩa đặt py-2 (đáy phô mai thấp hơn tâm đĩa 2px) + bóng tiếp xúc
   → miếng phô mai ĐẶT hẳn trên đĩa, không lơ lửng */
/* Thảm + đĩa + bóng: hình HOÀN TOÀN TĨNH (không phụ thuộc timeMs) nhưng cũ vẫn
   tô lại mỗi khung — gồm 2 rounded-rect, 1 nét đứt setLineDash (đường rất chậm)
   và tới 32 hình tròn chấm bi. Rasterize 1 lần rồi drawImage. */
const RUG_BOX = { w: 480, h: 240, ox: 240, oy: 100 };   // gốc = tâm đĩa (mx, py)
function buildTableSprite() {
  tableSprite = mkSprite(RUG_BOX.w, RUG_BOX.h);
  intoSprite(tableSprite, RUG_BOX.ox, RUG_BOX.oy, function () {
    ctx.fillStyle = C.mat;
    rr(-235, -97, 470, 190, 26);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)';    // đường chỉ may
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 8]);
    rr(-220, -82, 440, 160, 18);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.matDot;
    for (let row = 0; row < 4; row++) {           // lưới chấm so le đều đặn
      const yD = -68 + row * 44;
      const off = (row % 2) * 27;
      for (let col = 0; col < 8; col++) {
        const xD = -189 + off + col * 54;
        if (Math.abs(xD) < 150 && yD > -50 && yD < 45) continue; // chừa chỗ đĩa
        ctx.beginPath();
        ctx.arc(xD, yD, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    /* đĩa — tâm giữa rug, vành sau ló ra sau miếng phô mai */
    ctx.fillStyle = C.plate;
    ctx.beginPath();
    ctx.ellipse(0, -2, 165, 36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C.plateShade;
    ctx.beginPath();
    ctx.ellipse(0, 2, 128, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    /* bóng tiếp xúc dưới đáy tháp phô mai */
    ctx.fillStyle = 'rgba(120,90,40,.18)';
    ctx.beginPath();
    ctx.ellipse(0, 1, BLOCK_W * 0.56, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawTable() {
  const py = sy(0);
  const bottom = LH / 2 + cullPad();
  if (py - 120 > bottom) return;
  const mx = sx(LW / 2);
  /* mặt bàn — mép sau cao hơn để chứa trọn rug. Chỉ tô phần LỌT KHUNG:
     cũ tô rect rộng LW*3 = thừa 2/3 diện tích (chỉ cần nới theo zoom pan-out). */
  const halfW = LW * 0.5 / Math.max(viewZoom, 0.05);
  ctx.fillStyle = C.table;
  ctx.fillRect(LW / 2 - halfW, py - 110, halfW * 2, Math.max(0, bottom - (py - 110)));
  ctx.fillStyle = C.tableEdge;
  ctx.fillRect(LW / 2 - halfW, py - 110, halfW * 2, 9);

  if (!tableSprite) buildTableSprite();
  ctx.drawImage(tableSprite.c, mx - RUG_BOX.ox, py - RUG_BOX.oy, tableSprite.dw, tableSprite.dh);
}

/* Miếng phô mai (hoặc hộp quà) — vẽ theo world coords */
/* 5 vị trí lỗ cách xa nhau — chọn 3 theo seed nên lỗ KHÔNG bao giờ chồng nhau */
const HOLE_SLOTS = [
  [0.20, 0.30], [0.50, 0.56], [0.80, 0.28], [0.34, 0.76], [0.68, 0.80],
];

/* Phô mai lò xo: 2 LÁT phô mai mỏng kẹp 2 lò xo — sq (0..1) nén lò xo lại */
function drawSpringSandwich(x, y, w, seed, sq, SK, inset) {
  const SLAB = 26;                         // độ dày mỗi lát
  const gap0 = BLOCK_H - SLAB * 2;         // khoảng lò xo khi nghỉ
  const off = sq * gap0 * 0.55;            // nén → lát trên tụt xuống
  const topY = y + off;
  const coilTop = topY + SLAB;
  const coilBot = y + BLOCK_H - SLAB;

  /* LÁT DƯỚI */
  ctx.fillStyle = SK.body;
  frontFacePath(x, y + BLOCK_H - SLAB, w, SLAB, 8);
  ctx.fill();
  ctx.strokeStyle = SK.line;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.fillStyle = SK.hole;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.62, y + BLOCK_H - SLAB / 2, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 2 LÒ XO — chồng vòng ellipse, nén theo sq */
  ctx.strokeStyle = C.spring;
  ctx.lineWidth = 3;
  const loops = 4;
  const step = (coilBot - coilTop) / loops;
  for (const fx of [x + w * 0.28, x + w * 0.72]) {
    for (let k = 0; k < loops; k++) {
      ctx.beginPath();
      ctx.ellipse(fx, coilTop + step * (k + 0.5), 15, Math.max(2.5, step * 0.38), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* LÁT TRÊN + mặt trên (tụt theo độ nén) */
  ctx.fillStyle = SK.top;
  ctx.beginPath();
  ctx.moveTo(x, topY);
  ctx.lineTo(x + w, topY);
  ctx.lineTo(x + w - inset, topY - 22);
  ctx.lineTo(x + inset, topY - 22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = SK.line;
  ctx.stroke();
  ctx.fillStyle = SK.holeTop;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.42, topY - 11, 6, 2.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = SK.body;
  frontFacePath(x, topY, w, SLAB, 6);
  ctx.fill();
  ctx.strokeStyle = SK.line;
  ctx.stroke();
  ctx.fillStyle = SK.hole;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.3, topY + SLAB / 2 + 1, 5.5, 4.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = SK.fold;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 1, topY);
  ctx.lineTo(x + w - 1, topY);
  ctx.stroke();
}

/* Toàn bộ nét vẽ TĨNH của một miếng phô mai (mọi thứ trừ khói mốc bay lượn).
   Gốc (x, y) = góc trên-trái của MẶT TRƯỚC. Dùng chung cho 2 đường: vẽ vector
   trực tiếp và rasterize ra sprite. */
function paintBlockStatic(x, y, kind, seed, w) {
  const SK = BLOCK_SKINS[kind] || BLOCK_SKINS.normal;
  const inset = Math.round(w * 0.1);
  const kw = w / BLOCK_W;               // tỉ lệ co (mini)
  /* MẶT TRÊN — hình thang lùi về sau; góc trước TRÙNG góc trên mặt trước */
  ctx.fillStyle = SK.top;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w - inset, y - 22);
  ctx.lineTo(x + inset, y - 22);
  ctx.closePath();
  ctx.fill();
  /* lỗ trên mặt trên (dẹt theo phối cảnh) */
  ctx.fillStyle = SK.holeTop;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.38, y - 10, 7 * kw, 3.2 * kw, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.68, y - 14, 5 * kw, 2.4 * kw, 0, 0, Math.PI * 2);
  ctx.fill();

  /* MẶT TRƯỚC — góc trên sắc, góc dưới bo */
  ctx.fillStyle = SK.body;
  frontFacePath(x, y, w, BLOCK_H, 8);
  ctx.fill();
  /* lỗ phô mai — 3 lỗ từ 5 slot cố định (không chồng nhau), jitter nhẹ */
  ctx.fillStyle = SK.hole;
  const slot0 = Math.floor(seededRand(seed * 7 + 1) * 5);
  for (let k = 0; k < 3; k++) {
    const s2 = HOLE_SLOTS[(slot0 + k * 2) % 5];
    const hx = x + (s2[0] + (seededRand(seed * 53 + k * 17) - 0.5) * 0.07) * w;
    const hy = y + 16 + (s2[1] + (seededRand(seed * 29 + k * 41) - 0.5) * 0.09) * (BLOCK_H - 26);
    const hr = (5.5 + seededRand(seed * 11 + k * 7) * 3.5) * kw;
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  }

  /* trang trí riêng từng loại */
  if (kind === 'gold') {
    /* ánh kim lấp lánh */
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const g1x = x + w * 0.24, g1y = y + 24, g2x = x + w * 0.74, g2y = y + 60;
    rr(g1x - 7, g1y - 1.5, 14, 3, 1.5); ctx.fill();
    rr(g1x - 1.5, g1y - 7, 3, 14, 1.5); ctx.fill();
    rr(g2x - 5, g2y - 1.2, 10, 2.4, 1.2); ctx.fill();
    rr(g2x - 1.2, g2y - 5, 2.4, 10, 1.2); ctx.fill();
  } else if (kind === 'ice') {
    /* vệt băng bóng loáng */
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 30); ctx.lineTo(x + 30, y + 10);
    ctx.moveTo(x + 20, y + 40); ctx.lineTo(x + 46, y + 14);
    ctx.stroke();
  } else if (kind === 'mold') {
    /* đốm mốc + khói hôi bay lên */
    ctx.fillStyle = 'rgba(98,124,54,.55)';
    for (let k = 0; k < 3; k++) {
      const mx2 = x + (0.2 + seededRand(seed * 19 + k * 23) * 0.6) * w;
      const my2 = y + 24 + seededRand(seed * 37 + k * 13) * (BLOCK_H - 40);
      ctx.beginPath(); ctx.arc(mx2, my2, 5 + seededRand(seed * 5 + k) * 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx2 + 8, my2 + 4, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  /* cạnh gấp giữa 2 mặt (B) — MỘT nét mảnh màu nhạt, nối đúng 2 góc */
  ctx.strokeStyle = SK.fold;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 1, y);
  ctx.lineTo(x + w - 1, y);
  ctx.stroke();

  /* viền ngoài TOÀN KHỐI một nét liền (A–E–sau–F–C–đáy) */
  ctx.strokeStyle = SK.line;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + inset, y - 22);
  ctx.lineTo(x + w - inset, y - 22);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + BLOCK_H - 8);
  ctx.arcTo(x + w, y + BLOCK_H, x + w - 8, y + BLOCK_H, 8);
  ctx.lineTo(x + 8, y + BLOCK_H);
  ctx.arcTo(x, y + BLOCK_H, x, y + BLOCK_H - 8, 8);
  ctx.closePath();
  ctx.stroke();
}

/* Khói hôi của miếng mốc — phần DUY NHẤT của miếng phô mai có animation,
   nên tách riêng, không nướng vào sprite. */
function paintMoldSmoke(x, y, w) {
  ctx.strokeStyle = 'rgba(130,150,80,.6)';
  ctx.lineWidth = 2.5;
  for (const fx of [x + w * 0.35, x + w * 0.65]) {
    const sway = Math.sin(timeMs * 0.004 + fx) * 3;
    ctx.beginPath();
    ctx.moveTo(fx, y - 24);
    ctx.quadraticCurveTo(fx - 5 + sway, y - 34, fx + sway, y - 42);
    ctx.stroke();
  }
}

/* Sprite của miếng phô mai: hình chỉ phụ thuộc (kind, seed, w) — cả 3 đều BẤT
   BIẾN suốt đời miếng đó. Cũ mỗi khung mỗi miếng phải chạy lại ~25 lệnh path
   + 10 lần seededRand chỉ để ra đúng một hình y hệt khung trước; với ~20 miếng
   trong khung là ~500 lệnh path + 200 lần random mỗi frame, vứt đi hoàn toàn. */
const BLK_OX = 2, BLK_OY = 24;
function getBlockSprite(kind, seed, w) {
  const key = kind + '|' + seed + '|' + w;
  let sp = blockSprites.get(key);
  if (sp) return sp;
  /* FIFO: Map giữ thứ tự chèn, mà tầng chèn sớm = tầng thấp = đã trôi khỏi
     khung từ lâu → xoá lô cũ nhất là đúng cái không còn dùng. */
  if (blockSprites.size >= 64) {
    const it = blockSprites.keys();
    for (let i = 0; i < 16; i++) {
      const k = it.next();
      if (k.done) break;
      blockSprites.delete(k.value);
    }
  }
  sp = mkSprite(w + 4, BLOCK_H + 26);
  intoSprite(sp, BLK_OX, BLK_OY, function () { paintBlockStatic(0, 0, kind, seed, w); });
  blockSprites.set(key, sp);
  return sp;
}

/* Miếng phô mai RÚT GỌN: 2 mảng màu + 1 viền (3 lệnh) thay cho ~25.
   Dùng khi miếng đã quá nhỏ trên màn để nhìn ra chi tiết. */
function paintBlockSimple(x, y, kind, w) {
  const SK = BLOCK_SKINS[kind] || BLOCK_SKINS.normal;
  const inset = Math.round(w * 0.1);
  ctx.fillStyle = SK.top;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w - inset, y - 22);
  ctx.lineTo(x + inset, y - 22);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = SK.body;
  frontFacePath(x, y, w, BLOCK_H, 8);      // path còn nguyên → fill rồi stroke luôn
  ctx.fill();
  ctx.strokeStyle = SK.line;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

/* Ngưỡng chi tiết: chiều cao miếng THẬT trên màn (đã nhân zoom). Dưới mức này
   thì lỗ phô mai chỉ còn 2px, vệt băng/đốm mốc đều dưới ngưỡng nhìn ra. */
const SIMPLE_PX = 34;

function drawBlock(cxW, topW, kind, seed, w, sq) {
  w = w || BLOCK_W;
  const x = sx(cxW - w / 2), y = sy(topW);
  if (y > LH / 2 + cullPad() || y < LH / 2 - cullPad() - BLOCK_H) return;
  /* Pan-out cuối ván kéo CẢ tháp vào khung — và màn thua GIỮ NGUYÊN cảnh đó cho
     tới khi bấm chơi lại, không phải "1 lần mỗi ván" như ghi chú cũ tưởng. Tháp
     100 tầng vẽ vector đầy đủ là ~2500 lệnh path + ~1000 lần seededRand MỖI KHUNG,
     chạy mãi. Đó là khung hình đắt nhất cả ván, mà lại đúng lúc người chơi đang
     nhìn điểm số. Nhỏ quá thì rút gọn — vừa nhanh vừa không mất gì để nhìn. */
  if (BLOCK_H * viewZoom < SIMPLE_PX) { paintBlockSimple(x, y, kind, w); return; }
  if (kind === 'spring') {                 // lò xo nén/nhả liên tục → vẽ vector
    drawSpringSandwich(x, y, w, seed, sq || 0, BLOCK_SKINS.spring, Math.round(w * 0.1));
    return;
  }
  /* Zoom vừa (tháp ngắn) vẫn dùng sprite: thu nhỏ tối đa 2.7× nên còn nét, mà
     số miếng lọt khung lúc đó ≤ 27 → cache 64 không bao giờ thrash. */
  const sp = getBlockSprite(kind, seed, w);
  ctx.drawImage(sp.c, x - BLK_OX, y - BLK_OY, sp.dw, sp.dh);
  if (kind === 'mold') paintMoldSmoke(x, y, w);
}

/* Ván gỗ đưa phô mai vào — thò ra / rút về mượt (world-anchored) */
function drawBoards() {
  for (const b of boards) {
    let ext = Math.min(1, (timeMs - b.extendT0) / BOARD_MS);
    ext = 1 - Math.pow(1 - ext, 3);                 // ease-out khi thò ra
    if (b.retractT0) {
      const r = Math.min(1, (timeMs - b.retractT0) / BOARD_MS);
      ext *= 1 - r * r;                              // ease-in khi rút về
    }
    if (ext <= 0.01) continue;
    const yv = sy(b.yW);
    if (yv > LH / 2 + cullPad() || yv < LH / 2 - cullPad()) continue;
    const fullLen = LW * 1.15;
    const startX = b.endX - b.dir * fullLen;         // đầu phía "tường" (ngoài màn)
    const curEnd = startX + b.dir * fullLen * ext;
    const x1 = sx(Math.min(startX, curEnd));
    const x2 = sx(Math.max(startX, curEnd));
    ctx.fillStyle = C.board;
    ctx.strokeStyle = C.boardEdge;
    ctx.lineWidth = 2;
    rr(x1, yv + 1, x2 - x1, 12, 5);
    ctx.fill(); ctx.stroke();
  }
}

/* Hamster — vẽ tại (cxW, feetW) world; opts điều khiển pose */
function drawHam(cxW, feetW, opts) {
  opts = opts || {};
  const x = sx(cxW), y = sy(feetW);
  const sq = opts.squash || 0;
  ctx.save();
  /* pivotX ≠ 0 → xoay quanh chân trụ thay vì giữa thân (loạng choạng) */
  ctx.translate(x + (opts.pivotX || 0), y);
  ctx.rotate(opts.rot || 0);
  ctx.translate(-(opts.pivotX || 0), 0);
  ctx.scale(1 + sq, 1 - sq);

  const armUp = opts.armsUp;
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(150,110,80,.35)';

  /* nền đặc silhouette: 2 tai + thân cùng màu C.ham, LÓT TRƯỚC (không viền) —
     khi xoay lúc loạng choạng, khe ghép tai↔thân luôn có lớp lông đặc phía sau
     nên không bao giờ hở ra nền bếp qua vành tai */
  const earY = -52;
  ctx.fillStyle = C.ham;
  ctx.beginPath(); ctx.arc(-19, earY, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(19, earY, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -26, 27, 26, 0, 0, Math.PI * 2); ctx.fill();

  /* tai */
  ctx.beginPath(); ctx.arc(-19, earY, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.hamPatch;                    // tai phải màu cam
  ctx.beginPath(); ctx.arc(19, earY, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.earIn;
  ctx.beginPath(); ctx.arc(-19, earY, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(19, earY, 8, 0, Math.PI * 2); ctx.fill();

  /* thân */
  ctx.fillStyle = C.ham;
  ctx.beginPath(); ctx.ellipse(0, -26, 27, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  /* mảng lông cam trên đầu (bên phải) */
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -26, 27, 26, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = C.hamPatch;
  ctx.beginPath(); ctx.ellipse(16, -42, 15, 13, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* mắt + má + mũi + miệng */
  ctx.fillStyle = '#3a2a20';
  ctx.beginPath(); ctx.arc(-9, -32, 2.7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -32, 2.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-8.2, -32.9, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9.8, -32.9, 1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.blush;
  ctx.beginPath(); ctx.arc(-16, -26, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, -26, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8798f';
  ctx.beginPath(); ctx.arc(0, -27, 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c98a5a';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(-2.6, -24, 2.6, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.arc(2.6, -24, 2.6, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  /* tay */
  ctx.fillStyle = C.ham;
  ctx.strokeStyle = 'rgba(150,110,80,.35)';
  ctx.lineWidth = 1.5;
  if (opts.flap) {
    /* 2 tay vẫy nhanh khi loạng choạng */
    const fa = Math.sin(timeMs * 0.045) * 9;
    ctx.beginPath(); ctx.ellipse(-27, -34 + fa * 0.7, 6, 8, -0.9 + fa * 0.05, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(27, -34 - fa * 0.7, 6, 8, 0.9 - fa * 0.05, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (armUp) {
    ctx.beginPath(); ctx.ellipse(-27, -40, 6, 8, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(27, -40, 6, 8, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(-25, -20, 6, 7, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(25, -20, 6, 7, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  /* chân — lift = -1/1: chân bên đó nhấc lên quơ trong không khí */
  ctx.fillStyle = C.hamShade;
  const swing = Math.sin(timeMs * 0.02) * 5;
  if (opts.lift === -1) {
    ctx.beginPath(); ctx.ellipse(-12 - swing * 0.6, -12 - Math.abs(swing) * 0.8, 7, 4, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  } else if (opts.lift === 1) {
    ctx.beginPath(); ctx.ellipse(-10, -2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12 + swing * 0.6, -12 - Math.abs(swing) * 0.8, 7, 4, 0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-10, -2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  /* dấu chấm than đỏ khi bị xô ngã */
  if (opts.bang) {
    const bx = x, byv = y - 88;
    ctx.fillStyle = '#e83a3a';
    rr(bx - 4, byv - 20, 8, 16, 4);
    ctx.fill();
    ctx.beginPath(); ctx.arc(bx, byv + 3, 4.4, 0, Math.PI * 2); ctx.fill();
  }

  /* dù khi rơi xuống cuối ván */
  if (opts.chute) {
    ctx.save();
    ctx.translate(x, y - 96);
    ctx.rotate((opts.rot || 0) * 0.4);
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k % 2 ? '#fff2dd' : '#ff9d4d';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = Math.PI + (k / 5) * Math.PI;
      const a2 = Math.PI + ((k + 1) / 5) * Math.PI;
      ctx.arc(0, 0, 40, a1, a2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(150,110,80,.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-36, -8); ctx.lineTo(-13, 48);
    ctx.moveTo(36, -8); ctx.lineTo(13, 48);
    ctx.stroke();
    ctx.restore();
  }
}

let lastFont = '';
/* Gán ctx.font là thao tác PHẢI parse chuỗi CSS font + tra font — đắt bất ngờ.
   Chỉ gán lại khi thật sự đổi. */
function setFont(f) {
  if (f !== lastFont) { ctx.font = f; lastFont = f; }
}

function drawFx() {
  if (!rings.length && !sparkles.length && !floatTexts.length) return;
  const now = timeMs;
  /* vòng sáng Perfect */
  for (const r of rings) {
    const p = (now - r.born) / 450;
    if (p >= 1) continue;
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4 * (1 - p);
    ctx.beginPath();
    ctx.ellipse(sx(r.x), sy(r.y), 56 + p * 84, 20 + p * 28, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  /* lấp lánh (dấu cộng xoay) */
  for (const s of sparkles) {
    const p = (now - s.born) / 500;
    if (p >= 1) continue;
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = '#fff';
    ctx.save();
    ctx.translate(sx(s.x), sy(s.y) - p * 30);
    ctx.rotate(p * 1.5);
    const r2 = 8 * (1 - p * 0.5);
    rr(-r2, -1.5, r2 * 2, 3, 1.5); ctx.fill();
    rr(-1.5, -r2, 3, r2 * 2, 1.5); ctx.fill();
    ctx.restore();
  }
  /* chữ nổi */
  ctx.textAlign = 'center';
  for (const f of floatTexts) {
    const p = (now - f.born) / (f.life || FLOAT_MS);
    if (p >= 1) continue;
    ctx.globalAlpha = 1 - p;
    setFont('800 ' + (f.size || 34) + 'px ' + CANVAS_FONT_STACK);
    ctx.fillStyle = f.color || '#fff';
    ctx.strokeStyle = 'rgba(120,80,30,.8)';
    ctx.lineWidth = 5;
    const y = sy(f.y) - p * (f.rise != null ? f.rise : 52);
    if (f.rot) {                       // chữ nghiêng (cảnh báo miếng vàng)
      ctx.save();
      ctx.translate(sx(f.x), y);
      ctx.rotate(f.rot);
      ctx.strokeText(f.text, 0, 0);
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    } else {
      ctx.strokeText(f.text, sx(f.x), y);
      ctx.fillText(f.text, sx(f.x), y);
    }
  }
  ctx.globalAlpha = 1;
}

function render() {
  lastFont = '';        // ctx.font bị save/restore trả về mặc định → cache theo khung
  drawBackground();

  /* lớp thế giới — zoom trình diễn quanh tâm màn (pan-out cuối ván) */
  ctx.save();
  if (Math.abs(viewZoom - 1) > 0.001) {
    ctx.translate(LW / 2, LH / 2);
    ctx.scale(viewZoom, viewZoom);
    ctx.translate(-LW / 2, -LH / 2);
  }

  drawTable();

  /* nhún của miếng trên cùng khi hamster vừa đáp (impact).
     Miếng LÒ XO có nhịp riêng: nén–nhả 2 lần, tắt dần, dài gấp đôi */
  let bSq = 0, bSqS = 0, bTilt = 0;
  const bp = (timeMs - landBounceT0) / BOUNCE_MS;
  if (bp >= 0 && bp < 1) {
    bSq = Math.sin(bp * Math.PI);
    /* NHÚNG SANG BÊN: miếng nghiêng về phía hamster vừa đáp rồi bật lại */
    bTilt = Math.sin(bp * Math.PI) * landBounceOff * 0.15;
  }
  const bpS = (timeMs - landBounceT0) / (BOUNCE_MS * 2);
  if (bpS >= 0 && bpS < 1) bSqS = Math.abs(Math.sin(bpS * Math.PI * 2)) * (1 - bpS * 0.55);
  const topIsSpring = (tower[tower.length - 1].kind === 'spring');

  /* Tháp phô mai — chỉ DUYỆT phần trong khung nhìn.
     Cũ lặp qua CẢ tháp rồi để drawBlock tự cull: tháp 150 tầng là 150 lần gọi
     hàm + 150 lần sx()/sy() mỗi khung chỉ để 15 cái vẽ thật. Tầng i luôn nằm ở
     worldY = -(i+1)*BLOCK_H nên khoảng chỉ số lọt khung tính thẳng ra được. */
  const pad = cullPad();
  const i0 = Math.max(0, Math.floor((camOff - LH / 2 - pad) / BLOCK_H) - 1);
  const i1 = Math.min(tower.length - 1,
                      Math.ceil((camOff - LH / 2 + pad) / BLOCK_H) + 1);
  for (let i = i0; i <= i1; i++) {
    const isTop = i === tower.length - 1;
    const kd = tower[i].kind || 'normal';
    const seed = tower[i].seed != null ? tower[i].seed : i;
    /* settle mượt: tầng vừa ghim TRƯỢT NỐT từ vị trí vẽ cuối về cx thật (~100ms)
       thay vì snap lùi 1 nhịp — hết "giật" mỗi lần đáp */
    let vCx = tower[i].cx;
    if (tower[i].vT0 && timeMs - tower[i].vT0 < SETTLE_MS) {
      const q = (timeMs - tower[i].vT0) / SETTLE_MS;
      vCx += (tower[i].vFrom - tower[i].cx) * (1 - q) * (1 - q);
    }
    if (isTop && (bSq > 0 || bSqS > 0 || bTilt !== 0)) {
      /* impact khi đáp: nén dọc + NGHIÊNG quanh mép DƯỚI về phía đáp (nhúng) */
      const bx = sx(vCx), byB = sy(-i * BLOCK_H);
      ctx.save();
      ctx.translate(bx, byB);
      if (bTilt) ctx.rotate(bTilt);
      if (kd !== 'spring' && bSq > 0) ctx.scale(1 + 0.10 * bSq, 1 - 0.12 * bSq);
      ctx.translate(-bx, -byB);
      /* lò xo TỰ NÉN bên trong (truyền bSqS); miếng thường không cần sq */
      drawBlock(vCx, -(i + 1) * BLOCK_H, kd, seed, tower[i].w, kd === 'spring' ? bSqS : undefined);
      ctx.restore();
    } else {
      drawBlock(vCx, -(i + 1) * BLOCK_H, kd, seed, tower[i].w);
    }
  }

  /* miếng trượt hụt đang rơi khỏi tháp */
  for (const fb of fallBlocks) {
    const cxS = sx(fb.cx), cyS = sy(fb.yTop + BLOCK_H / 2);
    ctx.save();
    ctx.translate(cxS, cyS);
    ctx.rotate(fb.rot);
    ctx.translate(-cxS, -cyS);
    drawBlock(fb.cx, fb.yTop, fb.kind || 'normal', fb.seed, fb.w);
    ctx.restore();
  }

  drawBoards();
  /* các miếng đang trượt vào (neo yTopW — miếng mốc ở làn cao) */
  for (const s of sliders) {
    drawBlock(s.cx, s.yTopW, s.kind, s.seed, s.w);
  }

  /* hamster theo trạng thái */
  if (ham) {
    if (ham.state === 'jump') {
      const p = Math.min(1, (timeMs - ham.t0) / (ham.jumpDur || JUMP_DUR));
      const h = (ham.jumpH || JUMP_H) * Math.sin(p * Math.PI);
      drawHam(ham.x, surfaceY() - 8 - h, { armsUp: true, squash: -0.1 * Math.sin(p * Math.PI) });
    } else if (ham.state === 'stumble') {
      /* nghiêng người về 1 phía quanh chân trụ, chân kia quơ, 2 tay vẫy */
      const p = Math.min(1, (timeMs - ham.t0) / STUMBLE_MS);
      const lean = ham.stumbleDir || -1;
      const rot = lean * 0.24 * Math.sin(p * Math.PI) * (1 + 0.12 * Math.sin(p * 22));
      /* chân PHÍA MÉP (đối diện hướng nghiêng) quơ trong không khí,
         chân phía nghiêng làm trụ */
      drawHam(ham.x, surfaceY() - 8 + (topIsSpring ? 22 * bSqS : BLOCK_H * 0.12 * bSq), {
        rot, flap: true, lift: -lean, pivotX: lean * 10,
      });
    } else if (ham.state === 'drop') {
      /* rơi tự do sau khi tháp sập */
      drawHam(ham.x, ham.drop.y - 8, { armsUp: true, squash: -0.06 });
    } else if (ham.state === 'knock') {
      const k = ham.knock;
