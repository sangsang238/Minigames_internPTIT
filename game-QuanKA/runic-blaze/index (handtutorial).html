<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Digiment 2048</title>
<link href="https://fonts.googleapis.com/css2?family=Changa+One&display=swap" rel="stylesheet" />
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent; /* tắt ô xanh khi chạm */
    -webkit-touch-callout: none;              /* tắt menu giữ-để-chọn */
  }

  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Changa One', system-ui, sans-serif;
    background: #152540;
    color: #fff;
    position: fixed;
    inset: 0;
    touch-action: none;
  }

  #root { position: absolute; inset: 0; }

  /* Lớp nền trang trí (background-common) */
  #bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  /* Canvas khu vực chơi (ladder + grid + fx) */
  #game {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: block;
    touch-action: none;
  }

  /* ─────────────── HUD ─────────────── */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }

  /* Vị trí tuyệt đối: Back trái, Volume phải-TRÊN, Energy GIỮA-DƯỚI, Score/Best giữa.
     top của từng phần do JS (relayout) đặt — căn giữa nút theo chiều cao ô. */
  .btn3d.hud-back { position: absolute; left: 12px; }
  .btn3d.hud-mute { position: absolute; right: 12px; }
  .energy-bar     { position: absolute; left: 50%; transform: translateX(-50%); }

  .hud-scores {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }

  .hud-pill {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    background: rgba(2, 32, 48, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 7px 8px 9px 4px;       /* icon ghim sát mép trái (~2px sau border) */
    text-align: center;
    display: flex;                  /* icon + text cùng trong flow */
    align-items: center;
    justify-content: center;
    gap: 5px;
    box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.08),
                0 3px 8px rgba(0, 0, 0, 0.35);
  }
  /* text chiếm phần còn lại & KHÔNG co lại (flex-shrink:0) → dài ra thì cả hàng tràn,
     bị căn giữa nên icon bị "đá" ra ngoài mép trái thay vì nhường chỗ cho text */
  .pill-text { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 1 0 auto; }
  /* icon trong flow, ghim sát mép trái ô */
  .pill-ico {
    flex: 0 0 auto;
    width: clamp(16px, 4.8vw, 21px); height: clamp(16px, 4.8vw, 21px); display: block;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .hud-pill .label {
    font-size: clamp(10px, 3.2vw, 13px);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #8fd0ff;                 /* nhãn xanh nước biển */
    line-height: 1.05;
    white-space: nowrap;
  }
  .hud-pill .value {
    font-size: clamp(16px, 5vw, 24px);
    line-height: 1.1;
    color: #fff;
    white-space: nowrap;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 800;
    text-shadow: 0 2px 2px rgba(0, 0, 0, 0.4);
  }
  #best-val { color: #ffd86b; }     /* điểm BEST accent vàng */

  /* energy bar (⚡ + 5 nấc) — căn giữa dưới hàng Score/Best */
  .energy-bar { display: flex; align-items: center; gap: 7px; }
  .energy-ico {
    width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #bdeaff, #3aa6ff 60%, #1463c8);
    border: 2px solid #8fd0ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
  }
  /* khay chứa 5 nấc */
  .energy-track {
    display: flex; gap: 4px; align-items: center;
    background: rgba(2, 24, 56, 0.62);
    border: 2px solid rgba(120, 200, 255, 0.30);
    border-radius: 9px; padding: 4px;
    box-shadow: inset 0 2px 6px rgba(160,220,255,.10), 0 3px 8px rgba(0,0,0,.30);
  }
  .energy-seg {
    width: 34px; height: 22px; border-radius: 5px;
    background: rgba(255,255,255,0.10);                 /* nấc rỗng */
    transition: background 0.15s ease-out;
  }
  .energy-seg.on { background: linear-gradient(180deg, #b6e88a, #8ed162); }  /* nấc đầy (xanh lá) */
  .energy-bar.low .energy-seg.on { background: linear-gradient(180deg, #ff8aa0, #ef5276); }  /* sắp cạn → đỏ */

  .back-ico { width: 52%; height: 52%; fill: currentColor; display: block; }
  .mute-ico { width: 60%; height: 60%; display: block; color: var(--surface-text); }

  /* ─────────────── btn3d (button-common) ─────────────── */
  .btn3d {
    --depth: 4px;
    --radius: 16px;
    --surface-color: #23c63e;
    --surface-border-color: #2fa643;
    --surface-border-width: 3px;
    --surface-highlight: rgb(24, 172, 26);
    --surface-deep: rgba(11, 56, 21, 0.637);
    --shadow-color: #02522f;
    --surface-text: #fff;
    --surface-height: 42px;
    --surface-width: auto;
    --surface-padding-x: 16px;
    --surface-font-size: 40px;

    flex: 0 0 auto;
    position: relative;
    display: inline-block;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    font: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.09s ease-out;
  }
  .btn3d-shadow {
    position: absolute;
    top: var(--depth);
    left: 0; right: 0; bottom: 0;
    z-index: 0;
    border-radius: var(--radius);
    background: var(--shadow-color);
  }
  .btn3d-surface {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: var(--surface-height);
    width: var(--surface-width);
    padding: 0 var(--surface-padding-x);
    margin-bottom: var(--depth);
    border-radius: var(--radius);
    background-color: var(--surface-color);
    border: var(--surface-border-width) solid var(--surface-border-color);
    color: var(--surface-text);
    font-family: 'Changa One', system-ui, sans-serif;
    font-weight: 400;
    font-size: var(--surface-font-size);
    letter-spacing: 0.6px;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
    box-shadow:
      inset 0 -2px 6px 0.5px var(--surface-deep),
      inset 0 3px 6px var(--surface-highlight);
    transition: transform 0.09s ease-out;
  }
  .btn3d:active { transform: scale(0.97); }
  .btn3d:active .btn3d-surface { transform: translateY(var(--depth)); }
  .btn3d.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.4); }

  .btn3d.btn-icon {
    --surface-width: var(--surface-height);
    --surface-padding-x: 0;
  }
  .btn3d.btn-icon, .hud-pill, .energy-bar { -webkit-user-select: none; user-select: none; }

  /* Back/mute icon button — PHẲNG (đồng bộ theme): màu đặc + viền mảnh, không lip/gloss 3D */
  .btn3d.hud-back, .btn3d.hud-mute {
    --depth: 0;
    --surface-color: #2f8fe0;
    --surface-border-color: #1f5f9a;
    --surface-border-width: 2px;
    --surface-height: 42px;
    --surface-font-size: 22px;
  }
  .btn3d.hud-back .btn3d-shadow, .btn3d.hud-mute .btn3d-shadow { display: none; }       /* bỏ lip đổ bóng */
  .btn3d.hud-back .btn3d-surface, .btn3d.hud-mute .btn3d-surface {
    box-shadow: none;        /* bỏ inset highlight/deep → phẳng */
    margin-bottom: 0;
  }
  .btn3d.hud-mute { --surface-font-size: 19px; --radius: 13px; }   /* cao 42 bằng Back (đối xứng) */

  /* Màn hẹp (vd 320px): thu nhỏ thanh energy */
  @media (max-width: 360px) {
    .energy-seg { width: 26px; height: 19px; }
    .energy-ico { width: 18px; height: 18px; font-size: 11px; }
  }

  /* ─────────────── Result overlay (game tự vẽ — high-score) ─────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2, 16, 24, 0.62);
    backdrop-filter: blur(2px);
    padding: 24px;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%;
    max-width: 320px;
    background: linear-gradient(180deg, #0a4a72, #042a44);
    border: 3px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 26px 22px 24px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.06);
    transform: scale(0.92);
    transition: transform 0.18s ease-out;
  }
  .overlay.show .card { transform: scale(1); }
  .card h2 {
    font-size: 34px;
    letter-spacing: 1px;
    color: #ffd23f;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    margin-bottom: 16px;
  }
  .card .stat-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .card .stat { flex: 1; background: rgba(0, 0, 0, 0.28); border-radius: 14px; padding: 10px 6px 11px; }
  .card .stat .label { font-size: 12px; letter-spacing: 1.5px; color: #8fd0ff; }
  .card .stat .value { font-size: 26px; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.4); }
  .card .stat.best.new .value { color: #ffd23f; }
  .card .newbest {
    font-size: 13px; letter-spacing: 1px; color: #ffd23f;
    margin: -10px 0 14px; display: none;
  }
  .card.is-newbest .newbest { display: block; }
  .card .btn3d { width: 100%; }
  .card .btn3d.card-btn {
    --surface-height: 52px;
    --surface-padding-x: 24px;
    --surface-font-size: 20px;
    --surface-color: #0aaa96;
    --surface-border-color: #077065;
    --surface-highlight: rgba(100, 240, 220, 0.40);
    --surface-deep: rgba(0, 40, 36, 0.60);
    --shadow-color: #033028;
  }
  .card .btn3d.card-btn .btn3d-surface { width: 100%; }
</style>
</head>
<body>
  <div id="root">
    <canvas id="bg"></canvas>
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="btn3d btn-icon hud-back" id="back-btn" role="button" aria-label="Back">
        <span class="btn3d-shadow"></span>
        <span class="btn3d-surface">
          <svg class="back-ico" viewBox="0 0 447.243 447.243" aria-hidden="true">
            <path fill="currentColor" d="M420.361 192.229a31.967 31.967 0 0 0-5.535-.41H99.305l6.88-3.2a63.998 63.998 0 0 0 18.08-12.8l88.48-88.48c11.653-11.124 13.611-29.019 4.64-42.4-10.441-14.259-30.464-17.355-44.724-6.914a32.018 32.018 0 0 0-3.276 2.754l-160 160c-12.504 12.49-12.515 32.751-.025 45.255l.025.025 160 160c12.514 12.479 32.775 12.451 45.255-.063a32.084 32.084 0 0 0 2.745-3.137c8.971-13.381 7.013-31.276-4.64-42.4l-88.32-88.64a64.002 64.002 0 0 0-16-11.68l-9.6-4.32h314.24c16.347.607 30.689-10.812 33.76-26.88 2.829-17.445-9.019-33.88-26.464-36.71z"/>
          </svg>
        </span>
      </div>

      <div class="hud-scores" id="hud-scores">
        <div class="hud-pill">
          <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14 L18.3 21 L12 17.3 L5.7 21 L7.3 14 L2 9.3 L9.1 8.6 Z"
                  fill="#ffd23f" stroke="#c8901a" stroke-width="1" stroke-linejoin="round"/>
          </svg>
          <div class="pill-text">
            <div class="label">SCORE</div>
            <div class="value" id="score-val">0</div>
          </div>
        </div>
        <div class="hud-pill">
          <svg class="pill-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18 L4.2 8 L9 12.5 L12 5.5 L15 12.5 L19.8 8 L21 18 Z" fill="#ffd23f" stroke="#a9740a" stroke-width="1.2" stroke-linejoin="round"/>
            <rect x="3.4" y="16.6" width="17.2" height="3" rx="1.2" fill="#f0b400"/>
            <circle cx="4.2" cy="8" r="1.5" fill="#fff1a8"/>
            <circle cx="12" cy="5.5" r="1.6" fill="#fff1a8"/>
            <circle cx="19.8" cy="8" r="1.5" fill="#fff1a8"/>
          </svg>
          <div class="pill-text">
            <div class="label">BEST</div>
            <div class="value" id="best-val">0</div>
          </div>
        </div>
      </div>

      <div class="btn3d btn-icon hud-mute" id="mute-btn" role="button" aria-label="Sound">
        <span class="btn3d-shadow"></span>
        <span class="btn3d-surface">
          <svg class="mute-ico" id="mute-svg" viewBox="0 0 24 24" aria-hidden="true"></svg>
        </span>
      </div>
      <div class="energy-bar" id="energy-bar">
        <span class="energy-ico">⚡</span>
        <div class="energy-track" id="energy-track">
          <span class="energy-seg"></span>
          <span class="energy-seg"></span>
          <span class="energy-seg"></span>
          <span class="energy-seg"></span>
          <span class="energy-seg"></span>
        </div>
      </div>
    </div>


    <div class="overlay" id="overlay">
      <div class="card" id="result-card">
        <h2>GAME OVER</h2>
        <div class="newbest">NEW BEST!</div>
        <div class="stat-row">
          <div class="stat"><div class="label">SCORE</div><div class="value" id="ov-score">0</div></div>
          <div class="stat best"><div class="label">BEST</div><div class="value" id="ov-best">0</div></div>
        </div>
        <button class="btn3d card-btn" id="play-again-btn" type="button">
          <span class="btn3d-shadow"></span>
          <span class="btn3d-surface">Play Again</span>
        </button>
      </div>
    </div>
  </div>

<script>
'use strict';
const TAU = Math.PI * 2;
const now = () => performance.now();

/* ============================================================
 * 1. NATIVE BRIDGE  (game-common.md — game KHÔNG level)
 * ========================================================== */
function post(msg) {
  try {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    } else {
      console.log('[digiment → native]', msg);
    }
  } catch (e) { /* ignore */ }
}
function sendMessage(type, opts) {
  opts = opts || {};
  post({
    type,
    level: null,                          // game không level → luôn null
    result: opts.result != null ? opts.result : null,
    data: opts.data != null ? opts.data : null,
    showModal: opts.showModal === true,
  });
}
function saveData(payload) {
  const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
  try { localStorage.setItem('digiment_save', data); } catch (e) {}
  sendMessage('save_data', { data });
}
function getStatusBarHeight() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('statusBarHeight');
  const fromWin = typeof window.statusBarHeight !== 'undefined' ? window.statusBarHeight : null;
  let h = Number(fromUrl != null ? fromUrl : fromWin);
  if (Number.isNaN(h) || h < 0) h = 0;
  return h;
}
function getInitialData() {
  const fromWin = typeof window.data === 'string' ? window.data : null;
  const fromUrl = new URLSearchParams(window.location.search).get('data');
  if (fromWin != null) return fromWin;
  if (fromUrl) return fromUrl;
  try { return localStorage.getItem('digiment_save') || ''; } catch (e) { return ''; }
}
function parseInitialData() {
  const raw = getInitialData();
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}
function persistBest() { saveData({ best }); }

// Lưu TOÀN BỘ ván đang chơi (giống 2048_MergeBall) → mở lại chơi tiếp.
// Ván đã thua/kết thúc → chỉ lưu best (mở lại = ván mới).
function saveGameState() {
  if (gameOver || losing) { saveData({ best }); return; }
  const cells = new Array(ROWS * COLS);
  let i = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) { const t = grid[r][c]; cells[i++] = t ? t.e : 0; }
  saveData({ best, energy, score, minExp, maxReached, cells });
}
// Dựng lại bàn từ state đã lưu (gọi trong bootGame, SAU relayout để cellCX/cellCY hợp lệ).
function restoreBoard(d) {
  minExp = d.minExp; maxReached = d.maxReached; score = d.score || 0;
  energy = (typeof d.energy === 'number' && d.energy > 0) ? d.energy : ENERGY_START;
  newGrid();
  let i = 0, empties = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const e = d.cells[i++];
      if (e > 0) grid[r][c] = makeTile(r, c, e); else empties++;
    }
  if (empties > 0) collapseAndRefill();   // lưu đúng lúc đang animation (hiếm) → lấp đầy lại
}

// Callback native → game
window.onAppPause   = function () { paused = true; saveGameState(); };
window.onRetryLevel = function () { resetGame(); };
window.onNextLevel  = function () { /* no-op: game không level */ };

/* ============================================================
 * 2. BACKGROUND  (background-common.md — port 1:1)
 * ========================================================== */
const GAME_BG_THEMES = {
  purple: { radialGlow: ['#9c08b3','#53016f','#3c0253','#200125'], decorGrad: ['#54186a','#2a0c30'] },
  green:  { radialGlow: ['#029a2d','#066126','#025535','#043010'], decorGrad: ['#0a3018','#05180c'] },
  teal:   { radialGlow: ['#039d8d','#055a52','#064446','#042030'], decorGrad: ['#051a1c','#020a0c'] },
  blue:   { radialGlow: ['#00a0b5','#006080','#004866','#002f50'], decorGrad: ['#102850','#081830'] },
  brown:  { radialGlow: ['#af014a','#6f012f','#560024','#3f001a'], decorGrad: ['#490504','#430902'] },
  blue2:  { radialGlow: ['#006080','#006080','#004866','#002f50'], decorGrad: ['#102850','#081830'] },
};
const GAME_BG_VARIANT = 'blue';

const BLOB_CONFIGS = [
  { x: -0.1,  y: 0.15,  size: 70, opacity: 0.12, rotate: -15, offsets: [0.25, -0.2, 0.3, -0.15, 0.2, -0.3, 0.15] },
  { x: 1.1,   y: 0.5,   size: 65, opacity: 0.11, rotate: 20,  offsets: [-0.2, 0.35, -0.15, 0.25, -0.3, 0.2] },
  { x: 0.5,   y: -0.06, size: 60, opacity: 0.10, rotate: 35,  offsets: [0.3, -0.2, 0.25, -0.35, 0.15, -0.25, 0.2, -0.15] },
  { x: -0.08, y: 0.75,  size: 65, opacity: 0.10, rotate: -25, offsets: [-0.15, 0.3, -0.25, 0.2, -0.35, 0.15, -0.2] },
  { x: 1.08,  y: 0.88,  size: 55, opacity: 0.12, rotate: 15,  offsets: [0.2, -0.25, 0.35, -0.15, 0.25, -0.3] },
  { x: 0.78,  y: 0.18,  size: 32, opacity: 0.12, rotate: -20, offsets: [-0.2, 0.35, -0.1, 0.25, -0.15] },
  { x: 0.45,  y: 0.68,  size: 34, opacity: 0.12, rotate: 18,  offsets: [0.35, -0.2, 0.15, -0.3, 0.25, -0.15] },
  { x: 0.82,  y: 0.75,  size: 28, opacity: 0.13, rotate: -12, offsets: [-0.25, 0.3, -0.2, 0.15, -0.35] },
  { x: 0.08,  y: 0.05,  size: 10, opacity: 0.15, rotate: 15,  offsets: [0.3, -0.15, 0.25, -0.35, 0.1] },
  { x: 0.92,  y: 0.1,   size: 12, opacity: 0.14, rotate: -25, offsets: [-0.2, 0.35, -0.1, 0.25] },
  { x: 0.55,  y: 0.28,  size: 9,  opacity: 0.15, rotate: 30,  offsets: [0.25, -0.3, 0.2, -0.15, 0.35] },
  { x: 0.12,  y: 0.48,  size: 11, opacity: 0.14, rotate: -18, offsets: [-0.15, 0.3, -0.25, 0.2] },
  { x: 0.88,  y: 0.62,  size: 10, opacity: 0.15, rotate: 22,  offsets: [0.35, -0.2, 0.15, -0.3, 0.25] },
  { x: 0.48,  y: 0.85,  size: 12, opacity: 0.14, rotate: -10, offsets: [-0.25, 0.3, -0.2, 0.15] },
];
function hexToRgb(hex) {
  let h = (hex || '').trim().replace(/^#/, '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];

  const n = parseInt(h, 16);
  return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };

function buildBlobPath(cx, cy, r, offsets) {
  const n = offsets.length;
  const step = TAU / n;
  const pts = offsets.map((off, i) => {
    const a = i*step - Math.PI/2;
    const ri = r*(1+off);
    return { x: cx + Math.cos(a)*ri, y: cy + Math.sin(a)*ri };
  });
  const path = new Path2D();
  path.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < n; i++) {
    const curr = pts[i], next = pts[(i+1)%n];
    const a = i*step - Math.PI/2;
    const na = ((i+1)%n)*step - Math.PI/2;
    const cp1x = curr.x + Math.cos(a + Math.PI/2)*r*0.38;
    const cp1y = curr.y + Math.sin(a + Math.PI/2)*r*0.38;
    const cp2x = next.x - Math.cos(na + Math.PI/2)*r*0.38;
    const cp2y = next.y - Math.sin(na + Math.PI/2)*r*0.38;
    path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, next.x, next.y);
  }
  path.closePath();
  return path;
}
function drawGameBackground(g, opts) {
  const { width, height, radialGlowColors, decorGradColors } = opts;
  const density = opts.density != null ? opts.density : 1;
  if (width <= 0 || height <= 0) return;
  const centerX = width/2, centerY = height*0.42;

  const stops = [0, 0.35, 0.55, 1];
  const radial = g.createRadialGradient(centerX, centerY, 0, centerX, centerY, height*0.55);
  radialGlowColors.forEach((c, i) => radial.addColorStop(stops[i] != null ? stops[i] : 1, c));
  g.fillStyle = radial;
  g.fillRect(0, 0, width, height);

  const decor = hexToRgb(decorGradColors[0] || '#54186a');
  for (const cfg of BLOB_CONFIGS) {
    const x = cfg.x*width, y = cfg.y*height, size = cfg.size*density;
    const path = buildBlobPath(x, y, size, cfg.offsets);
    g.save();
    g.translate(x, y);
    g.rotate((cfg.rotate*Math.PI)/180);
    g.translate(-x, -y);
    g.fillStyle = `rgba(${decor.r}, ${decor.g}, ${decor.b}, ${cfg.opacity})`;
    g.fill(path);
    g.save();
    g.clip(path);
    g.lineWidth = 4*density;
    g.strokeStyle = 'rgba(0, 0, 0, 0.1)';
    if ('filter' in g) {
      g.filter = `blur(${4*density}px)`;
      g.stroke(path);
      g.filter = 'none';
    } else {
      g.shadowColor = 'rgba(0, 0, 0, 0.1)';
      g.shadowBlur = 4*density;
      g.stroke(path);
      g.shadowColor = 'transparent';
      g.shadowBlur = 0;
    }
    g.restore();
    g.restore();
  }

  const vH = height*0.22, vW = width*0.18;
  const A55 = 'rgba(0,0,0,0.333)', A44 = 'rgba(0,0,0,0.267)', A00 = 'rgba(0,0,0,0)';
  const linear = (x0,y0,x1,y1,c0,c1,rx,ry,rw,rh) => {
    const lg = g.createLinearGradient(x0,y0,x1,y1);
    lg.addColorStop(0,c0); lg.addColorStop(1,c1);
    g.fillStyle = lg; g.fillRect(rx,ry,rw,rh);
  };
  linear(0,0,0,vH,A55,A00, 0,0,width,vH);
  linear(0,height-vH,0,height,A00,A55, 0,height-vH,width,vH);
  linear(0,0,vW,0,A44,A00, 0,0,vW,height);
  linear(width-vW,0,width,0,A00,A44, width-vW,0,vW,height);
}

/* ============================================================
 * 6. TILE MODEL & GEOMETRY
 * ========================================================== */
function cellCX(c) { return gx0 + c * cell + cell / 2; }
function cellCY(r) { return gy0 + r * cell + cell / 2; }

function makeTile(r, c, e, startY) {
  return {
    e, r, c,
    x: cellCX(c),
    y: startY != null ? startY : cellCY(r),
    pop: 0, appear: 0, grow: 0, sh: 0,
    merging: false, mergeTarget: false, mergeScale: 1,   // pha chuẩn bị merge (thu nhỏ + hút)
  };
}

// độ lệch ngang khi lắc: ~1.5 dao động tắt dần (lắc nhẹ 1 cái)
function shakeOffset(t) {
  if (!t.sh || t.sh <= 0) return 0;
  const p = t.sh / SHAKE_TIME;                       // 1 → 0
  return Math.sin((1 - p) * Math.PI * 3) * cell * 0.07 * p;
}

// ease-out có "vọt" nhẹ qua 1 rồi về (cho ô số mới bung ra)
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

// Weighted spawn (heatmap): chọn GIÁ TRỊ cho ô (r,c) dựa trên value-weight phẳng,
// rồi điều tiết theo số hàng xóm ĐÃ đặt cùng giá trị (CLUSTER_FACTOR).
// Chỉ tính các hàng xóm đã có tile (không null) — hợp với cả lúc fill ban đầu lẫn refill.
function spawnExpFor(r, c) {
  const n = SPAWN_SPREAD;
  const w = new Array(n);
  let total = 0;
  for (let i = 0; i < n; i++) {
    const e = minExp + i;
    let weight = BASE_VALUE_WEIGHTS[i] != null ? BASE_VALUE_WEIGHTS[i] : 0.1;
    let m = 0;   // số hàng xóm cùng giá trị
    const up = grid[r-1] ? grid[r-1][c] : null;
    const dn = grid[r+1] ? grid[r+1][c] : null;
    const lf = grid[r][c-1], rt = grid[r][c+1];
    if (up && up.e === e) m++;
    if (dn && dn.e === e) m++;
    if (lf && lf.e === e) m++;
    if (rt && rt.e === e) m++;
    if (m > 0) weight *= Math.pow(CLUSTER_FACTOR, m);
    w[i] = weight; total += weight;
  }
  let x = Math.random() * total;
  for (let i = 0; i < n; i++) { x -= w[i]; if (x <= 0) return minExp + i; }
  return minExp;
}

/* ============================================================
 * 7. BOARD INIT / GRAVITY / REFILL
 * ========================================================== */
function newGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(null));
}

// Chỉ lấp đầy FILL_ROWS hàng DƯỚI mỗi cột (trên trống — giống ảnh Digiment).
function fillInitial() {
  newGrid();
  for (let c = 0; c < COLS; c++)
    for (let k = 0; k < FILL_ROWS; k++) {
      const r = ROWS - 1 - k;
      const t = makeTile(r, c, spawnExpFor(r, c));
      t.appear = 0.0001 + (k + c) * 0.012;   // small stagger pop on start
      grid[r][c] = t;
      if (t.e > maxReached) maxReached = t.e;   // MAX marker = ô to nhất lúc tạo màn
    }
  clearInitialGroups();   // bàn khởi tạo phải "sạch" — không có cụm ≥3 chờ sẵn (tránh windfall ở tap đầu)
}

// Đổi giá trị 1 ô trong mỗi cụm ≥3 cho tới khi bàn không còn cụm nào (gọi sau khi fill).
function clearInitialGroups() {
  for (let guard = 0; guard < 400; guard++) {
    const seen = new Set(); let found = null;
    for (let r = 0; r < ROWS && !found; r++)
      for (let c = 0; c < COLS && !found; c++) {
        const t = grid[r][c]; if (!t || seen.has(r + ',' + c)) continue;
        const gg = floodGroup(r, c);
        for (const [gr, gc] of gg) seen.add(gr + ',' + gc);
        if (gg.length >= MERGE_MIN) found = gg;
      }
    if (!found) break;
    const [rr, cc] = found[(Math.random() * found.length) | 0];
    const old = grid[rr][cc].e;
    let ne = old;
    if (SPAWN_SPREAD > 1) { let tries = 0; do { ne = minExp + ((Math.random() * SPAWN_SPREAD) | 0); } while (ne === old && tries++ < 8); }
    grid[rr][cc].e = ne;
  }
}

// Kéo tiles xuống đáy mỗi cột; spawn tiles mới phía trên rơi vào tới khi cột đủ FILL_ROWS ô.
function collapseAndRefill() {
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = ROWS - 1; r >= 0; r--) { if (grid[r][c]) col.push(grid[r][c]); grid[r][c] = null; }
    let r = ROWS - 1;
    for (const t of col) { t.r = r; t.c = c; t.fresh = false; grid[r][c] = t; r--; }   // ô CŨ (rơi xuống)
    let need = FILL_ROWS - col.length;     // số ô cần spawn thêm để cột đủ FILL_ROWS
    let idx = 0;
    for (; need > 0 && r >= 0; need--, r--) {
      const e = spawnExpFor(r, c);   // đọc hàng xóm đã đặt (dưới + trái) để điều tiết cụm
      const t = makeTile(r, c, e, gy0 - (idx + 1) * cell);
      t.fresh = true;                // ô MỚI sinh → có thể bị đổi giá trị để KHÔNG tạo cụm
      grid[r][c] = t;
      idx++;
    }
  }
  breakFreshGroups();   // ô mới sinh KHÔNG được tự tạo cụm ≥3 → cascade chỉ đến từ chuỗi do người chơi tạo
}

// Đổi giá trị các ô MỚI SINH (fresh) đang nằm trong cụm ≥3 → tách chúng ra, để refill không cho merge "miễn phí".
// Cụm toàn ô CŨ (do trọng lực dồn lại) thì GIỮ NGUYÊN — đó là chuỗi hợp lệ do nước đi của người chơi.
function breakFreshGroups() {
  for (let guard = 0; guard < 200; guard++) {
    const seen = new Set(); let fresh = null;
    for (let r = 0; r < ROWS && !fresh; r++)
      for (let c = 0; c < COLS && !fresh; c++) {
        const t = grid[r][c]; if (!t || seen.has(r + ',' + c)) continue;
        const g = floodGroup(r, c);
        for (const [gr, gc] of g) seen.add(gr + ',' + gc);
        if (g.length >= MERGE_MIN) for (const [gr, gc] of g) if (grid[gr][gc].fresh) { fresh = [gr, gc]; break; }
      }
    if (!fresh) break;                       // không còn cụm nào chứa ô mới → xong
    const [rr, cc] = fresh, old = grid[rr][cc].e;
    let ne = old, tries = 0;
    do { ne = minExp + ((Math.random() * SPAWN_SPREAD) | 0); tries++; }
    while (tries < 16 && (ne === old || __sameAsNeighbor(rr, cc, ne)));   // chọn giá trị KHÔNG trùng hàng xóm
    grid[rr][cc].e = ne;
  }
}
function __sameAsNeighbor(r, c, e) {
  for (const [nr, nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]) {
    const u = grid[nr] && grid[nr][nc]; if (u && u.e === e) return true;
  }
  return false;
}

/* ============================================================
 * 8. MERGE LOGIC
 * ========================================================== */
function floodGroup(r, c) {
  const e = grid[r][c].e;
  const seen = new Set();
  const stack = [[r, c]];
  const out = [];
  seen.add(r + ',' + c);
  while (stack.length) {
    const [cr, cc] = stack.pop();
    out.push([cr, cc]);
    const nb = [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]];
    for (const [nr, ncc] of nb) {
      if (nr < 0 || nr >= ROWS || ncc < 0 || ncc >= COLS) continue;
      const key = nr + ',' + ncc;
      if (seen.has(key)) continue;
      const t = grid[nr][ncc];
      if (t && t.e === e) { seen.add(key); stack.push([nr, ncc]); }
    }
  }
  return out;
}

// ── DIGIMENT: tap 1 ô → ×2 (charge), tốn 1 energy, rồi tự dò & merge cascade ──
function chargeTile(r, c) {
  const t = grid[r][c];
  if (!t) return;
  // Chạm ô đã ở giá trị MAX → charge sẽ tạo ô lẻ vượt MAX, không ghép được (phí) → CẤM:
  // lắc ô + nháy to số MAX trên ladder để user hiểu.
  if (t.e >= maxReached) { t.sh = SHAKE_TIME; maxFlash = MAXFLASH_DUR; sndNope(); return; }
  if (energy < TAP_COST) { sndNope(); return; }   // hết energy → không charge được nữa
  energy -= TAP_COST; updateEnergy();
  t.e += 1;                                        // ×2 giá trị
  t.pop = POP_TIME;
  if (t.e > maxReached) maxReached = t.e;
  burst(t.x, t.y, pal(t.e).f, 6);                  // (bỏ viền vuông lúc tap — dùng viền cụm cho merge)
  sndCharge(t.e);
  combo = 0;
  chargeRoot = { r, c };
  resolving = true;
  resolveBoard();                                  // bắt đầu cascade (nếu có cụm ≥3)
  // tap KHÔNG tạo merge → hiện viền ripple cho riêng ô vừa ×2 (coi 1 ô như cụm 1 phần tử)
  if (!pendingMerge) tapFrame = { cells: [[r, c]], e: t.e, t: 0, dur: TAP_FRAME_DUR };
}

// Đích merge của 1 cụm: ưu tiên ô vừa charge (nếu thuộc cụm), nếu không lấy ô THẤP nhất (gần đáy & gần giữa cột).
function makeGroupInfo(group) {
  let tr = group[0][0], tc = group[0][1], bestScore = -Infinity;
  for (const [r, c] of group) {
    const s = r * 100 - Math.abs(c - (COLS - 1) / 2);
    if (s > bestScore) { bestScore = s; tr = r; tc = c; }
  }
  if (chargeRoot) for (const [r, c] of group) if (r === chargeRoot.r && c === chargeRoot.c) { tr = r; tc = c; break; }
  return { group, tr, tc, e: grid[tr][tc].e };
}
// Tìm 1 cụm để merge: ưu tiên cụm chứa ô vừa charge, sau đó cụm LỚN nhất trên bàn (từ đáy lên).
function findMergeGroup() {
  if (chargeRoot) {
    const t = grid[chargeRoot.r] && grid[chargeRoot.r][chargeRoot.c];
    if (t) { const g = floodGroup(chargeRoot.r, chargeRoot.c); if (g.length >= MERGE_MIN) return makeGroupInfo(g); }
  }
  const seen = new Set(); let best = null;
  for (let r = ROWS - 1; r >= 0; r--)
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c]; if (!t || seen.has(r + ',' + c)) continue;
      const g = floodGroup(r, c);
      for (const [gr, gc] of g) seen.add(gr + ',' + gc);
      if (g.length >= MERGE_MIN && (!best || g.length > best.group.length)) best = makeGroupInfo(g);
    }
  return best;
}
// 1 bước cascade: tìm cụm → chạy animation chuẩn bị. Hết cụm → kết thúc cascade.
function resolveBoard() {
  const info = combo < 60 ? findMergeGroup() : null;   // guard: cascade rất dài (cực hiếm) → dừng an toàn
  if (!info) {
    // hết cụm → nếu MIN cần tiến: bắt đầu pha "bay gom về chip MIN" 0.25s (updateMinAdvance lo refill + tiếp)
    if (combo < 60 && startMinAdvance()) return;       // resolving vẫn true suốt pha bay
    resolving = false; chargeRoot = null; afterBoardChanged(); return;
  }
  pendingMerge = { group: info.group, tr: info.tr, tc: info.tc, e: info.e, t: 0 };
  for (const [gr, gc] of info.group) {
    const tile = grid[gr][gc];
    if (gr === info.tr && gc === info.tc) { tile.mergeTarget = true; tile.mergeScale = 1; }   // ô đích: thu nhỏ tại chỗ
    else { tile.merging = true; tile.mergeScale = 1; tile.fromX = tile.x; tile.fromY = tile.y; }  // ô bị gộp: hút về đích
  }
  blip(360 + info.e * 28, 0.08, 'sine', 0.10);
}

// Cập nhật pha chuẩn bị mỗi frame; xong thì commitMerge().
function updatePendingMerge(dt) {
  if (!pendingMerge) return;
  const pm = pendingMerge;
  pm.t += dt;
  const p = Math.min(1, pm.t / MERGE_PREP_TIME);
  const tx = cellCX(pm.tc), ty = cellCY(pm.tr);
  const ein = p * p;                            // ease-in → cảm giác bị hút vào tâm
  for (const [r, c] of pm.group) {
    const t = grid[r][c];
    if (!t) continue;
    if (r === pm.tr && c === pm.tc) {
      t.mergeScale = 1 - p * 0.5;               // ô được nhấn → 50%
    } else {
      t.x = t.fromX + (tx - t.fromX) * ein;     // hút về ô được nhấn
      t.y = t.fromY + (ty - t.fromY) * ein;
      t.mergeScale = 1 - p * 0.85;              // thu nhỏ dần (không xoay)
    }
  }
  if (pm.t >= MERGE_PREP_TIME) commitMerge();
}

// Pha 2: merge thật — gộp các ô (đã thu nhỏ) vào ô kết quả, pop + particle + gravity + refill.
function commitMerge() {
  const pm = pendingMerge;
  pendingMerge = null;
  const tr = pm.tr, tc = pm.tc;
  const target = grid[tr][tc];
  if (!target) return;
  const e = pm.e;
  const tx = cellCX(tc), ty = cellCY(tr);

  for (const [r, c] of pm.group) {
    if (r === tr && c === tc) continue;
    const tile = grid[r][c];
    if (!tile) continue;
    tile.merging = false;
    grid[r][c] = null;                         // đã bị hút vào tâm → biến mất
  }

  target.e = e + 1;
  target.mergeTarget = false; target.mergeScale = 1; target.pop = 0;
  target.grow = GROW_TIME;                     // phóng to từ 25% → bung ra thành số mới

  const newVal = valOf(target.e);
  combo += 1;                                   // mỗi bước cascade trong 1 lần tap → combo tăng dần
  const mult = combo;

  const gain = newVal * mult + pm.group.length;
  addScore(gain);

  // THƯỞNG ENERGY: MỖI merge +1 (kể cả merge lẻ combo 1) → tap merge lẻ net 0, cascade lời.
  const eGain = 1;
  addEnergy(eGain);

  burst(tx, ty, pal(target.e).f, Math.min(14, 6 + pm.group.length));
  addFloater(tx, ty - cell * 0.36, '+' + fmt(gain), '#ffffff', cell * 0.30);
  if (eGain > 0) addFloater(tx, ty - cell * 0.74, '+' + eGain + '⚡', '#8fd0ff', cell * 0.26);
  if (mult >= 2) addFloater(tx, ty - cell * 1.12, (COMBO_WORDS[Math.min(mult,7)] || 'COMBO!') + ' x' + mult, '#ffd23f', cell * 0.30);
  // rung nhẹ khi merge cụm lớn (≥5 ô) hoặc combo cao
  if (pm.group.length >= 5 || combo >= 3) pulseShake(0.12, Math.min(3.5, pm.group.length * 0.3 + combo * 0.2));
  sndMerge(target.e);

  if (target.e > maxReached) maxReached = target.e;   // mốc MAX mới (không còn thưởng energy)

  // CHƯA rơi vội — đợi số mới bung xong (GROW_TIME) rồi mới gravity + refill.
  postMerge = { t: 0 };
}

// Pha chờ: số mới đang bung; hết GROW_TIME mới cho các ô rơi xuống rồi TIẾP TỤC cascade.
function updatePostMerge(dt) {
  if (!postMerge) return;
  postMerge.t += dt;
  // ô mới bung (GROW_TIME) → đợi thêm POST_MERGE_WAIT → mới cho các ô rơi xuống
  if (postMerge.t >= GROW_TIME + POST_MERGE_WAIT) {
    postMerge = null;
    collapseAndRefill();     // các ô bắt đầu rơi
    postFall = { t: 0 };     // đợi rơi XONG (FALL_TIME) rồi mới dò cụm kế → viền cụm combo x2+ không hiện sớm
  }
}

// Pha chờ rơi: các ô đang rơi xuống; hết FALL_TIME mới dò cụm tiếp theo.
function updatePostFall(dt) {
  if (!postFall) return;
  postFall.t += dt;
  if (postFall.t >= FALL_TIME) {
    postFall = null;
    resolveBoard();          // dò cụm tiếp (cascade) — hết cụm thì resolveBoard tự gọi afterBoardChanged
  }
}

function addEnergy(n) {
  if (n <= 0) return;
  energy = Math.min(ENERGY_MAX, energy + n);
  updateEnergy();
  sndEnergy();
}

function addScore(n) {
  score += n;
  elScore.textContent = fmt(score);
  if (score > best) { best = score; elBest.textContent = fmt(best); }
}

/* ============================================================
 * 9. MIN ADVANCE + GAME-OVER CHECK
 * ========================================================== */
let lastSaveT = -1e9, lastSavedBest = -1;
function afterBoardChanged() {
  // startMinAdvance() đã chạy xong trong vòng resolveBoard (refill + giải nốt) → bàn sạch cụm khi tới đây.
  if (score > best) { best = score; elBest.textContent = fmt(best); }
  // persist best occasionally so a sudden kill doesn't lose progress (throttled)
  if (best > lastSavedBest && now() - lastSaveT > 1500) {
    lastSavedBest = best; lastSaveT = now(); saveGameState();
  }
  if (energy <= 0) triggerLose();    // hết energy = hết lượt tap → thua
}

// Thông số ladder dùng chung (đồng bộ với drawLadder): bề rộng chip, khoảng cách, số chip, bước trượt.
function ladderMetrics() {
  const lw = ladder.w;
  const chipW = Math.max(30, Math.min(46, lw / 9));
  const gapc = chipW * 0.28;
  const count = Math.max(3, Math.floor((lw + gapc) / (chipW + gapc)));
  return { chipW, gapc, count, step: chipW + gapc };
}
// Chỉ số 'start' của cửa sổ ladder với một giá trị minExp cho trước.
function ladderStartFor(minE) {
  const { count } = ladderMetrics();
  let start = minE;
  if (maxReached >= start + count) start = maxReached - count + 2;
  return Math.max(1, start);
}

// Vị trí (tâm) chip MIN hiện tại trên ladder — để các ô bị dọn "gom về" đó.
function minChipPos() {
  const lx = ladder.x, lw = ladder.w, ly = ladder.y, lh = ladder.h;
  const chipW = Math.max(30, Math.min(46, lw / 9));
  const gapc = chipW * 0.28;
  const count = Math.max(3, Math.floor((lw + gapc) / (chipW + gapc)));
  let start = minExp;
  if (maxReached >= start + count) start = maxReached - count + 2;
  start = Math.max(1, start);
  const totalW = count * chipW + (count - 1) * gapc;
  const cx0 = lx + (lw - totalW) / 2;
  const chipH = Math.min(chipW * 0.85, lh - 16);
  const i = minExp - start;
  return { x: cx0 + i * (chipW + gapc) + chipW / 2, y: ly + 2 + chipH / 2 };
}

// MIN cần tiến → ô < MIN-mới "bay gom" về chip MIN cũ (0.25s). Trả true nếu bắt đầu pha bay.
function startMinAdvance() {
  const desired = Math.max(1, maxReached - WINDOW);
  if (minExp >= desired) return false;
  const chip = minChipPos();   // chip MIN cũ (chưa đổi minExp)
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t && t.e < desired) {
        vfx.push({ e: t.e, x: t.x, y: t.y, tx: chip.x, ty: chip.y, t: 0, dur: 0.25 });   // bay về chip MIN
        grid[r][c] = null; n++;
      }
    }
  if (n === 0) { minExp = desired; return false; }   // không có ô nào để dọn → tiến luôn, không cần bay
  sndLevelUp();
  minAdvance = { phase: 'fly', t: 0, flyDur: 0.25, holdDur: 0.5, desired };
  return true;
}

// Pha 'fly' (0.25s): ô dưới bay gom vào chip MIN cũ. Pha 'hold' (0.25s): chip MIN cũ Ở LẠI nhấp nháy cho
// user kịp nhìn. Hết hold → reset ladder về min-max mới → ô mới rơi xuống → tiếp tục.
function updateMinAdvance(dt) {
  if (!minAdvance) return;
  minAdvance.t += dt;
  if (minAdvance.phase === 'fly') {
    if (minAdvance.t >= minAdvance.flyDur) { minAdvance.phase = 'hold'; minAdvance.t = 0; }
    return;
  }
  if (minAdvance.t >= minAdvance.holdDur) {
    const before = ladderStartFor(minExp);
    minExp = minAdvance.desired;     // ladder reset về MIN-MAX mới
    minAdvance = null;
    const delta = ladderStartFor(minExp) - before;   // cửa sổ nhích phải bao nhiêu chip
    if (delta > 0) ladderSlide = { t: 0, dur: 0.28, dx: delta * ladderMetrics().step };  // trượt sang trái vào vị trí mới
    addFloater(W / 2, ladder.y + ladder.h + cell * 0.6, 'MIN ▲ ' + fmt(valOf(minExp)), '#8fd0ff', 22);
    collapseAndRefill();             // ô mới rơi xuống lấp chỗ trống
    resolveBoard();                  // tiếp tục (kết thúc nếu hết việc)
  }
}

function anyMoves() {
  const seen = new Set();
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (!t || seen.has(r + ',' + c)) continue;
      const e = t.e;
      let size = 0;
      const stack = [[r, c]];
      seen.add(r + ',' + c);
      while (stack.length) {
        const [cr, cc] = stack.pop();
        size++;
        for (const [nr, nc] of [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]]) {
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          const k = nr + ',' + nc;
          if (seen.has(k)) continue;
          const u = grid[nr][nc];
          if (u && u.e === e) { seen.add(k); stack.push([nr, nc]); }
        }
      }
      if (size >= MERGE_MIN) return true;
    }
  return false;
}

// ── Icon bàn tay chỉ dẫn (Digiment) ──
// Liệt kê các ô mà nếu TAP (×2) sẽ tạo được 1 cụm ≥ MERGE_MIN cùng số → gợi ý nước charge tốt.
function chargeTargets() {
  const out = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c]; if (!t) continue;
      const old = t.e; t.e = old + 1;               // giả lập ×2
      const g = floodGroup(r, c);
      t.e = old;                                     // hoàn lại
      if (g.length >= MERGE_MIN) out.push([r, c]);
    }
  return out;
}
// chọn 1 ô để chỉ, ưu tiên KHÁC ô hiện tại → trả { center, cells }
function pickHand(avoid) {
  let ts = chargeTargets(); if (!ts.length) return null;
  if (avoid && ts.length > 1) {
    const others = ts.filter(([r, c]) => r !== avoid.r || c !== avoid.c);
    if (others.length) ts = others;
  }
  const [r, c] = ts[Math.floor(Math.random() * ts.length)];
  return { center: { r, c }, cells: [[r, c]] };
}
// gán kết quả pickHand vào handCell (tâm) + handCluster (Set ô để animate)
function setHand(h) {
  handCell = h ? h.center : null;
  handCluster = h ? new Set(h.cells.map(([r, c]) => r + ',' + c)) : null;
}
function updateHand(dt) {
  // ẩn khi đang chạy cascade / thua / hết game
  if (gameOver || losing || resolving || pendingMerge || postMerge) { handCell = null; handCluster = null; return; }
  handIdle += dt;
  if (handIdle >= HAND_SWITCH) {            // tới hạn → hiện lần đầu hoặc chỉ sang ô khác
    setHand(pickHand(handCell));
    handIdle = 0;
  }
  // ô đang chỉ đã biến mất (bàn cờ đổi) → chọn lại ngay
  if (handCell && !grid[handCell.r][handCell.c]) setHand(pickHand(null));
  handAnim += dt;
}

function triggerLose() {
  if (gameOver || losing) return;
  losing = true; loseTimer = LOSE_FLASH;
}

function finishGameOver() {
  gameOver = true; losing = false; resolving = false;
  if (score > best) best = score;
  saveGameState();           // gameOver → chỉ lưu best → mở lại = ván mới
  sendMessage('game_result', { result: null, showModal: false });   // non-level: game tự lo màn kết quả
  sndGameOver();
  showOverlay();
}

/* ============================================================
 * 11. FX
 * ========================================================== */
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    // phân bố đều quanh vòng (nhiễu rất nhẹ) → bung sạch, không tản loạn
    const a = (i / n) * TAU + (Math.random() - 0.5) * 0.25;
    const sp = 240 + Math.random() * 130;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0, maxLife: 0.40 + Math.random() * 0.14,
      size: cell * (0.12 + Math.random() * 0.04), color,    // mảnh vuông theo cỡ ô
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 6,
    });
  }
}
function addFloater(x, y, text, color, size) {
  floaters.push({ x, y, text, color, size: size || 20, life: 0, maxLife: 0.95 });
}
// viền vuông lan tỏa nhẹ (phạm vi bé) quanh ô vừa merge ra số mới
function spawnSquareRing(x, y, color) {
  const ts = cell * 0.86;                                   // = tileSize trong render
  rings.push({ x, y, s0: ts * 0.95, max: ts * 1.5, t: 0, dur: 0.4, color, lw: 3 });
}
function pulseShake(dur, mag) { shake.t = dur; shake.dur = dur; shake.mag = mag; }

/* ============================================================
 * 12. INPUT
 * ========================================================== */
function cellAt(px, py) {
  if (px < gx0 || py < gy0) return null;
  const c = Math.floor((px - gx0) / cell);
  const r = Math.floor((py - gy0) / cell);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return { r, c };
}
function onPointerDown(ev) {
  ensureAudio();
  if (gameOver || paused || losing || resolving || pendingMerge || postMerge) return;   // khoá thao tác khi đang chạy cascade
  const rect = elGame.getBoundingClientRect();
  const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
  const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
  const cellPos = cellAt(px, py);
  if (!cellPos) return;
  handIdle = 0; handCell = null; handCluster = null;   // chạm vào 1 ô → ẩn bàn tay, đếm lại
  chargeTile(cellPos.r, cellPos.c);                    // tap = ×2 + cascade merge
}
elGame.addEventListener('pointerdown', onPointerDown);

/* ============================================================
 * 13. RENDER
 * ========================================================== */
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);

// vẽ bàn tay chỉ vào ô handCell, có nhịp "nhấn" + vòng lan
function drawHand(g) {
  if (!handCell) return;
  const t = grid[handCell.r] && grid[handCell.r][handCell.c]; if (!t) return;
  if (!(HAND_IMG.complete && HAND_IMG.naturalWidth)) return;
  const cx = cellCX(handCell.c), cy = cellCY(handCell.r);
  const cyc = HAND_CYC, ph = (handAnim % cyc) / cyc;
  const bob = -Math.cos(ph * TAU);            // -1 (cao nhất) → +1 (thấp nhất) → -1 trong 1 nhịp
  const press = Math.max(0, bob);             // 0..1, mạnh nhất khi tay xuống thấp
  // viền VUÔNG lan khi tay nhấn xuống
  if (press > 0.04) {
    g.save();
    g.globalAlpha = 0.45 * (1 - press);
    g.strokeStyle = '#ffd23f'; g.lineWidth = Math.max(2, cell * 0.045);
    const rr = cell * (0.30 + press * 0.38);          // bán-cạnh viền vuông
    roundRect(g, cx - rr, cy - rr, rr * 2, rr * 2, rr * 0.4);
    g.stroke();
    g.restore();
  }
  // ảnh bàn tay: đầu ngón trỏ ~ tâm ô (neo 0.20w/0.07h như 2048), dao động LÊN–XUỐNG trong 1 nhịp
  const w = cell;
  const h = w * (HAND_IMG.naturalHeight / HAND_IMG.naturalWidth);
  g.drawImage(HAND_IMG, cx - 0.20 * w, cy - 0.07 * h + bob * cell * 0.16, w, h);
}

function drawTileFace(g, cx, cy, size, e, scale) {
  const p = pal(e);
  const s = size * (scale || 1);
  const x = cx - s / 2, y = cy - s / 2;
  const rad = s * 0.18;
  // flat solid face — không gradient/shine/shade
  roundRect(g, x, y, s, s, rad);
  g.fillStyle = p.f; g.fill();
  // number (flat, một màu xám đậm, không đổ bóng)
  const label = fmt(valOf(e));
  let fpx = s * 0.48;                 // to hơn (trước 0.44) → dễ đọc, nhất là màn hẹp
  g.font = fpx + "px 'Changa One', sans-serif";
  const maxW = s * 0.80;
  const w = g.measureText(label).width;
  if (w > maxW) fpx *= maxW / w;
  g.font = fpx + "px 'Changa One', sans-serif";
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = p.n;
  g.fillText(label, cx, cy + s * 0.03);
}

function drawCrown(g, cx, topY, h) {
  const w = h * 1.5;
  g.save();
  g.fillStyle = '#ffd23f';
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(cx - w / 2, topY + h);
  g.lineTo(cx - w / 2, topY + h * 0.35);
  g.lineTo(cx - w / 4, topY + h * 0.7);
  g.lineTo(cx, topY);
  g.lineTo(cx + w / 4, topY + h * 0.7);
  g.lineTo(cx + w / 2, topY + h * 0.35);
  g.lineTo(cx + w / 2, topY + h);
  g.closePath();
  g.fill(); g.stroke();
  g.restore();
}

function drawLadder(g) {
  const lx = ladder.x, ly = ladder.y, lw = ladder.w, lh = ladder.h;
  const chipMax = 46, chipMin = 30;
  let chipW = Math.max(chipMin, Math.min(chipMax, lw / 9));
  const gapc = chipW * 0.28;
  let count = Math.max(3, Math.floor((lw + gapc) / (chipW + gapc)));
  // slide window so both min and max markers stay visible
  let start = minExp;
  if (maxReached >= start + count) start = maxReached - count + 2;
  start = Math.max(1, start);
  const totalW = count * chipW + (count - 1) * gapc;
  // anim trượt: bắt đầu lệch phải +dx (như vị trí cũ) rồi ease về 0 → cảm giác kéo cả thanh sang trái
  let slideOff = 0;
  if (ladderSlide) { const k = Math.min(1, ladderSlide.t / ladderSlide.dur); slideOff = ladderSlide.dx * (1 - k) * (1 - k); }
  let cx = lx + (lw - totalW) / 2 + slideOff;
  const chipH = Math.min(chipW * 0.85, lh - 16);   // cao ~0.85×rộng (cao hơn cũ), chừa chỗ cho nhãn
  const cy = ly + 2;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < count; i++) {
    const e = start + i;
    const reached = e <= maxReached && e >= minExp;
    const p = pal(e);
    // dash connector
    if (i > 0) {
      g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(cx - gapc, cy + chipH / 2); g.lineTo(cx, cy + chipH / 2); g.stroke();
    }
    // Nháy to ô MAX khi user vừa chạm nhầm ô đã ở MAX
    const isMax = (e === maxReached);
    const isMin = (e === minExp);
    let sc = 1, pulse = 0, glowCol = '255,236,120';
    if (isMax && maxFlash > 0) {
      const k = maxFlash / MAXFLASH_DUR;                       // 1 → 0
      pulse = Math.abs(Math.sin((1 - k) * Math.PI * 3)) * k;   // nháy ~3 nhịp, tắt dần
      sc = 1 + 0.45 * pulse;
    }
    // Chip MIN cũ nhấp nháy suốt pha MIN-tiến (phình dần khi ô bay vào, rồi 1 nhịp lúc "ở lại")
    if (isMin && minAdvance) {
      pulse = minAdvance.phase === 'hold'
        ? Math.abs(Math.sin((minAdvance.t / minAdvance.holdDur) * Math.PI)) // 1 nhịp lúc giữ lại
        : (minAdvance.t / minAdvance.flyDur) * 0.7;                          // phình dần khi ô bay tới
      sc = 1 + 0.45 * pulse;
      glowCol = '143,208,255';
    }
    const ccx = cx + chipW / 2, ccy = cy + chipH / 2;
    g.save();
    if (sc !== 1) { g.translate(ccx, ccy); g.scale(sc, sc); g.translate(-ccx, -ccy); }
    roundRect(g, cx, cy, chipW, chipH, chipH * 0.28);
    g.fillStyle = reached ? p.f : 'rgba(255,255,255,0.10)';
    g.fill();
    if (pulse > 0) { g.lineWidth = 3; g.strokeStyle = 'rgba(' + glowCol + ',' + (0.4 + 0.6 * pulse) + ')'; g.stroke(); }
    // value
    let fpx = chipH * 0.42;
    g.font = fpx + "px 'Changa One', sans-serif";
    const label = fmt(valOf(e));
    const maxW = chipW * 0.82;
    const w = g.measureText(label).width;
    if (w > maxW) fpx *= maxW / w;
    g.font = fpx + "px 'Changa One', sans-serif";
    g.fillStyle = reached ? p.n : 'rgba(255,255,255,0.5)';
    g.fillText(label, ccx, ccy);
    g.restore();
    // min / max labels (ngoài transform; chữ MAX phình theo pulse)
    g.font = (isMax && pulse > 0 ? (10 + 6 * pulse) : 10) + "px 'Changa One', sans-serif";
    if (e === minExp) { g.fillStyle = '#8fd0ff'; g.fillText('MIN', cx + chipW / 2, cy + chipH + 9); }
    if (isMax) { g.fillStyle = '#ffd23f'; g.fillText('MAX', cx + chipW / 2, cy + chipH + 9); }
    cx += chipW + gapc;
  }
}

// VIỀN VÀNG MỀM bo góc quanh cụm đang merge: truy vết đúng BIÊN NGOÀI (bỏ cạnh chung bên trong),
// bo tròn các góc bằng arcTo → một đường viền liền mạch, mảnh, mềm. HIỆN DẦN trong pha hút.
// Vẽ viền ripple cho MỘT NHÓM Ô bất kỳ (1 ô hay cả cụm): nhỏ→lan ra + mờ dần, màu theo giá trị.
//   cells: [[r,c],...] ; exp: giá trị (chọn màu) ; prog: 0→1 (tiến độ hiệu ứng)
function drawCellsRipple(g, cells, exp, prog) {
  if (!cells || !cells.length) return;
  const group = cells;
  const inSet = new Set(group.map(([r, c]) => r + ',' + c));
  const h = cell / 2, K = v => Math.round(v);
  // gom các cạnh biên thành đồ thị điểm→điểm (mỗi điểm = góc lưới)
  const pts = new Map();
  const node = (x, y) => { const k = K(x) + ',' + K(y); let n = pts.get(k); if (!n) { n = { x, y, nb: [] }; pts.set(k, n); } return n; };
  const edge = (ax, ay, bx, by) => { const A = node(ax, ay), B = node(bx, by); A.nb.push(B); B.nb.push(A); };
  for (const [r, c] of group) {
    const x0 = cellCX(c) - h, x1 = cellCX(c) + h, y0 = cellCY(r) - h, y1 = cellCY(r) + h;
    if (!inSet.has((r - 1) + ',' + c)) edge(x0, y0, x1, y0);   // cạnh trên (trên không thuộc cụm)
    if (!inSet.has((r + 1) + ',' + c)) edge(x0, y1, x1, y1);   // dưới
    if (!inSet.has(r + ',' + (c - 1))) edge(x0, y0, x0, y1);   // trái
    if (!inSet.has(r + ',' + (c + 1))) edge(x1, y0, x1, y1);   // phải
  }
  // nối các cạnh thành vòng kín
  const ek = (A, B) => { const a1 = K(A.x) + ',' + K(A.y), b1 = K(B.x) + ',' + K(B.y); return a1 < b1 ? a1 + '|' + b1 : b1 + '|' + a1; };
  const used = new Set(), loops = [];
  for (const start of pts.values()) for (const first of start.nb) {
    if (used.has(ek(start, first))) continue;
    const loop = [start]; let prev = start, cur = first; used.add(ek(start, first));
    while (cur !== start) {
      loop.push(cur);
      const nxt = cur.nb.find(n => n !== prev && !used.has(ek(cur, n)));
      if (!nxt) break;
      used.add(ek(cur, nxt)); prev = cur; cur = nxt;
    }
    if (loop.length >= 4) loops.push(loop);
  }
  const rr = cell * 0.26;   // bán kính bo góc
  // tâm cụm để phóng to/thu nhỏ quanh đó
  let cx = 0, cy = 0; for (const [r, c] of group) { cx += cellCX(c); cy += cellCY(r); } cx /= group.length; cy /= group.length;
  const pp = Math.min(1, prog);
  const ep = 1 - (1 - pp) * (1 - pp);          // ease-out
  // 1 ô cần bắt đầu to hơn & lan mạnh hơn cụm (cụm vốn đã rộng sẵn)
  const scl = (group.length === 1) ? (0.7 + 0.75 * ep) : (0.4 + 0.5 * ep);   // nhỏ (ôm sát) → lan ra
  const alpha = 0.9 * (1 - pp);                // mờ dần khi lan ra
  // màu viền theo MÀU giá trị, sáng hơn chút cho nổi
  const cc = hexToRgb(pal(exp).f);
  const cr = Math.min(255, cc.r + 40), cg = Math.min(255, cc.g + 40), cb = Math.min(255, cc.b + 40);
  g.save();
  g.translate(cx, cy); g.scale(scl, scl); g.translate(-cx, -cy);   // phóng quanh tâm cụm
  g.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + alpha + ')';   // theo màu cụm
  g.lineWidth = Math.max(2, cell * 0.05) / scl;          // chia scl → giữ độ dày nhìn không đổi
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const loop of loops) {
    g.beginPath();
    g.moveTo((loop[0].x + loop[1].x) / 2, (loop[0].y + loop[1].y) / 2);  // bắt đầu giữa cạnh (tránh đúng góc)
    for (let i = 1; i <= loop.length; i++) {
      const v = loop[i % loop.length], n = loop[(i + 1) % loop.length];
      g.arcTo(v.x, v.y, n.x, n.y, rr);   // bo góc tại mỗi đỉnh
    }
    g.closePath();
    g.stroke();
  }
  g.restore();
}

function render(dt) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake.t > 0) {
    const k = shake.t / shake.dur;
    ctx.translate((Math.random()*2-1)*shake.mag*k, (Math.random()*2-1)*shake.mag*k);
  }

  drawLadder(ctx);

  // Khay chơi MỜ: panel bo góc bán trong suốt + slot mờ từng ô → "đựng" lưới số cho đỡ thô.
  // Kích thước suy từ gx0/gy0/cell (relayout căn giữa ngang) → tự responsive theo bề ngang.
  const pad = cell * 0.12;
  const bx = gx0 - pad, by = gy0 - pad, bw = COLS*cell + pad*2, bh = ROWS*cell + pad*2, br = cell*0.3;
  const tileSize = cell * 0.86;
  roundRect(ctx, bx, by, bw, bh, br);
  ctx.fillStyle = 'rgba(3, 26, 44, 0.45)';            // nền khay mờ (tông xanh đậm của game)
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.10)';   // viền sáng mảnh
  ctx.stroke();
  // slot mờ cho từng ô → cảm giác có ngăn chứa (lộ ra ở khe khi ô đang rơi)
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      roundRect(ctx, cellCX(c) - tileSize/2, cellCY(r) - tileSize/2, tileSize, tileSize, tileSize*0.18);
      ctx.fill();
    }

  // clip tiles vào vùng bàn để ô mới đang rơi từ trên không lộ ra ngoài.
  ctx.save();
  roundRect(ctx, bx, by, bw, bh, br);
  ctx.clip();
  // ease + draw tiles
  const k = Math.min(1, dt * SETTLE);
  const onTop = [];   // ô đặc biệt (merge/grow/pop/appear) vẽ sau cùng cho nổi
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (!t) continue;
      if (t.merging) { onTop.push(t); continue; }   // vị trí do updatePendingMerge set (đang bị hút) → KHÔNG ease
      const tx = cellCX(c), ty = cellCY(r);
      t.x += (tx - t.x) * k;
      t.y += (ty - t.y) * k;
      if (t.pop > 0)  t.pop  = Math.max(0, t.pop - dt);
      if (t.appear > 0) t.appear = Math.max(0, t.appear - dt);
      if (t.grow > 0) t.grow = Math.max(0, t.grow - dt);
      if (t.sh > 0)   t.sh   = Math.max(0, t.sh - dt);
      if (t.mergeTarget || t.pop > 0 || t.appear > 0 || t.grow > 0) onTop.push(t);
      else {
        const sx = shakeOffset(t);
        if (handCluster && handCluster.has(r + ',' + c)) {
          // ô thuộc cụm bàn tay đang chỉ → nháy to + xoay theo ĐỘ SÂU của bàn tay
          // press: 0 khi tay cao nhất → 1 khi tay xuống sâu nhất (cùng pha với bob trong drawHand)
          const ph = (handAnim % HAND_CYC) / HAND_CYC;
          const press = 0.5 - 0.5 * Math.cos(ph * TAU);
          const sc = 1 + 0.09 * press;        // to nhất khi tay nhấn sâu nhất
          const rot = (2 * Math.PI / 180) * press;   // góc xoay max = 3° khi tay sâu nhất, về 0 khi tay cao nhất
          ctx.save();
          ctx.translate(t.x + sx, t.y);
          ctx.rotate(rot);
          drawTileFace(ctx, 0, 0, tileSize, t.e, sc);
          ctx.restore();
        } else {
          drawTileFace(ctx, t.x + sx, t.y, tileSize, t.e, 1);
        }
      }
    }
  for (const t of onTop) {
    let scale = 1;
    if (t.merging || t.mergeTarget) {
      scale = t.mergeScale;                                   // pha chuẩn bị: thu nhỏ
    } else if (t.grow > 0) {
      scale = 0.5 + 0.5 * easeOutBack(1 - t.grow / GROW_TIME);  // bung ra từ 50%
    } else if (t.pop > 0) {
      scale = 1 + 0.22 * Math.sin((1 - t.pop / POP_TIME) * Math.PI);
    }
    drawTileFace(ctx, t.x, t.y, tileSize, t.e, scale);
  }

  // viền ripple: cụm đang merge (nếu có) + cú tap-đơn (charge thành công không tạo merge)
  if (pendingMerge && pendingMerge.group.length)
    drawCellsRipple(ctx, pendingMerge.group, pendingMerge.e, pendingMerge.t / MERGE_PREP_TIME);
  if (tapFrame)
    drawCellsRipple(ctx, tapFrame.cells, tapFrame.e, tapFrame.t / tapFrame.dur);

  ctx.restore();   // unclip

  // ô đang "bay" (MIN tiến lên → gom về chip MIN trên ladder) — vẽ NGOÀI clip để bay lên tới ladder
  for (const v of vfx) {
    const pr = Math.min(1, v.t / v.dur);
    const ease = pr * pr;
    const x = v.x + (v.tx - v.x) * ease;
    const y = v.y + (v.ty - v.y) * ease;
    const sc = 1 - pr * 0.6;                  // thu nhỏ dần khi gom về chip
    drawTileFace(ctx, x, y, tileSize, v.e, sc);
  }

  // square rings — viền vuông lan tỏa khi merge ra số mới
  for (const rg of rings) {
    const k = Math.min(1, rg.t / rg.dur);
    const e = 1 - (1 - k) * (1 - k);                 // ease-out: bung nhanh rồi giãn chậm
    const s = rg.s0 + (rg.max - rg.s0) * e;
    ctx.globalAlpha = Math.max(0, 1 - k);            // mờ dần
    ctx.lineWidth = rg.lw;
    ctx.strokeStyle = rg.color;
    roundRect(ctx, rg.x - s / 2, rg.y - s / 2, s, s, s * 0.2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // particles — mảnh vuông bung ra, co nhỏ & mờ dần
  for (const p of particles) {
    const k = p.life / p.maxLife;
    ctx.globalAlpha = Math.max(0, 1 - k);
    const s = p.size * (1 - k * 0.55);          // co nhỏ dần
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    roundRect(ctx, -s / 2, -s / 2, s, s, s * 0.12);   // góc sắc → hạt vuông (trước tròn do 0.3)
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // floaters
  for (const f of floaters) {
    const a = 1 - f.life / f.maxLife;
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = f.size + "px 'Changa One', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillText(f.text, f.x + 1, f.y + 1.5);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // tool hint (khi dùng booster) — ưu tiên; nếu không, đầu màn (Score=0) hiện hướng dẫn
  if (hintT > 0 && hintText) {
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.font = hintFont + "px 'Changa One', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const ty = hintY;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(hintText, W/2+1, ty+1);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(hintText, W/2, ty);
    ctx.globalAlpha = 1;
  } else if (score === 0 && !gameOver && !losing) {
    const guide = 'Tap a tile to ×2 — line up 3 to merge';
    ctx.font = hintFont + "px 'Changa One', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(guide, W/2+1, hintY+1);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(guide, W/2, hintY);
  }

  // icon bàn tay chỉ dẫn (vẽ trên cùng các ô)
  drawHand(ctx);

  // losing flash
  if (losing) {
    const blinkOn = Math.floor(loseTimer * 4) % 2 === 0;
    if (blinkOn) {
      ctx.font = "30px 'Changa One', sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff5276';
      ctx.fillText('OUT OF ENERGY', W/2, gy0 + ROWS*cell/2);
    }
  }

  ctx.restore();
}

function stepFx(dt) {
  if (maxFlash > 0) maxFlash = Math.max(0, maxFlash - dt);
  if (ladderSlide) { ladderSlide.t += dt; if (ladderSlide.t >= ladderSlide.dur) ladderSlide = null; }
  if (tapFrame) { tapFrame.t += dt; if (tapFrame.t >= tapFrame.dur) tapFrame = null; }
  for (let i = vfx.length - 1; i >= 0; i--) { vfx[i].t += dt; if (vfx[i].t >= vfx[i].dur) vfx.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t >= rings[i].dur) rings.splice(i, 1); }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.90; p.vy *= 0.90;            // ma sát vừa → văng xa rồi êm lại, không "rơi"
    p.vy += 90*dt;                         // trọng lực rất nhẹ
    p.rot += p.vr*dt;
    if (p.life >= p.maxLife) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.life += dt; f.y -= 34*dt;
    if (f.life >= f.maxLife) floaters.splice(i, 1);
  }
  if (shake.t > 0) shake.t = Math.max(0, shake.t - dt);
  // hint stays visible while a tool is active (cleared explicitly via setHint(''))
}

/* ============================================================
 * 14. MAIN LOOP
 * ========================================================== */
function frame(ts) {
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  if (!Number.isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;

  if (!paused) {
    updatePendingMerge(dt);
    updatePostMerge(dt);
    updatePostFall(dt);
    updateMinAdvance(dt);
    updateHand(dt);
    stepFx(dt);
    if (losing) {
      loseTimer -= dt;
      if (loseTimer <= 0) finishGameOver();
    }
    render(dt);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
 * 15. LAYOUT
 * ========================================================== */
const hudBack = document.getElementById('back-btn');
const hudMute = document.getElementById('mute-btn');
const hudScores = document.getElementById('hud-scores');
const energyBar = document.getElementById('energy-bar');

function safeTop() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sat');
  return parseFloat(v) || 0;
}
function relayout() {
  const rect = elGame.getBoundingClientRect();
  const cssW = rect.width, cssH = rect.height;
  if (cssW <= 0 || cssH <= 0) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  elGame.width = Math.round(cssW*DPR);
  elGame.height = Math.round(cssH*DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = cssW; H = cssH;

  const topInset = Math.max(getStatusBarHeight(), safeTop()) + 8;
  hudScores.style.top = topInset + 'px';
  // nút Back/Sound: icon vuông, hơi nhỏ hơn chiều cao ô (92%)
  const pillH = Math.round(hudScores.getBoundingClientRect().height);
  const btnSize = Math.round(pillH * 0.92);
  hudBack.style.setProperty('--surface-height', btnSize + 'px');
  hudMute.style.setProperty('--surface-height', btnSize + 'px');
  hudMute.style.setProperty('--surface-font-size', Math.round(btnSize * 0.5) + 'px');
  // căn giữa theo CHIỀU CAO THẬT của nút (gồm cả lip đổ bóng ở đáy)
  const wrapH = hudBack.getBoundingClientRect().height || btnSize;
  const btnTop = topInset + Math.round((pillH - wrapH) / 2);
  hudBack.style.top = btnTop + 'px';
  hudMute.style.top = btnTop + 'px';
  // SCORE→sát Back, BEST→sát Sound; 2 ô bằng nhau & căn giữa
  const btnW = hudBack.getBoundingClientRect().width || btnSize;
  hudScores.style.width = Math.round(cssW - 2 * (12 + btnW + 18)) + 'px';
  const margin = Math.max(12, cssW * 0.04);
  const toolsTopY = cssH - Math.max(18, cssH * 0.025);   // không còn booster → lưới dùng tới gần đáy
  const areaW = cssW - margin*2;

  // THANH TIẾN TRÌNH (ladder) LÊN TRÊN — ngay dưới hàng Score/Best; cao đủ cho chip VUÔNG + nhãn
  ladder.x = margin;
  ladder.y = topInset + pillH + 10;
  ladder.w = areaW;
  const chipWest = Math.max(30, Math.min(46, areaW / 9));   // = chipW trong drawLadder
  ladder.h = Math.round(chipWest * 0.85 + 18);              // chip cao ~0.85×rộng (cao hơn cũ, thấp hơn vuông)

  // THANH ENERGY XUỐNG DƯỚI — ngay dưới ladder (căn giữa qua CSS)
  energyBar.style.top = (ladder.y + ladder.h + 6) + 'px';
  const energyBottom = energyBar.getBoundingClientRect().bottom;

  // Dải cố định cho dòng hint → lưới không lấn vào.
  hintFont = Math.round(Math.max(11, Math.min(16, cssW * 0.042)));
  const hintBand = hintFont + 12;

  // Lưới CĂN GIỮA khoảng [đáy energy .. đầu dải hint]
  const gridTop = energyBottom + 10;
  const areaBottom = toolsTopY - hintBand;
  const gridAreaH = Math.max(0, areaBottom - gridTop);
  // fit cells: vừa rộng vừa cao; CHẶN cỡ ô tối đa để màn to (iPad) không "bành" ra
  const MAX_CELL = 64;
  cell = Math.floor(Math.min(areaW / COLS, gridAreaH / ROWS, MAX_CELL));
  if (cell < 12) cell = 12;
  const gw = cell * COLS, gh = cell * ROWS;
  gx0 = Math.round(margin + (areaW - gw) / 2);
  gy0 = Math.round(gridTop + (gridAreaH - gh) / 2);

  // dòng hint nằm GIỮA dải đã chừa (giữa đáy vùng lưới và thanh booster) → không đè
  hintY = (areaBottom + toolsTopY) / 2;
}

let relayoutScheduled = false;
function scheduleRelayout() {
  if (relayoutScheduled) return;
  relayoutScheduled = true;
  requestAnimationFrame(() => {
    relayoutScheduled = false;
    redrawBackground();
    relayout();
  });
}
window.addEventListener('resize', scheduleRelayout);
window.addEventListener('orientationchange', scheduleRelayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleRelayout);

  energySegs.forEach((seg, i) => seg.classList.toggle('on', i < e));

}

/* ============================================================
 * 17. RESET / BOOT
 * ========================================================== */
function resetGame() {
  vfx = []; particles = []; floaters = []; rings = []; shake.t = 0; pendingMerge = null; postMerge = null; postFall = null; minAdvance = null; ladderSlide = null;
  minExp = 1; maxReached = 1;
  score = 0; combo = 0; energy = ENERGY_START;
  resolving = false; chargeRoot = null; maxFlash = 0; tapFrame = null;
  gameOver = false; paused = false; losing = false; loseTimer = 0;
  setHint('');
  handCell = null; handCluster = null; handIdle = HAND_SWITCH; handAnim = 0;   // hiện bàn tay ngay khi vào màn mới
  elScore.textContent = '0';
  elBest.textContent = fmt(best);
  overlay.classList.remove('show');
  relayout();
  fillInitial();
  updateEnergy();
  saveGameState();          // lưu ngay ván mới → mở lại không dính ván cũ
}

function bootGame() {
  const d = parseInitialData();
  if (d && typeof d.best === 'number') best = d.best;
  elBest.textContent = fmt(best);

  redrawBackground();
  relayout();
  if (d && Array.isArray(d.cells) && d.cells.length === ROWS * COLS && typeof d.maxReached === 'number') {
    restoreBoard(d);          // chơi tiếp ván đã lưu
  } else {
    energy = ENERGY_START;
    fillInitial();            // ván mới
  }
  elScore.textContent = fmt(score);
  updateEnergy();

  lastT = now();
  requestAnimationFrame(frame);
}

// safe-area-inset cho --sat
(function initSafeArea() {
  const s = document.createElement('style');
  s.textContent = ':root{--sat: env(safe-area-inset-top, 0px);}';
  document.head.appendChild(s);
})();

// đợi native inject (chống race), fallback 200ms
(function waitForNativeInjection() {
  const start = Date.now();
  (function check() {
    if (typeof window.currentLevel !== 'undefined' ||
        typeof window.data !== 'undefined' ||
        Date.now() - start > 200) {
      bootGame();
    } else {
      setTimeout(check, 10);
    }
  })();
})();
</script>
