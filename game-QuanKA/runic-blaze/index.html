<!--
  Runic Blaze — QuanKA
  Match-3 ENDLESS HIGH-SCORE (score-attack), THEME PHẲNG MATTE (flat). Single-file HTML (CSS + JS inline).
  Flat-matte: tile KHỐI MÀU ĐẶC (fill var(--c0..5)) + ICON TRẮNG phẳng; nền teal-slate dịu có sọc dọc nhẹ; panel/nút phẳng; hạt FX màu đặc — KHÔNG neon/glow/gloss/gradient/đổ bóng/nút-3D. Bảng màu matte (đỏ/lam/lục/hổ phách/tím/hồng) trên nền teal.
  Board: 7×7 | Runes: 5–6 màu | Base match-3 thoả mãn kiểu skydom (nổ liên hoàn), KHÔNG level, KHÔNG giới hạn lượt.
  HAZARD "Hắc Ấn" (cursed rune): định kỳ sinh 1 ô nguyền có SỐ đếm ngược, bất động/không ghép/không đổi;
    mỗi lượt −1; ghép/nổ CẠNH nó (4 hướng) → phá (+250). Về 0 mà chưa phá → detonate → THUA.
    Càng về sau: ngòi ngắn dần (7→3) + dày hơn + tối đa 2 cùng lúc.
  EVENTS: Arcane Surge (mốc 5k → tặng 1 Prism) · Blaze Storm (mốc 12k → biến vài ô thành Blaze rồi nổ dây chuyền).
  Specials: Match-4 → Blaze (nổ hàng/cột) · L/T → Nova (3×3, nổ 2 lần) · Match-5 → Prism (đốt 1 màu) · swap 2 special → combo.
  Khung header + vòng điểm-cao (self-popup, best live, Play Again→retry_level) mô phỏng skydom (HaND);
  thẩm mỹ + cơ chế Hắc Ấn/Events là của riêng runic-blaze. Tutorial dạy TRỰC TIẾP trên board thật (dựng sẵn thế cờ + chỉ nhận đúng nước được dạy), không còn carousel thẻ text.
  Engine: single rAF loop + tween engine dt-based (mượt 60/90/120/144Hz)
  Tuân thủ .claude/game-common.md (bridge §1.1 điểm-cao, i18n 23 ngôn ngữ), popup-common.md, zip-common.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Runic Blaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet" />
<style>
/* ── Reset + mobile tap fixes (game-common §UI) ───────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

:root {
  --ui-font: 'Google Sans Flex', system-ui, sans-serif;
  /* Background — calm flat teal-slate (matte) */
  --bg-a: #223438;
  --bg-b: #22353a;
  --bg-c: #26393e;
  /* Panels */
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.13);
  --chip-bg: rgba(18,32,36,.84);   /* nền chung mọi chip/thông báo nổi (giảm nhẹ opacity) */
  /* Text */
  --text: #eaf1f1;
  --text-soft: rgba(230,240,240,0.55);
  /* Rune fills — solid matte tiles (0 flame,1 water,2 nature,3 bolt,4 moon,5 star) */
  --c0: #df5b4c;
  --c1: #4a86c5;
  --c2: #5aa85f;
  --c3: #d89a3a;
  --c4: #8f6fbf;
  --c5: #d76f9c;
  --sat: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--ui-font);
  font-weight: 700;
  color: var(--text);
  background: repeating-linear-gradient(90deg, var(--bg-c) 0 32px, var(--bg-b) 32px 64px);
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

/* Tiếng Ả Rập: chữ nối liền — bỏ letter-spacing ở MỌI phần tử để không vỡ chữ */
body.lang-ar, body.lang-ar * { letter-spacing: 0 !important; }

/* ── Canvases: nền sao/ember (z0) + FX particles (z60, trên board dưới overlay) ── */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#fx-canvas { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

/* ── App wrapper ───────────────────────────────────────────────── */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Header chuẩn chung: Back | SCORE ★ | BEST ♛ | Volume ──────── */
#topbar {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  /* padding-top do JS bơm = max(statusBarHeight, env-safe) + 8 */
}

.hud-scores {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 6px;
}
.hud-pill {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  background: rgba(0,0,0,.2);
  border: 2px solid rgba(255, 255, 255, 0.16);
  border-radius: 14px;
  padding: 5px 8px 6px 4px;       /* icon ghim sát mép trái (chuẩn chung) */
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.pill-text { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 1 0 auto; }
.pill-ico {
  flex: 0 0 auto;
  width: clamp(16px, 4.8vw, 21px); height: clamp(16px, 4.8vw, 21px); display: block;
}
.hud-pill .label {
  font-size: clamp(9px, 3vw, 12px);
  font-family: system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-soft);
  line-height: 1.05;
  white-space: nowrap;
}
.hud-pill .value {
  font-size: clamp(15px, 4.6vw, 22px);
  line-height: 1.1;
  color: var(--text);
  white-space: nowrap;
  font-weight: 800;
}
#best-val { color: #ffd86b; }     /* BEST accent vàng (chuẩn chung) */

/* ── Mid section: HUD strip + board (đổi trục khi landscape) ──── */
#mid {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Board ─────────────────────────────────────────────────────── */
#board-outer {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 8px;
}

#board-wrap {
  position: relative;
  border-radius: 14px;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.07);
  padding: 4px;
  will-change: transform;
}

#grid-bg {
  position: absolute;
  inset: 4px;
  display: grid;
  pointer-events: none;
  z-index: 0;
}

.slot {
  border-radius: 7px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  margin: 2px;
}

#board {
  position: relative;
  z-index: 1;
  overflow: hidden;   /* clip tile refill rơi từ phía trên board */
}

/* ── Tiles ─────────────────────────────────────────────────────── */
.tile {
  position: absolute;
  border-radius: 10px;
  cursor: pointer;
  will-change: transform;
  -webkit-user-select: none;
  user-select: none;
}

.tile-inner {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.tile-inner svg {
  width: 72%;
  height: 72%;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

/* Nền khối đặc phẳng theo màu rune (viền màu mảnh, KHÔNG glow) */
.tile-0 .tile-inner { background:var(--c0); border:2px solid rgba(0,0,0,.18); }
.tile-1 .tile-inner { background:var(--c1); border:2px solid rgba(0,0,0,.18); }
.tile-2 .tile-inner { background:var(--c2); border:2px solid rgba(0,0,0,.18); }
.tile-3 .tile-inner { background:var(--c3); border:2px solid rgba(0,0,0,.18); }
.tile-4 .tile-inner { background:var(--c4); border:2px solid rgba(0,0,0,.18); }
.tile-5 .tile-inner { background:var(--c5); border:2px solid rgba(0,0,0,.18); }
/* Prism — tinh thể ám tím, viền ánh bạc-tím */
.tile-p .tile-inner {
  background:#6a6f96;
  border: 2px solid rgba(0,0,0,.18);
}

/* Cursed rune — ấn nguyền đỏ máu với số đếm ngược (không ghép/đổi được) */
.tile-cursed .tile-inner {
  background:#5f2a2f;
  border: 2px solid rgba(0,0,0,.22);
  cursor: default;
}
.tile-cursed .tile-inner svg { width: 86%; height: 86%; }
.tile-cursed.cursed-urgent .tile-inner { animation: cursePulse .5s ease-in-out infinite; }
/* Vừa sinh: nhấp 3 nhịp NGAY TRÊN Ô (thay cho toast text đã bỏ) */
@keyframes curseArrive {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}
.tile.curse-arrive .tile-inner { animation: curseArrive .3s ease-in-out 3; }
@keyframes cursePulse {
  0%, 100% { border-color: rgba(0,0,0,.22); background:#5f2a2f; }
  50%      { border-color: #ff7a6a; background:#7a3238; }
}
/* Hắc ấn về 0 → nổ: ô rung mạnh rồi phình đỏ (cho thấy CHÍNH nó gây thua) */
@keyframes curseBoom {
  0%   { transform: scale(1)    rotate(0deg);  background:#7a3238; }
  15%  { transform: scale(1.06) rotate(-4deg); }
  30%  { transform: scale(1.02) rotate(4deg);  background:#b23b32; }
  45%  { transform: scale(1.1)  rotate(-3deg); }
  60%  { transform: scale(1.04) rotate(3deg);  background:#e05a4d; }
  100% { transform: scale(1.55) rotate(0deg);  background:#e05a4d; opacity:0; }
}
.tile.curse-boom .tile-inner { animation: curseBoom .65s ease-in forwards; }

/* Special: nhịp mờ phẳng (opacity, KHÔNG glow) */
@keyframes specialBreath {
  0%, 100% { opacity: 1; }
  50%       { opacity: .86; }
}
.tile.kind-stripeH .tile-inner, .tile.kind-stripeV .tile-inner,
.tile.kind-nova .tile-inner, .tile.kind-prism .tile-inner {
  animation: specialBreath 1.6s ease-in-out infinite;
  /* viền TRẮNG dày — special nhận ra ngay từ xa (tile thường viền đen mảnh) */
  border-color: rgba(255,255,255,.92);
  border-width: 3px;
}
/* mũi tên stripe chạy shimmer */
@keyframes stripeSlide {
  0%   { opacity: .55; }
  50%  { opacity: 1; }
  100% { opacity: .55; }
}
.tile .stripe-arrows { animation: stripeSlide 1.1s ease-in-out infinite; }
/* icon nova phập phồng */
@keyframes novaPulse {
  0%, 100% { transform: scale(1);    opacity: .85; }
  50%       { transform: scale(1.12); opacity: 1; }
}
.tile.kind-nova svg .nova-ring { transform-origin: 50px 50px; animation: novaPulse 1.2s ease-in-out infinite; }

/* Selected state */
.tile.selected { z-index: 6; }
.tile.selected .tile-inner {
  transform: scale(1.1);
  border-width: 2px !important;
  box-shadow: 0 0 0 3px #ffffff;   /* gộp từ khối trùng selector ngay bên dưới */
}

/* Hint pulse — gợi ý nước đi */
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,240,120,0); }
  50%       { box-shadow: 0 0 0 4px rgba(255,240,120,.55); }
}
.tile.hint .tile-inner { animation: hintPulse 1.4s ease-in-out infinite; }

/* Shake (swap không hợp lệ) — dùng margin-left để không đè transform vị trí */
@keyframes tileShake {
  0%, 100% { margin-left: 0; }
  20%  { margin-left: -6px; }
  40%  { margin-left: 6px; }
  60%  { margin-left: -4px; }
  80%  { margin-left: 4px; }
}
.tile.shake .tile-inner { animation: tileShake .24s ease-in-out; }

/* Shuffle spin */
@keyframes tileSpin {
  0%   { transform: scale(1) rotate(0deg); }
  45%  { transform: scale(.45) rotate(-24deg); }
  75%  { transform: scale(1.1) rotate(8deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.tile.spin .tile-inner { animation: tileSpin .5s ease-in-out; }

/* ── Text nổi trong màn (score-fly + nhãn special) ──────────────────
   QA 2026-07-28 (mentor): "txt combo thì mình ko làm nền nhá, xấu lắm" —
   "em chỉ cần cho chữ to hơn với thời gian tồn tại lâu hơn thôi".
   → BỎ HẲN nền + viền + bo góc + padding. Để chữ vẫn đọc được trên board
   sáng thì thay bằng OUTLINE MẢNH (--pop-outline), màu = đúng màu viền cũ.
   Cách vẽ outline: xem khối `.pop-chip, #toast, .combo-pop` ngay bên dưới. */
.pop-chip {
  position: fixed;
  pointer-events: none;
  z-index: 200;
  transform: translate(-50%, -50%);
  font-family: var(--ui-font);
  font-weight: 800;
  white-space: nowrap;
  color: #fff;
  --pop-outline: rgba(9,18,20,.92);   /* JS ghi đè cho nhãn special */
}
/* OUTLINE SẮC NÉT.
   Cách cũ (8 bản text-shadow lệch 1px) cho ra viền LẤM LEM: 8 bản sao chồng
   nhau, chỗ giao thì đậm, khe giữa thì hở → nhìn nhoè. `-webkit-text-stroke`
   cho nét liền, nhưng mặc định nó vẽ ĐÈ LÊN mặt chữ làm chữ mảnh đi —
   `paint-order: stroke fill` đẩy nét ra SAU mặt chữ nên chữ giữ nguyên độ dày
   mà viền vẫn liền mạch. */
.pop-chip, #toast, .combo-pop {
  -webkit-text-stroke: 3px var(--pop-outline);
  paint-order: stroke fill;
}
/* WebView quá cũ không có paint-order → nét sẽ đè lên chữ; lúc đó bỏ stroke và
   quay lại text-shadow 4 hướng (ít bản chồng hơn nên đỡ lấm lem hơn 8 hướng). */
@supports not (paint-order: stroke) {
  .pop-chip, #toast, .combo-pop {
    -webkit-text-stroke: 0;
    text-shadow:
       1px 0 var(--pop-outline), -1px 0 var(--pop-outline),
       0 1px var(--pop-outline),  0 -1px var(--pop-outline);
  }
}
/* Score fly-up: chữ trôi lên & mờ (to hơn chút vì không còn nền đỡ) */
.score-fly {
  font-size: 17px;
  letter-spacing: .5px;
  animation: scoreFlyUp 1s ease-out forwards;
}
@keyframes scoreFlyUp {
  0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  18%  { opacity: 1; transform: translate(-50%,-92%) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%,-168%) scale(.92); }
}
/* Nhãn special (Blaze!/Nova!/Prism!) neo theo tile — bung, giữ, mờ.
   Outline lấy ĐÚNG màu viền cũ (theo loại rune) — JS đặt --pop-outline. */
.special-label {
  font-size: 19px;
  letter-spacing: .5px;
}
@keyframes labelPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
  15%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
  26%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  72%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-64%) scale(.95); }
}
.special-label.pop { animation: labelPop 1.15s ease-out forwards; }

/* ── Combo badge + chữ khen ────────────────────────────────────────
   QA 2026-07-27 muốn combo "nổi lên" và "giữ lâu hơn" → đợt đó tôi bọc chip
   nền + viền. Mentor 2026-07-28 bác: "txt combo thì mình ko làm nền nhá, xấu
   lắm — em chỉ cần cho chữ TO HƠN với THỜI GIAN TỒN TẠI LÂU HƠN thôi".
   Nay: BỎ nền/viền/bo góc/padding, chữ to hơn nữa (32→38px) và giữ nguyên
   animation 1.5s có đoạn đứng yên. Đọc được nhờ OUTLINE mảnh thay vì nền. */
/* CHỒNG CÂU KHEN — mỗi lần combo là MỘT chữ mới, chữ cũ bị ĐÁ LÊN, nhỏ lại và
   mờ đi (QA 2026-07-28: "great đá nice lên trên… cái nào xuất hiện sau thì đá
   cái trước"). Trước đây chỉ có 1 phần tử duy nhất bị ghi đè nên chuỗi combo
   dài chỉ thấy đúng chữ cuối.
   2 lớp lồng nhau vì cả 2 việc đều cần `transform`: lớp NGOÀI cho JS đá lên
   (transition), lớp TRONG cho animation bung–giữ–mờ. */
.combo-pop {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 100;
  text-align: center;
  --pop-outline: rgba(9,18,20,.92);
  transition: transform .22s cubic-bezier(.2,.8,.3,1), opacity .22s ease;
  will-change: transform, opacity;
}
.combo-pop-in { animation: comboIn 1.5s ease-out forwards; }
@keyframes comboIn {
  0%   { opacity: 0; transform: scale(.5); }
  10%  { opacity: 1; transform: scale(1.18); }
  20%  { opacity: 1; transform: scale(1); }
  76%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(.95); }
}
.combo-praise {
  font-size: 30px;          /* QA 2026-07-28: 38px "hơi to" → nhỏ lại */
  font-weight: 800;
  letter-spacing: 1px;
  line-height: 1.1;
}
.combo-pop.kicked .combo-mult { display: none; }
.combo-mult {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffe9b0;
  margin-top: 3px;
}
/* (@keyframes cascadePop đã xoá — câu khen nay dùng .combo-pop-in / comboIn) */

/* ── Tutorial TRỰC TIẾP TRONG MÀN (QA 2026-07-28) ─────────────────
   Thay 3 thẻ text phủ kín bàn bằng: 1 thanh hướng dẫn mỏng NGOÀI bàn + tô
   sáng đúng 2 ô phải chạm trên CHÍNH bàn thật. Người chơi HỌC BẰNG TAY. */
#tut-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 210;
  width: min(94vw, 460px);
  background: var(--chip-bg);
  border: 2px solid rgba(255,255,255,.22);
  border-radius: 16px;
  padding: 10px 16px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
#tut-bar.show { opacity: 1; }
#tut-title { font-size: 16px; font-weight: 800; color: #ffd23f; }
#tut-desc  { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 3px; line-height: 1.35; }
#tut-skip {
  position: fixed;
  z-index: 211;
  right: 14px;
  padding: 7px 14px;
  border-radius: 12px;
  background: var(--chip-bg);
  border: 2px solid rgba(255,255,255,.22);
  color: var(--text);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
#tut-skip.show { opacity: 1; pointer-events: auto; }
/* 2 ô phải chạm — viền vàng dày + nhịp thở, KHÔNG thể nhầm với ô khác */
@keyframes tutTargetPulse {
  0%, 100% { transform: scale(1);    border-color: #ffd23f; }
  50%      { transform: scale(1.07); border-color: #fff2b8; }
}
.tile.tut-target .tile-inner {
  animation: tutTargetPulse .8s ease-in-out infinite;
  border-color: #ffd23f !important;
  border-width: 4px !important;
}
/* Làm mờ mọi ô không liên quan → mắt chỉ còn chỗ cần nhìn.
   NHƯNG phải chừa cả những ô SẼ GHÉP CÙNG (.tut-show): nếu mờ luôn cả chúng thì
   người chơi thấy 2 ô sáng mà không hiểu VÌ SAO đổi 2 ô đó lại ăn. */
.board-tut .tile:not(.tut-target):not(.tut-show) .tile-inner { opacity: .4; }

/* ── Toast (shuffle / thông báo) ───────────────────────────────── */
/* Thông báo trong màn (hết nước đi / đã xáo) — BỎ nền + viền theo QA
   2026-07-28, thay bằng outline mảnh (màu = màu viền cũ, ở đây là trắng nhạt
   nên dùng nền chip cũ để còn tương phản trên board sáng). */
#toast {
  position: fixed;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  --pop-outline: rgba(9,18,20,.92);
  font-weight: 800;
  font-size: 17px;
  z-index: 240;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
#toast.show { opacity: 1; }

/* Banner kết quả (Blaze Storm / Game Over) — CÓ nền chip → không bị chữ khác đè */
#result-banner {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%,-50%);
  z-index: 220;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1px;
  line-height: 1.3;
  text-align: center;
  color: #fff;
  max-width: 86vw;
  background: var(--chip-bg);
  border: 2px solid rgba(255,255,255,.2);
  border-radius: 14px;
  padding: 9px 20px;
}
#result-banner.lose { color: #df5b4c; border-color: rgba(223,91,76,.5); }
#result-banner.small { font-size: 19px; letter-spacing: .5px; padding: 6px 14px; }
/* Banner SỰ KIỆN (Blaze Storm) — QA 2026-07-28: bỏ nền, đặt ở GÓC TRÊN-TRÁI của
   board và NGHIÊNG 30° sang trái. JS đặt left/top theo rect board thật. */
#result-banner.corner {
  background: none;
  border: none;
  padding: 0;
  max-width: none;
  font-size: 23px;
  text-align: left;
  color: #ffb02e;
  --pop-outline: rgba(9,18,20,.92);
  -webkit-text-stroke: 3px var(--pop-outline);
  paint-order: stroke fill;
  transform: translate(0, -100%) rotate(-30deg);
  transform-origin: 0% 100%;
}
@supports not (paint-order: stroke) {
  #result-banner.corner { -webkit-text-stroke: 0;
    text-shadow: 1px 0 var(--pop-outline), -1px 0 var(--pop-outline),
                 0 1px var(--pop-outline), 0 -1px var(--pop-outline); }
}

/* Bóng tối khi hắc ấn nổ — HÌNH TRÒN to dần từ chỗ ô nguyền (clip-path, không tràn layout) */
#doom-veil {
  position: fixed;
  inset: 0;
  z-index: 210;                       /* dưới banner (220), trên board */
  pointer-events: none;
  opacity: 0;
  --dx: 50%; --dy: 45%;               /* JS ghi đè bằng px = tâm ô nguyền */
  background: radial-gradient(circle at var(--dx) var(--dy),
              rgba(10,4,12,.7) 0%, rgba(6,3,10,.95) 72%);
  clip-path: circle(0px at var(--dx) var(--dy));
}
#doom-veil.spread {
  opacity: 1;
  clip-path: circle(150vmax at var(--dx) var(--dy));
  transition: clip-path 1s cubic-bezier(.4,0,.2,1), opacity .45s ease;
}
@keyframes resultPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
  20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
  38%  { transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}
@keyframes bannerFade {     /* fade-in NGAY, không pop/scale (dùng cho game over gần ô nguyền) */
  from { opacity: 0; }
  to   { opacity: 1; }
}
#result-banner.show { animation: resultPop .9s ease-out forwards; }
#result-banner.immediate.show { animation: bannerFade .16s ease-out forwards; }

/* Banner GÓC (Blaze Storm) phải có KEYFRAMES RIÊNG.
   Mọi keyframe của `resultPop` đều đặt `transform`, mà animation GHI ĐÈ khai báo
   thường → `transform` tĩnh của `.corner` (translate + rotate) bị nuốt sạch và
   phép xoay KHÔNG BAO GIỜ chạy trong game thật. Đo được: animationName=resultPop,
   computed transform = matrix(0.5,0,0,0.5,…) ⇒ góc xoay 0°.
   (Ảnh chụp trước đó thấy có xoay chỉ vì harness tắt animation — nó chứng minh
   rule CSS tồn tại, KHÔNG chứng minh nó sống sót khi chơi thật.)
   Nên góc xoay phải nằm TRONG từng keyframe. */
@keyframes cornerPop {
  0%   { opacity: 0; transform: translate(0,-100%) rotate(-30deg) scale(.6); }
  22%  { opacity: 1; transform: translate(0,-100%) rotate(-30deg) scale(1.1); }
  40%  { opacity: 1; transform: translate(0,-100%) rotate(-30deg) scale(1); }
  100% { opacity: 1; transform: translate(0,-100%) rotate(-30deg) scale(1); }
}
/* #id + 2 class → thắng #result-banner.show (#id + 1 class) */
#result-banner.corner.show { animation: cornerPop .9s ease-out forwards; }

/* ── btn3d (game-common §1.4 / popup-common §6 — bản kính phẳng) ── */
.btn3d {
  --radius: 12px;
  --surface-color: rgba(255,255,255,.08);
  --surface-text: var(--text);
  --surface-height: 42px;
  --surface-width: auto;
  --surface-padding-x: 16px;
  --surface-font-size: 18px;
  position: relative;
  display: inline-block;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  font: inherit;
  color: inherit;
  -webkit-user-select: none;
  user-select: none;
}

.btn3d-shadow { display: none; }

.btn3d-surface {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--surface-height);
  width: var(--surface-width);
  padding: 0 var(--surface-padding-x);
  border-radius: var(--radius);
  background: var(--surface-color);
  border: 1px solid var(--glass-border);
  color: var(--surface-text);
  font-family: var(--ui-font);
  font-size: var(--surface-font-size);
  font-weight: 700;
  letter-spacing: .5px;
  transition: transform .09s ease-out, background .1s;
}

.btn3d:active { transform: scale(.94); }
.btn3d:active .btn3d-surface { background: rgba(255,255,255,.14); }

.btn3d.btn-icon {
  --surface-height: 42px;
  --surface-width: 42px;
  --surface-padding-x: 0;
}

/* nút mini (Skip trong tutorial) */
/* Rule CHẾT đã xoá (chỉ còn trong CSS, không nơi nào dùng — sót lại từ v2 khi
   còn menu / how-to / bộ đếm lượt): .btn3d.mini · .restart-ico · .home-ico ·
   .help-ico · .ico-diamond · .moves-danger + @keyframes dangerPulse. */
.back-ico    { width: 52%; height: 52%; fill: currentColor; display: block; }
.sound-ico   { width: 58%; height: 58%; fill: currentColor; display: block; }
#sound-btn .ico-off { display: none; }
#sound-btn.muted .ico-on  { display: none; }
#sound-btn.muted .ico-off { display: block; }

/* ── Game Over popup (game điểm-cao tự vẽ — popup-common §1.1) ─── */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 280;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(6,16,18,.72);
  opacity: 1;
  transition: opacity .25s, visibility 0s;
}
/* `opacity: 0` KHÔNG gỡ lớp phủ khỏi cây composite: nó vẫn là 1 lớp phủ KÍN
   MÀN HÌNH được ghép lại mỗi frame suốt lúc chơi. Thêm `visibility: hidden`
   (trễ đúng bằng thời gian fade) để tắt hẳn sau khi mờ xong. */
.overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .25s, visibility 0s .25s;
}
.ov-card {
  width: min(84%, 340px);
  padding: 26px 24px 22px;
  text-align: center;
  border-radius: 22px;
  background: #2f4a50;
  border: 1.5px solid rgba(255,255,255,.16);
  transform: scale(1);
  transition: transform .25s;
}
.overlay.hidden .ov-card { transform: scale(.9); }
.ov-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 16px;
  color: #ffcf6b;
}
.ov-title.newbest { color: #ffe27a; }
.ov-scores { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
.ov-k { font-size: 11px; letter-spacing: 2px; color: var(--text-soft); font-weight: 800; text-transform: uppercase; }
.ov-v { font-size: 32px; color: #fff; font-weight: 800; white-space: nowrap; }
.ov-v.best { color: #ffd23f; }
.btn3d.ov-play {
  --surface-height: 52px;
  --surface-padding-x: 34px;
  --surface-font-size: 18px;
  --surface-color: #ffb02e;
  --surface-text: #3a2400;
  --radius: 16px;
}
.btn3d.ov-play .btn3d-surface { border: none; }
.btn3d.ov-play:active .btn3d-surface { background: var(--surface-color); }

/* (CSS carousel onboarding đã xoá — tutorial nay dạy thẳng trên bàn, xem #tut-bar) */

/* ── Pause veil ────────────────────────────────────────────────── */
#pause-veil {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8,18,20,.74);
  opacity: 1;
  transition: opacity .2s, visibility 0s;
}
/* như .overlay.hidden — tắt hẳn lớp phủ kín màn sau khi mờ xong */
#pause-veil.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .2s, visibility 0s .2s;
}
.pv-txt {
  font-size: 19px;
  color: #fff;
  letter-spacing: 1px;
}

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 380px) {
  .btn3d.btn-icon { --surface-height: 36px; --surface-width: 36px; }
  .hud-pill { padding: 4px 6px 5px 3px; }
}

/* Landscape: chỉ căn board (không còn sub-strip) */
body.landscape #board-outer { padding: 4px; }
</style>

  return (v !== undefined ? v : (I18N.en[key] !== undefined ? I18N.en[key] : key));
}

function getLanguage() {
  const fromWin = typeof window.language === 'string' ? window.language : null;
  const fromUrl = new URLSearchParams(window.location.search).get('language');
  const raw = fromWin != null ? fromWin : fromUrl;
  return SUPPORTED_LANGS.includes(raw) ? raw : DEFAULT_LANG;
}

function applyUiFont(lang) {
  if (!LATIN_LANGS.has(lang)) {
    document.documentElement.style.setProperty('--ui-font', 'system-ui, sans-serif');
  }
  if (lang === 'ar') document.body.classList.add('lang-ar');
}

/* ================================================================
 * §1. Native bridge (game-common §1–§4 full compliance)
 * ================================================================ */
function post(msg) {
  try {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    } else {
      console.log('[runic-blaze → native]', msg);
      devSimulateNative(msg);
    }
  } catch (e) { /* ignore */ }
}

function sendMessage(type, opts) {
  opts = opts || {};
  post({
    type,
    level: null,                       // game điểm-cao KHÔNG level → luôn null
    result: opts.result   ?? null,
    data:   opts.data     ?? null,
    showModal: opts.showModal === true,
  });
}

function saveData(payload) {
  const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
  sendMessage('save_data', { data });
}

/* ── localStorage 2 tầng (game-common §1.2) ──────────────────── */
const LS_KEY = 'runic_blaze_v1';

function saveLocal(payload) {
  try {
    const s = typeof payload === 'string' ? payload : JSON.stringify(payload);
    localStorage.setItem(LS_KEY, s);
  } catch (e) { /* private mode / quota */ }
}

function readLocal() {
  try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; }
}

/* ?reset=1 → xoá toàn bộ dữ liệu lưu, chơi lại từ đầu (best=0, onboarding hiện lại) */
function isReset() {
  try { return new URLSearchParams(window.location.search).get('reset') === '1'; } catch (e) { return false; }
}

/* ── statusBarHeight (game-common §2 — URL ưu tiên) ──────────── */
function getStatusBarHeight() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('statusBarHeight');
  const fromWin = typeof window.statusBarHeight !== 'undefined' ? window.statusBarHeight : null;
  let h = Number(fromUrl != null ? fromUrl : fromWin);
  if (Number.isNaN(h) || h < 0) h = 0;
  return h;
}

/* ── currentLevel (game-common §3 — window ưu tiên) ──────────── */
function getInitialLevelIdx() {
  const fromWin = typeof window.currentLevel === 'number' ? window.currentLevel : null;
  const fromUrl = new URLSearchParams(window.location.search).get('currentLevel');
  const raw = Number(fromWin != null ? fromWin : fromUrl);
  if (!Number.isFinite(raw) || raw < 1) return -1;   // -1 = không có → tự quyết theo saved data
  return Math.min(Math.floor(raw), MAX_LEVEL_IDX + 1) - 1;
}

/* ── data (game-common §4 — window ưu tiên) ──────────────────── */
function getInitialData() {
  const fromWin = typeof window.data === 'string' ? window.data : null;
  const fromUrl = new URLSearchParams(window.location.search).get('data');
  return fromWin != null ? fromWin : (fromUrl || '');
}

/** Gộp data nhẹ (native ưu tiên) + trạng thái ván nặng (localStorage). */
function parseInitialData() {
  if (isReset()) {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    return null;   // ván sạch: best=0, tutorialSeen=false → onboarding hiện lại
  }
  let nativeObj = null;
  const raw = getInitialData();
  if (raw) { try { nativeObj = JSON.parse(raw); } catch (e) {} }

  let localObj = null;
  const lraw = readLocal();
  if (lraw) { try { localObj = JSON.parse(lraw); } catch (e) {} }

  if (!nativeObj && !localObj) return null;
  const merged = Object.assign({}, localObj || {}, nativeObj || {});
  if (localObj && localObj.game) merged.game = localObj.game;   // ván nặng chỉ có ở local
  return merged;
}
