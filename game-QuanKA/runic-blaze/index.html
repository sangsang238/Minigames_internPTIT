let activePops = [];   // các chữ nổi đang sống → chữ mới "đá" chữ cũ lên

/* CHỮ MỚI ĐÁ CHỮ CŨ LÊN (mentor 2026-07-28):
   "toàn bộ chữ combo xuất hiện từ dưới lên; nếu chữ mới xuất hiện, nó sẽ có
    hiệu ứng ĐÁ chữ cũ lên trên — chữ cũ sống nốt thời gian còn lại rồi mất."
   Cũ là `dodgeOverlap`: chữ MỚI tự né lên trên chữ cũ → chuỗi combo dài thì chữ
   mới bị đẩy mỗi lúc một cao, rời khỏi chỗ vừa nổ, và vẫn đè nhau khi 2 chữ ra
   gần như cùng lúc. Nay ngược lại: chữ mới LUÔN hiện đúng chỗ của nó, chữ cũ bị
   đẩy lên nhường chỗ — thứ tự đọc từ dưới lên, không cần né.
   KHÔNG đụng vào tuổi thọ: mỗi chữ vẫn tự tắt theo timer riêng của nó. */
/* Độ sáng cảm nhận (Rec. 601) — dùng để quyết định outline tối hay sáng */
function isLightHex(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
}

const POP_KICK = 24;        // px mỗi lần bị đá lên (QA: "giảm 1 nửa")
const COMBO_KICK = 30;      // câu khen: cách nhau vừa đủ, không rời khỏi chữ mới

/* comboOnly = true  → chỉ câu khen bị đá (do CÓ câu khen mới)
   comboOnly = false → chỉ chữ điểm/nhãn bị đá (do có chữ điểm/nhãn mới)
   QA 2026-07-28: "PHẢI có chữ mới xuất hiện thì chữ khen cũ mới bị đẩy lên chứ!"
   — trước đây score-fly/nhãn special cũng đá câu khen, nên câu khen tự nhảy lên
   dù chẳng có câu khen nào mới, và mỗi combo bị đá 2 lần ⇒ khoảng cách gấp đôi. */
function kickPopsUp(comboOnly) {
  for (const p of activePops) {
    if (!!p.combo !== !!comboOnly) continue;   // khác nhóm → không đụng
    p.kick = (p.kick || 0) + 1;
    if (p.combo) {
      /* câu khen: đá lên + NHỎ LẠI + MỜ ĐI (đúng mô tả "nice bị đá lên trên
         nhỏ lại và mờ đi"). Opacity ở lớp ngoài nhân với opacity của animation
         lớp trong → mờ dần cộng hưởng, không giật. */
      const dy = p.kick * COMBO_KICK;
      const sc = Math.max(0.55, 1 - p.kick * 0.16);
      const op = Math.max(0, 1 - p.kick * 0.26);
      p.el.style.transform = `translate(-50%, calc(-50% - ${dy}px)) scale(${sc})`;
      p.el.style.opacity = String(op);
      /* Câu đã bị đá thì bỏ dòng "COMBO ×n", chỉ còn CHỮ KHEN — nhờ vậy khối
         thấp lại (~33px) nên khoảng cách 30px vẫn không chồng chữ. */
      p.el.classList.add('kicked');
    } else {
      p.y -= POP_KICK;
      p.el.style.top = p.y + 'px';
    }
  }
}

function trackPop(el, x, y, ms, combo) {
  const rec = { x, y, el, combo: !!combo, kick: 0 };
  activePops.push(rec);
  const kill = () => { if (el.parentNode) el.remove(); activePops = activePops.filter(p => p !== rec); };
  el.addEventListener('animationend', kill, { once: true });
  setTimeout(kill, ms);
}
/** Dọn sạch mọi chip nổi còn sót khi vào ván mới. */
function clearPops() {
  document.querySelectorAll('.pop-chip, .combo-pop').forEach(el => el.remove());
  activePops = [];
}

function spawnScoreFly(boardR, boardC, pts, mult) {
  const rect = boardRect();
  const x = rect.left + boardC * cellPx + cellPx * 0.5;
  const y = rect.top + boardR * cellPx + cellPx * 0.5;
  kickPopsUp(false);                  // nhường chỗ: chỉ chữ điểm/nhãn cũ bị đá
  const el = document.createElement('div');
  el.className = 'pop-chip score-fly';
  el.textContent = (mult > 1 ? `×${mult} ` : '') + `+${pts}`;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  trackPop(el, x, y, 1300);
}

/** Nhãn chip neo theo 1 tile (special / hắc ấn / arcane surge).
 *  Mặc định TRÊN tile; nếu tile nằm DƯỚI câu khen (badge ~42% màn) thì để DƯỚI
 *  tile → luôn né khỏi câu khen ở giữa; và đẩy hẳn ra khỏi badge nếu trùng dải. */
function spawnTileLabel(r, c, text, borderColor) {
  const rect = boardRect();
  const cx = rect.left + c * cellPx + cellPx * 0.5;
  const tileTop = rect.top + r * cellPx;
  const tileBot = tileTop + cellPx;
  const badgeY = window.innerHeight * 0.42;                 // dải câu khen combo
  const below = (tileTop + tileBot) / 2 >= badgeY;          // tile dưới câu khen → nhãn xuống dưới tile
  let y = below ? tileBot + 22 : tileTop - 22;
  kickPopsUp(false);                                        // nhường chỗ cho nhãn mới
  /* Né dải câu khen ở giữa màn (câu khen nay là các .combo-pop chồng nhau) */
  if (document.querySelector('.combo-pop') && Math.abs(y - badgeY) < 46) {
    y = below ? badgeY + 52 : badgeY - 52;
  }
  y = Math.max(52, Math.min(window.innerHeight - 34, y));   // kẹp trong màn
  const el = document.createElement('div');
  el.className = 'pop-chip special-label pop';
  el.textContent = text;
  el.style.top = y + 'px';
  /* Màu SÁNG (vd Arcane Surge #ffd23f) làm outline quanh chữ TRẮNG thì thành
     "chữ trắng nền vàng", chói và khó đọc (QA 2026-07-28). Xét độ sáng để tự
     đảo vai: màu sáng → cho vào CHỮ, outline lấy nền tối; màu tối/đậm (Blaze
     đỏ, Cursed đỏ máu…) thì giữ chữ trắng + outline màu như cũ. */
  if (isLightHex(borderColor)) {
    el.style.color = borderColor;
    el.style.setProperty('--pop-outline', 'rgba(9,18,20,.92)');
  } else {
    el.style.setProperty('--pop-outline', borderColor);
  }
  document.body.appendChild(el);
  // kẹp ngang: chip dài (vd "✦ Arcane Surge!") ở cột rìa không được tràn khỏi màn
  const half = el.offsetWidth / 2 + 8;
  const cxc = Math.max(half, Math.min(window.innerWidth - half, cx));
  el.style.left = cxc + 'px';
  trackPop(el, cxc, y, 1550);
}
/** Nhãn special vừa rèn (Blaze!/Nova!/Prism!) — viền màu theo loại rune. */
function spawnSpecialLabel(r, c, kind, color) {
  const key = kind === K_PRISM ? 'nmPrism' : (kind === K_NOVA ? 'nmNova' : 'nmBlaze');
  /* Prism: viền cũ là bạc #dfe6ee — dùng làm outline cho chữ TRẮNG thì gần như
     vô hình, trái mục đích "để tránh khó đọc". Lấy màu THÂN ô prism (#6a6f96)
     — vẫn là "màu của chính nó" mà đủ tương phản. */
  spawnTileLabel(r, c, t(key), kind === K_PRISM ? '#4d5273' : RUNE_HEX[color]);
}

/* Mỗi lần combo sinh MỘT câu khen mới; câu cũ bị đá lên, nhỏ lại, mờ đi rồi tự
   hết đời (giữ nguyên tuổi thọ của nó — không bị cắt sớm). */
function showComboBadge(chain) {
  const tier = Math.min(chain - 2, 4);
  const cols = ['#9fd0ff', '#7dffb0', '#ffd23f', '#ff9a3d', '#ff5a8f'];
  kickPopsUp(true);                              // CHỈ câu khen cũ bị đá lên

  const el = document.createElement('div');
  el.className = 'combo-pop';
  const inner = document.createElement('div');
  inner.className = 'combo-pop-in';
  const p = document.createElement('div');
  p.className = 'combo-praise';
  p.textContent = t('praise')[tier];
  p.style.color = cols[tier];                    // màu bậc combo nằm ở CHỮ
  const m = document.createElement('div');
  m.className = 'combo-mult';
  m.textContent = `${t('combo')} ×${Math.min(chain, CHAIN_CAP)}`;
  inner.appendChild(p); inner.appendChild(m);
  el.appendChild(inner);
  document.body.appendChild(el);
  trackPop(el, window.innerWidth / 2, window.innerHeight * 0.42, 1550, true);
}
/** Dọn câu khen (vào ván mới / hiện banner kết quả). */
function clearComboPops() {
  document.querySelectorAll('.combo-pop').forEach(el => el.remove());
  activePops = activePops.filter(p => !p.combo);

/* ================================================================
 * §19. Game Over (endless score-attack — corruption nuốt board)
 * ================================================================ */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

let bannerTimer = null;
/* opts: { lose, holdMs, x, y, small, immediate }
 *   - x,y (px)  → neo banner tại 1 điểm (vd gần ô nguyền); bỏ trống → giữa màn
 *   - small     → cỡ chữ nhỏ, dễ đọc
 *   - immediate → fade-in NGAY (không pop/scale)
 *   - holdMs    → tự ẩn sau ms (event); bỏ trống → giữ tới Play Again (game over) */
function showResultBanner(text, opts) {
  opts = opts || {};
  clearComboPops();                    // don cau khen -> khong de len banner
  const el = $('result-banner');
  clearTimeout(bannerTimer); bannerTimer = null;
  el.textContent = text;
  el.classList.toggle('lose', !!opts.lose);
  el.classList.toggle('small', !!opts.small);
  el.classList.toggle('immediate', !!opts.immediate);
  el.classList.toggle('corner', !!opts.corner);
  if (opts.corner) {
    /* Góc TRÊN-TRÁI của board thật (không phải của màn hình) */
    const r = boardRect();
    el.style.left = Math.max(10, r.left + 6) + 'px';
    el.style.top  = Math.max(64, r.top - 10 + cellPx) + 'px';   // QA: kéo xuống 1 tile
  } else if (opts.x != null && opts.y != null) {
    el.style.left = opts.x + 'px'; el.style.top = opts.y + 'px';
  } else { el.style.left = '50%'; el.style.top = '40%'; }
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  if (opts.holdMs) bannerTimer = setTimeout(hideResultBanner, opts.holdMs);
}
function hideResultBanner() {
  const el = $('result-banner');
  clearTimeout(bannerTimer); bannerTimer = null;
  el.classList.remove('show', 'lose', 'small', 'immediate', 'corner');
  el.style.left = '50%'; el.style.top = '40%';
  const veil = $('doom-veil');   // dọn màn đêm khi vào ván mới
  if (veil) { veil.classList.remove('spread'); veil.classList.add('hidden'); }
}

function maybeAds() {
  endCounter++;
  if (endCounter % ADS_EVERY === 0) sendMessage('ads');
}

/* Fallback: hết nước đi (hiếm — auto-shuffle lo trước) → kết thúc ván. */
function checkEnd(ep) {
  if (ended || tutorialMode || ep !== levelEpoch) return;
  if (!findHintMove()) {
    ended = true;
    gameOver(ep);
  }
}

/* DEATH SCREEN phải đủ dài để người chơi KỊP THẤY mình thua vì cái gì, trước
   khi popup che mất (QA 2026-07-28). Cũ: hết nước đi 0.95s, hắc ấn nổ ~1.36s —
   popup ập lên gần như ngay lúc cảnh nổ còn đang chạy (riêng transition bóng
   tối đã 1s). */
const DEATH_HOLD_MS = 2300;   // nhánh "hết nước đi"
const BOOM_HOLD_MS  = 700;    // QA cat 1 nua: 160+340+700 = ~1.2s (truoc ~2.4s)

/* Game Over — game điểm-cao tự vẽ popup (popup-common §1.1) */
async function gameOver(ep, boom) {
  deselect(); clearHint();
  persistBest();
  if (boom) {                          // thua vì hắc ấn nổ → cảnh nổ tự lo tiếng + chữ gần ô
    await cursedDetonate(ep, boom);
    if (ep !== levelEpoch) return;
  } else {
    sLose();
    showResultBanner(t('overBanner'), { lose: true });   // hết nước đi → banner giữa màn
    screenShake(10);
    spawnFlash(window.innerWidth * 0.5, window.innerHeight * 0.42, 160);
    await sleep(DEATH_HOLD_MS);
    if (ep !== levelEpoch) return;
  }
  maybeAds();
  showGameOverPopup();
  // endless (§1.1): result=null, showModal=false — game tự lo Play Again
  sendMessage('game_result');
}

/* Hắc ấn về 0 → phát nổ: dựng cảnh ~1.5s để người chơi THẤY RÕ chính ô nguyền
   phát nổ và bóng tối (hình TRÒN) lan ra nuốt board, TRƯỚC khi popup Game Over. */
async function cursedDetonate(ep, boom) {
  const ctr = boardCellCenter(boom.r, boom.c);
  const tl = board[boom.r] && board[boom.r][boom.c];
  // 1) Ô nguyền rung & nứt tại chỗ (0.15s) — chỉ mặt nó, chưa nổ hẳn
  if (tl && tl.el) tl.el.classList.add('curse-boom');
  spawnFlash(ctr.x, ctr.y, cellPx * 2.2);
  spawnBurst(ctr.x, ctr.y, CURSE_HEX, 12, 280);
  screenShake(9);
  await sleep(160);
  if (ep !== levelEpoch) return;
  // 2) NỔ: shockwave đỏ + sóng đen + mưa hạt, rung mạnh
  spawnFlash(ctr.x, ctr.y, cellPx * 4.5);
  spawnRing(ctr.x, ctr.y, CURSE_HEX, cellPx * 4);
  spawnRing(ctr.x, ctr.y, '#3a0d16', cellPx * 6.5);
  spawnBurst(ctr.x, ctr.y, CURSE_HEX, 26, 440);
  spawnBurst(ctr.x, ctr.y, '#1a0712', 16, 340);
  screenShake(22);
  sLose();                             // tiếng thua vang ngay lúc nổ
  // 3) Bóng tối HÌNH TRÒN lan từ đúng ô nguyền ra kín màn hình (transition 1s)
  const veil = $('doom-veil');
  if (veil) {
    veil.style.setProperty('--dx', ctr.x + 'px');
    veil.style.setProperty('--dy', ctr.y + 'px');
    veil.classList.remove('hidden');
    void veil.offsetWidth;             // reflow để transition chạy
    veil.classList.add('spread');
  }
  // 4) Chữ "And the dark emerges" HIỆN NGAY gần ô nguyền — fade-in tức thì, cỡ nhỏ
  const rect = boardRect();
  const tileTop = rect.top + boom.r * cellPx, tileBot = tileTop + cellPx;
  let by = tileTop - 30; if (by < 84) by = tileBot + 30;
  const bx = clamp(ctr.x, window.innerWidth * 0.32, window.innerWidth * 0.68);
  showResultBanner(t('overBanner'), { lose: true, small: true, immediate: true, x: bx, y: by });
  await sleep(340);
  if (ep !== levelEpoch) return;
  spawnRing(ctr.x, ctr.y, CURSE_HEX, cellPx * 7);
  await sleep(BOOM_HOLD_MS);           // tổng ~1.2s trước khi popup
}

function showGameOverPopup() {
  const isNew = recordHit || score > runRecord;
  const title = $('ov-title');
  title.textContent = isNew ? t('newBest') : t('gameOver');
  title.classList.toggle('newbest', isNew);
  $('ov-score').textContent = score;
  $('ov-best').textContent = best;
  renderBest();
  fitOverlayScores();
  $('overlay').classList.remove('hidden');
}

/* Co cỡ điểm cho vừa card khi nhiều chữ số (popup-common §5b) */
function fitOverlayScores() {
  const row = document.querySelector('.ov-scores');
  if (!row) return;
  const card = row.closest('.ov-card');
  const vals = row.querySelectorAll('.ov-v');
  vals.forEach(v => { v.style.fontSize = ''; });
  const pad = parseFloat(getComputedStyle(card).paddingLeft) || 24;
  const max = card.clientWidth - 2 * pad;
  let fz = 32;
  while (row.scrollWidth > max && fz > 15) { fz -= 1; vals.forEach(v => { v.style.fontSize = fz + 'px'; }); }
}

/* ================================================================
 * §20. Persistence (game-common §1.2) — 2 tầng:
 *   - persistBest: data nhẹ → native + localStorage
 *   - saveCurrentState: board snapshot → localStorage (để restore khi refresh)
 * ================================================================ */
function persistBest() {
  const p = { best, muted, tutorialSeen };
  saveData(p);   // native save_data
  // localStorage cập nhật qua saveCurrentState / clearSavedGame
}
function persistLight() { persistBest(); }

/** Lưu toàn bộ trạng thái ván vào localStorage (game-common §1.2). */
function saveCurrentState() {
  if (ended || !board.length) return;
  const snap = board.map(row => row.map(t => t ? { c: t.color, k: t.kind } : null));
  saveLocal({
    best, muted, tutorialSeen,
    game: { snap, score, turnCount, cursedIdx, sinceCursed, nColors, nextSurge, nextStorm },
  });
}

/** Xoá game state khỏi localStorage (giữ meta: best/muted/tut). */
function clearSavedGame() {
  saveData({ best, muted, tutorialSeen });
  saveLocal({ best, muted, tutorialSeen });
}

/* ================================================================
 * §21. New run (score-attack — không level, không intro)
 * ================================================================ */
function newRun() {
  levelEpoch++;
  const ep = levelEpoch;
  flushTweens();
  clearTimeout(resultTimer);
  tutorialMode = false;
  $('overlay').classList.add('hidden');

  nColors = 5;
  score = 0; dispScore = 0;
  runRecord = best;
  recordHit = false;
  turnCount = 0;
  cursedIdx = 0; sinceCursed = 99;
  nextSurge = SURGE_EVERY; nextStorm = STORM_EVERY;
  busy = true; ended = false;
  selected = null; lastSwapCells = null;
  clearHint();
  particles = [];
  clearPops();
  shakeAmp = 0; wrapEl.style.transform = '';
  hideResultBanner();
  $('score-val').textContent = '0';
  renderBest();
  tileIdCtr = 0;
  boardEl.innerHTML = '';
  board = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  updateLabels();
  resize();

  (async () => {
    await sleep(30);   // đợi resize RAF tính cellPx
    if (ep !== levelEpoch) return;
    await fillBoard();
    if (ep !== levelEpoch) return;
    await ensureMovable(ep);
    if (ep !== levelEpoch) return;
    busy = false;
    if (!tutorialSeen) startTutorial();   // lần đầu: dạy ngay TRÊN bàn vừa dựng
  })();
}

/* ================================================================
 * §21b. Restore ván dở từ localStorage (game-common §1.2)
 * ================================================================ */
function tryRestoreRunState(g) {
  try {
    if (!g || !g.snap || !Array.isArray(g.snap) || g.snap.length !== ROWS) { newRun(); return; }
    levelEpoch++;
    const ep = levelEpoch;
    flushTweens(); clearTimeout(resultTimer);
    tutorialMode = false;
    $('overlay').classList.add('hidden');

    score       = Number.isFinite(+g.score)       ? Math.floor(+g.score)       : 0;
    turnCount   = Number.isFinite(+g.turnCount)   ? Math.floor(+g.turnCount)   : 0;
    cursedIdx   = Number.isFinite(+g.cursedIdx)   ? Math.floor(+g.cursedIdx)   : 0;
    sinceCursed = Number.isFinite(+g.sinceCursed) ? Math.floor(+g.sinceCursed) : 99;
    nColors     = Number.isFinite(+g.nColors)     ? Math.floor(+g.nColors)     : 5;
    nextSurge   = Number.isFinite(+g.nextSurge)   ? Math.floor(+g.nextSurge)   : SURGE_EVERY;
    nextStorm   = Number.isFinite(+g.nextStorm)   ? Math.floor(+g.nextStorm)   : STORM_EVERY;
    runRecord = best; recordHit = false;
    busy = true; ended = false;
    selected = null; lastSwapCells = null;
    clearHint(); particles = []; clearPops(); shakeAmp = 0; wrapEl.style.transform = '';
    hideResultBanner();
    $('score-val').textContent = String(score);
    renderBest(); updateLabels();

    tileIdCtr = 0;
    boardEl.innerHTML = '';
    board = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = g.snap[r] && g.snap[r][c];
        if (cell !== null && cell !== undefined && typeof cell.c === 'number') {
          const k = (typeof cell.k === 'number' && cell.k >= 0 && cell.k <= 5) ? cell.k : K_NORMAL;
          board[r][c] = makeTile(cell.c, k);
        }
      }
    }
    resize(); layoutAllStatic();
    (async () => {
      await sleep(30);
      if (ep !== levelEpoch) return;
      await ensureMovable(ep);
      if (ep !== levelEpoch) return;
      busy = false;
    })();
  } catch (e) {
    clearSavedGame();
    newRun();
  }
}

/* ================================================================
 * §22. Tutorial TRỰC TIẾP TRONG MÀN (thay carousel 3 thẻ text)
 *
 * QA 2026-07-28: "tutorial thay text bằng hướng dẫn trực tiếp trong màn chơi
 * thì hay hơn". Cũ: 3 thẻ mô tả phủ kín bàn, người chơi chỉ bấm Next → đọc
 * xong vẫn không biết phải làm gì. Nay: game DỰNG SẴN thế cờ trên CHÍNH bàn
 * thật, tô sáng đúng 2 ô cần đổi, làm mờ phần còn lại, và CHỈ nhận đúng nước
 * đó — học bằng tay, không bằng chữ.
 *
 * Chữ vẫn dùng nguyên bộ khoá ob1T…ob3D đã dịch đủ 23 locale — chỉ đổi CHỖ
 * hiện (thanh mỏng ngoài bàn thay vì thẻ phủ kín) → KHÔNG phát sinh dịch mới,
 * giữ đúng quy ước "chỉ tutorial được localize".
 * ================================================================ */
let onboarding = false;      // giữ nguyên tên: nhiều guard input đang đọc cờ này
const OB_STEPS = ['match', 'special', 'cursed'];
let obStep = 0;
let tutWant = null;          // {a:{r,c}, b:{r,c}} — cặp ô DUY NHẤT được phép đổi

/* ── dựng thế cờ ─────────────────────────────────────── */
function tutSet(r, c, color) {
  const tl = board[r] && board[r][c];
  if (tl) morphTile(tl, color, K_NORMAL);
}

/* Dựng thế xong phải VÁ xung quanh: ô NÀO NGOÀI thế cờ mà đang lỡ nằm trong
   run ≥3 thì đổi màu — không thì bàn tự nổ trước khi người chơi kịp chạm. */
function tutClearStrayRuns(locked) {
  for (let pass = 0; pass < 80; pass++) {
    let bad = null;
    for (let r = 0; r < ROWS && !bad; r++) {
      for (let c = 0; c < COLS && !bad; c++) {
        if (locked.has(r + ',' + c)) continue;
        const tl = board[r][c];
        if (tl && tl.kind === K_NORMAL && liveRunAt(r, c)) bad = { r, c };
      }
    }
    if (!bad) return true;
    const tl = board[bad.r][bad.c];
    for (let k = 1; k <= nColors; k++) {
      morphTile(tl, (tl.color + k) % nColors, K_NORMAL);
      if (!liveRunAt(bad.r, bad.c)) break;
    }
  }
  return false;
}

/* Thế: hàng r = X X Y (len 4 thì X X Y X), ngay DƯỚI ô Y là X.
   Đổi 2 ô cột c+2 → hàng r thành X X X (hoặc X X X X → rèn Blaze).
   Trước khi đổi KHÔNG có match nào, nên bàn đứng yên chờ người chơi. */
function tutPlantRow(r, c, len) {
  const X = 0, Y = 2;                     // 2 màu tương phản rõ (đỏ / lục)
  const locked = new Set();
  const lock = (rr, cc) => locked.add(rr + ',' + cc);
  tutSet(r, c, X);         lock(r, c);
  tutSet(r, c + 1, X);     lock(r, c + 1);
  tutSet(r, c + 2, Y);     lock(r, c + 2);
  if (len >= 4) { tutSet(r, c + 3, X); lock(r, c + 3); }
  tutSet(r + 1, c + 2, X); lock(r + 1, c + 2);
  tutClearStrayRuns(locked);
  /* show = các ô SẼ GHÉP CÙNG sau khi đổi — giữ sáng để thấy rõ nước ăn */
  const show = [{ r, c }, { r, c: c + 1 }];
  if (len >= 4) show.push({ r, c: c + 3 });
  return { a: { r, c: c + 2 }, b: { r: r + 1, c: c + 2 }, show };
}

/* Bước 3: thêm 1 Hắc Ấn NẰM KỀ ô đầu của hàng sắp nổ → nổ xong là phá được,
   đúng bài học "cho nổ CẠNH nó". Ngòi 5 để tutorial không thể thua. */
function tutPlantCursed(r, c) {
  const want = tutPlantRow(r, c, 3);
  const tl = board[r + 1] && board[r + 1][c];
  if (tl) {
    tl.curse = 5;
    morphTile(tl, tl.color, K_CURSED);
    renderCursed(tl);
    want.show.push({ r: r + 1, c });   // Hắc Ấn phải SÁNG — nó là nhân vật chính bước này
  }
  return want;
}

/* ── hiển thị ──────────────────────────────────────── */
/* Thanh hướng dẫn nằm giữa header và bàn — KHÔNG che bàn (cả bài học nằm
   trên bàn nên che là hỏng ý đồ). Hụt chỗ thì rơi xuống sát đáy màn hình. */
function layoutTutBar() {
  const bar = $('tut-bar'), skip = $('tut-skip');
  const hd = $('topbar');
  const headB = hd ? hd.getBoundingClientRect().bottom : 60;
  const boardT = wrapEl.getBoundingClientRect().top;
  const barH = bar.getBoundingClientRect().height || 56;
  let top = headB + (boardT - headB - barH) / 2;
  if (!(top > headB + 2) || top + barH > boardT - 2) {
    top = Math.max(headB + 6, window.innerHeight - barH - 16);
  }
  bar.style.top = top + 'px';
  skip.style.top = (headB + 6) + 'px';
}

function tutHighlight(want) {
  clearTutHighlight();
  tutWant = want;
  boardEl.classList.add('board-tut');
  [want.a, want.b].forEach(p => {
    const tl = board[p.r] && board[p.r][p.c];
    if (tl) tl.el.classList.add('tut-target');
  });
  (want.show || []).forEach(p => {
    const tl = board[p.r] && board[p.r][p.c];
    if (tl) tl.el.classList.add('tut-show');
  });
}

function clearTutHighlight() {
  boardEl.classList.remove('board-tut');
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tl = board[r] && board[r][c];
      if (tl) tl.el.classList.remove('tut-target', 'tut-show');
    }
  }
  tutWant = null;
}

/* Chạm nhầm ô khác → không làm gì, chỉ lắc 2 ô đúng cho dễ thấy */
function tutNudge() {
  if (!tutWant) return;
  [tutWant.a, tutWant.b].forEach(p => {
    const tl = board[p.r] && board[p.r][p.c];
    if (!tl) return;
    tl.el.classList.add('shake');
    setTimeout(() => tl.el.classList.remove('shake'), 280);
  });
}

function tutIsWanted(r1, c1, r2, c2) {
  if (!tutWant) return true;
  const a = tutWant.a, b = tutWant.b;
  return (a.r === r1 && a.c === c1 && b.r === r2 && b.c === c2)
      || (a.r === r2 && a.c === c2 && b.r === r1 && b.c === c1);
}

function tutRunStep(step) {
  obStep = step;
  const kind = OB_STEPS[step];
  const want = kind === 'match'   ? tutPlantRow(3, 1, 3)
             : kind === 'special' ? tutPlantRow(3, 1, 4)
             :                      tutPlantCursed(3, 1);
  const n = step + 1;
  $('tut-title').textContent = t('ob' + n + 'T');
  $('tut-desc').textContent  = t('ob' + n + 'D');
  $('tut-bar').classList.add('show');
  $('tut-skip').classList.add('show');
  $('tut-skip').textContent = t('skip');
  layoutTutBar();
  tutHighlight(want);
}

function startTutorial() {
  onboarding = true;
  tutorialMode = true;
  tutRunStep(0);
}

/* Gọi sau khi người chơi đi ĐÚNG nước được dạy và bàn đã lắng. */
async function tutAdvance(ep) {
  if (!onboarding) return;
  clearTutHighlight();
  if (obStep >= OB_STEPS.length - 1) { finishTutorial(); return; }
  await sleep(420);
  if (ep !== levelEpoch || !onboarding) return;
  tutRunStep(obStep + 1);
}

function finishTutorial() {
  clearTutHighlight();
  onboarding = false;
  tutorialMode = false;
  tutorialSeen = true;
  persistBest();
  $('tut-bar').classList.remove('show');
  $('tut-skip').classList.remove('show');
}

/* ================================================================
 * §23. Pause (không còn Menu/How-to-play/Confirm)
 * ================================================================ */
function pauseGame() {
  if (paused) return;
  paused = true;
  $('pause-veil').classList.remove('hidden');
  if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
}
function resumeGame() {
  if (!paused) return;
  paused = false;
  $('pause-veil').classList.add('hidden');
  audioUnlock();
}

/* nút bấm — kèm hỗ trợ Enter/Space cho div role=button */
function onTap(id, fn) {
  const el = $(id);
  el.addEventListener('click', e => { e.stopPropagation(); fn(); });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
  });
}

onTap('back-btn', () => { sButton(); persistBest(); sendMessage('quit'); });
onTap('sound-btn', () => { audioUnlock(); setMuted(!muted); sButton(); });
onTap('ov-btn', () => { sButton(); sendMessage('retry_level'); newRun(); });   // Play Again (§1.1)
onTap('tut-skip', () => { sButton(); finishTutorial(); });

$('pause-veil').addEventListener('pointerdown', () => { resumeGame(); }, { passive: true });

document.addEventListener('pointerdown', audioUnlock, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { persistBest(); pauseGame(); }
});

/* ================================================================
 * §24. Native callbacks (game-common §1.3)
 * ================================================================ */
window.onAppPause  = function () { persistBest(); pauseGame(); };
window.onAppResume = function () { audioUnlock(); };
window.onNextLevel = function () { /* endless: không có level kế */ };
window.onRetryLevel = function () { newRun(); };   // native gọi Play Again → ván mới

/* ================================================================
 * §25. Boot (game-common §3 waitForNativeInjection)
 * ================================================================ */
function bootGame() {
  LANG = getLanguage();
  applyUiFont(LANG);
  document.documentElement.lang = LANG;
  measureEnvSafeTop();

  const saved = parseInitialData();
  if (saved) {
    if (typeof saved.best === 'number' && saved.best > 0) best = Math.floor(saved.best);
    muted = !!saved.muted;
    tutorialSeen = !!saved.tutorialSeen;
  }

  $('sound-btn').classList.toggle('muted', muted);
  renderBest();
  updateLabels();
  resize();
  initBgItems();
  requestAnimationFrame(mainLoop);

  // Không menu: restore ván dở nếu có, không thì newRun (lần đầu sẽ bật onboarding)
  const g = saved && saved.game;
  if (g && g.snap) tryRestoreRunState(g);
  else newRun();
}

// Poll native inject, fallback 200ms (game-common §3)
(function waitForNativeInjection() {
  const start = Date.now();
  (function check() {
    if (typeof window.currentLevel === 'number' ||
        typeof window.language === 'string' ||
        typeof window.data === 'string' ||
        Date.now() - start > 200) {
      bootGame();
    } else {
      setTimeout(check, 10);
    }
  })();
})();
</script>
